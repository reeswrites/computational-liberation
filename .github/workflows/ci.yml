name: ci
on:
  push:
  pull_request:

# This repo has no Python package of its own: it is data (data/institutions) and documents,
# run through philosophy-engine, which pyproject.toml pins as an editable path dependency at
# ../philosophy-engine. CI therefore checks out both repos as siblings under the runner workspace:
#   $GITHUB_WORKSPACE/computational-liberation   (this repo)
#   $GITHUB_WORKSPACE/philosophy-engine          (the engine)
# Every uv command runs from inside computational-liberation so the engine resolves data/ from here.
# The engine is checked out at the commit in ENGINE_PIN (one line, full SHA), so a dataset result is
# reproducible against the engine it was produced with; the pin must be pushed in philosophy-engine first.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: computational-liberation
    steps:
      - uses: actions/checkout@v4
        with:
          path: computational-liberation
      - id: pin
        run: echo "sha=$(cat ENGINE_PIN)" >> "$GITHUB_OUTPUT"   # engine commit this dataset was run against; bump with each "Sync dataset"
      - uses: actions/checkout@v4
        with:
          repository: reeswrites/philosophy-engine
          path: philosophy-engine
          ref: ${{ steps.pin.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --python 3.14
      - run: uv run pytest -q                      # this repo's own tests (dataset claims); the engine's suite runs in its own CI
      - run: uv run phil rules check-all
      - run: uv run phil rules diff --baseline data/verdicts-baseline.json   # golden verdicts; exit 1 on any changed or removed row

  gate:
    name: gate (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: computational-liberation
    steps:
      - uses: actions/checkout@v4
        with:
          path: computational-liberation
      - id: pin
        run: echo "sha=$(cat ENGINE_PIN)" >> "$GITHUB_OUTPUT"   # engine commit this dataset was run against; bump with each "Sync dataset"
      - uses: actions/checkout@v4
        with:
          repository: reeswrites/philosophy-engine
          path: philosophy-engine
          ref: ${{ steps.pin.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync --python 3.14
      - run: uv run phil rules gate
