# Bibliography for the works cited by rule `source` strings in data/institutions/src/*.yaml.
# Contract: plans/sourcing.md (one entry per work; ids unique across every data/sources/*.yaml).
# Built 2026-11-05 from the repo's own text only: nothing here was opened in that session. A field the repo text
# does not give (a given name, a title, a URL, a year) is null, and the note says "not in repo text".
# Exception: the five entries merged from data/sources/backtests.yaml (geddes-lueck-tennyson-2007, khan-1996,
# chused-1984, chused-1983, ny-mwpa-1848) carry fields that backtests.yaml filled from search leads or an earlier
# batch's [F] read (titles, given names, containers, pages, URLs). Their notes say which, after "| merged from";
# where a note's first part says "not in repo text", the field was filled at the merge from that lead, not from repo
# text. A lead is not a reading: treat those fields as unconfirmed until the work is opened.
# Author lists give surnames only where the repo gives no given name.

