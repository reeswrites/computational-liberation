id: hospital-visitation
name: 'US hospital visitation after 42 CFR 482.13(h) (2011): the patient designates visitors; the staff gate remains as a norm the rule overrides'
extends: hospital-visitation-pre2011
roles_add:
- name: surveyor
  gloss: the state survey agency acting for CMS; enforces the Conditions of Participation
fluents_add:
- name: designated
  arity: 2
  gloss: p has designated x as a visitor (482.13(h)(2))
  arg_roles: [patient, partner]
actions_add:
- name: designate
  args: [p, x]
  arg_roles: [patient, partner]
  effects:
  - fluent: designated
    args: [p, x]
    value: true
- name: cite
  args: [v, o]
  arg_roles: [surveyor, hospital]
  effects: []
rules_replace:
- id: R3
  plain: '(practice, not written; overridden where the patient has designated the visitor) Staff must not admit as a visitor anyone they do not count as family and whom the patient has not designated, or else the hospital may reprimand them (R6).'
  attribute: staff
  deontic: must_not
  aim: (admit_visitor s x p)
  conditions: (and (not (counts_as_family p x)) (not (designated p x)))
  or_else: R6
  strand: tying
  implicit: true
  kind: norm
  sanctioner: institution
  function: sorts_who_belongs
  source: 'The pre-2011 staff norm (hospital-visitation-pre2011 R3), retained. The 2011 rule does not delete it; it overrides it where the patient has designated the visitor, which strict compliance can only express as a narrowing of the norm''s condition (ASSUMED encoding of ''overrides but does not delete''; a norm kept at full width would contradict R9 and leave no compliant trace). That the norm persisted is anecdotal: a registered domestic partner was denied access at a Las Vegas hospital in 2012, ''It didn''t matter that we were registered domestic partners'' (hv-nv-2012, opened by the worklist); no rate exists (no compliance study found, plans/informal-rules.md R1). Baseline evidence as before: ''no more restrictive than those that immediate family members enjoy'' (hv-presmemo-2010).'
  provenance:
  - source_id: hv-nv-2012
    pin: null
    jurisdiction: US-NV
    effective_date: '2012-08-21'
    verification: opened
    excerpt: It didn't matter that we were registered domestic partners
    accessed: '2026-11-08'
    url: https://www.nbcnews.com/news/world/nv-hospital-denies-rights-domestic-partners-flna957300
    note: 'opened by the worklist (summary-mediated); one anecdote, not a rate; the hospital''s stated ground was its admissions policy'
  - source_id: hv-presmemo-2010
    pin: para. 1
    jurisdiction: US
    effective_date: '2010-04-15'
    verification: opened
    excerpt: no more restrictive than those that immediate family members enjoy
    accessed: '2026-11-08'
    url: https://obamawhitehouse.archives.gov/the-press-office/presidential-memorandum-hospital-visitation
    note: 'opened by the worklist (summary-mediated); the pre-rule baseline the norm encodes'
  var_roles:
    s: staff
    x: partner
    p: patient
rules_add:
- id: R9
  plain: Staff must admit a visitor the patient has designated when the patient is admitted, visiting is not clinically restricted and the visitor is not already admitted, or else the state survey agency may cite the hospital (R11) (42 CFR 482.13(h)(2), (h)(4)).
  attribute: staff
  deontic: must
  aim: (admit_visitor s x p)
  conditions: (and (admitted p) (designated p x) (not (clinically_restricted p)) (not (visiting x p)))
  or_else: R11
  strand: tying
  implicit: false
  kind: formal
  sanctioner: state
  function: settles_who_decides
  source: '42 CFR 482.13(h), added by 75 FR 70831 (2010-11-19), effective 2011-01-18 (hv-fr-2010-final-rule, opened by the worklist): the patient has ''the right, subject to his or her consent, to receive the visitors whom he or she designates, including, but not limited to, a spouse, a domestic partner (including a same-sex domestic partner), another family member, or a friend'' ((h)(2)), and the hospital must ''Ensure that all visitors enjoy full and equal visitation privileges consistent with patient preferences'' ((h)(4)) (hv-cfr-482-13-h, current text, opened by the worklist). Enforced through the Medicare Conditions of Participation by state survey agencies under CMS Transmittal 75 (hv-cms-r75soma, A-0215, opened by the worklist), hence sanctioner state and or_else R11. (h)(3), which bars restriction on race, sex, sexual orientation and the other listed grounds, is not encoded: the entry has no protected-ground fluents; the relationship-agnostic effect here comes from (h)(2) and (h)(4). The ''not visiting'' conjunct makes the obligation fire once (one action slot per step).'
  provenance:
  - source_id: hv-fr-2010-final-rule
    pin: 42 CFR 482.13(h)(2), (h)(4), as added
    jurisdiction: US
    effective_date: '2011-01-18'
    verification: opened
    excerpt: to receive the visitors whom he or she designates, including, but not limited to, a spouse, a domestic partner (including a same-sex domestic partner), another family member, or a friend
    accessed: '2026-11-08'
    url: https://www.govinfo.gov/content/pkg/FR-2010-11-19/html/2010-29194.htm
    note: 'opened by the worklist (summary-mediated; govinfo HTML, first 100,000 of 103,789 characters, amendatory text via offset)'
  - source_id: hv-cfr-482-13-h
    pin: (h)(2)-(4)
    jurisdiction: US
    effective_date: '2011-01-18'
    verification: opened
    excerpt: Ensure that all visitors enjoy full and equal visitation privileges consistent with patient preferences
    accessed: '2026-11-08'
    url: https://www.law.cornell.edu/cfr/text/42/482.13
    note: 'opened by the worklist (summary-mediated); current eCFR text, amended 2012 and 2019 after the 2011 version'
  - source_id: hv-cms-r75soma
    pin: A-0215
    jurisdiction: US
    effective_date: '2011-12-02'
    verification: snippet
    excerpt: null
    accessed: '2026-11-08'
    url: https://www.cms.gov/regulations-and-guidance/guidance/transmittals/downloads/r75soma.pdf
    note: 'the worklist opened the PDF (A-0215); this item cites it only for the enforcement path (state survey agencies) and carries no excerpt, so it is held at snippet here; the opened excerpt is on R10'
  var_roles:
    s: staff
    x: partner
    p: patient
- id: R10
  plain: The patient may designate any person as a visitor (42 CFR 482.13(h)(1)-(2)).
  attribute: patient
  deontic: may
  aim: (designate p x)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  source: '42 CFR 482.13(h)(1)-(2), added by 75 FR 70831 (hv-fr-2010-final-rule, opened by the worklist): the hospital informs the patient of the right ''to receive the visitors whom he or she designates''; for critical access hospitals 485.635(f)(1) adds ''in advance of furnishing patient care whenever possible'', so designation may precede admission (condition true). Written as a power conferred by the rule (may), not a default capacity: before 2011 no such designation existed.'
  provenance:
  - source_id: hv-fr-2010-final-rule
    pin: 42 CFR 482.13(h)(1)-(2); 485.635(f)(1), as added
    jurisdiction: US
    effective_date: '2011-01-18'
    verification: opened
    excerpt: to receive the visitors whom he or she designates ... in advance of furnishing patient care whenever possible
    accessed: '2026-11-08'
    url: https://www.govinfo.gov/content/pkg/FR-2010-11-19/html/2010-29194.htm
    note: 'opened by the worklist (summary-mediated); the second fragment is the CAH text, 485.635(f)(1), not 482.13(h)'
  var_roles:
    p: patient
    x: partner
- id: R11
  plain: The state survey agency may cite the hospital (the sanction behind R9; CMS Transmittal 75).
  attribute: surveyor
  deontic: may
  aim: (cite v o)
  conditions: 'true'
  or_else: null
  strand: null
  implicit: false
  kind: formal
  sanctioner: none
  source: 'CMS Transmittal 75, Pub. 100-07, 2011-12-02 (hv-cms-r75soma, opened by the worklist): interpretive guidelines A-0215 to A-0217 give state surveyors the standard for 482.13(h); a deficiency is cited against the hospital''s Medicare participation. The consequence (termination from Medicare) is not encoded; cite has no effects. ''the burden of proof is upon the hospital to demonstrate that the visitation restriction is reasonably necessary to provide safe care'' is the one quoted line.'
  provenance:
  - source_id: hv-cms-r75soma
    pin: A-0215
    jurisdiction: US
    effective_date: '2011-12-02'
    verification: opened
    excerpt: the burden of proof is upon the hospital to demonstrate that the visitation restriction is reasonably necessary to provide safe care
    accessed: '2026-11-08'
    url: https://www.cms.gov/regulations-and-guidance/guidance/transmittals/downloads/r75soma.pdf
    note: 'opened by the worklist (PDF text, A-0215 read; A-0216/0217 not read)'
  var_roles:
    v: surveyor
    o: hospital
source_text: 'From 2011-01-18 a hospital must give each patient ''the right, subject to his or her consent, to receive the visitors whom he or she designates, including, but not limited to, a spouse, a domestic partner (including a same-sex domestic partner), another family member, or a friend'' and must ''Ensure that all visitors enjoy full and equal visitation privileges consistent with patient preferences'', subject to ''clinically necessary or reasonable restriction'' (42 CFR 482.13(h), added by 75 FR 70831, 2010-11-19; critical access hospitals 485.635(f)). Surveyors enforce it under CMS Transmittal 75 (2011-12-02), where ''the burden of proof is upon the hospital to demonstrate that the visitation restriction is reasonably necessary to provide safe care''. The pre-2011 policy gate (R4) and staff norm (R2, R3) are kept; R3 is narrowed where the patient has designated the visitor. Denials continued in reported cases (Nevada 2012: ''It didn''t matter that we were registered domestic partners''); no rate is known.'
expected_properties:
  spouse_visit_guaranteed: holds_to_k
  spouse_visit_possible: reachable
  unmarried_partner_visit_possible: reachable
  designated_visit_guaranteed: holds_to_k
isomorphic_to: []
not_isomorphic_to: []
minimal_pair_of:
  id: hospital-visitation-pre2011
  differs_on: designated_visit_guaranteed
notes: 'The after-2011 side of the pair (plans/informal-rules.md R1; preregistered there 2026-11-08 before the first run). Diff from the base: the patient gains designate (R10) and staff a state-sanctioned admission duty on designation (R9, or_else R11, sanctioner state via the surveyor role); the staff norm R3 is narrowed by (not (designated p x)), the one way strict compliance can express ''overridden, not deleted'' (ASSUMED). The formal policy gate R4 and the family-admission duty R8 stay, so the spouse is guaranteed admission by R4 + R8 and, if the patient designates, also by R9. Predictions (function): deleting R4 (sorts_who_belongs) flips spouse_visit_guaranteed to violated, because designation is a may (R10) and is not forced, while spouse_visit_possible stays reachable by two routes (R2 then R8; R10 then R9); deleting R9 (settles_who_decides) flips designated_visit_guaranteed to violated and nothing else (R5 still permits, so admission stays possible); deleting R2 leaves unmarried_partner_visit_possible reachable (displaced to designation), unlike the base where it goes unreachable; deleting R8 flips spouse_visit_guaranteed to violated (not forced; possible stays). designated_visit_guaranteed is the differs_on property of the pair: not applicable to the base (no designated fluent), holds_to_k here. (h)(3) protected grounds not encoded; the Medicare termination consequence not encoded (cite has no effects); the 2012 and 2019 amendments to (h) not read. Consent guard note (plans/consent-guard-note-DRAFT.md) ruled not applicable to visitor-access rules by the author, 2026-11-08.'
