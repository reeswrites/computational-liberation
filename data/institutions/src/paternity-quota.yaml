id: paternity-quota
name: Non-transferable paternity quota (Quebec Parental Insurance Plan)
roles:
- name: birthing_parent
  gloss: the parent who gave birth; entitled to maternity weeks
- name: non_birthing_parent
  gloss: 'the other parent (QPIP: father or non-birthing parent)'
- name: child
  gloss: the child
- name: plan
  gloss: the insurer (Retraite Quebec / EI); pays and enforces the week counts
fluents:
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
- name: parent
  arity: 2
  gloss: p is a parent of c
- name: birthing_parent
  arity: 2
  gloss: p gave birth to c
  arg_roles: [birthing_parent, child]
- name: female
  arity: 1
  gloss: x is female (sex as assigned by the institution's own records)
  arg_roles: [birthing_parent]
- name: reserved_weeks_available
  arity: 1
  gloss: p still has unused reserved (paternity / non-birthing-parent) weeks
- name: shareable_weeks_available
  arity: 1
  gloss: p has unused weeks from the shareable parental block
- name: on_reserved_leave
  arity: 1
  gloss: p is on leave funded by the reserved weeks
- name: on_shareable_leave
  arity: 1
  gloss: p is on leave funded by the shareable block
- name: benefit_period_ended
  arity: 1
  gloss: the benefit period for the child c has ended
  arg_roles: [child]
actions:
- name: take_reserved_leave
  args: [p, c]
  effects:
  - fluent: on_reserved_leave
    args: [p]
    value: true
  - fluent: provides_care
    args: [p, c]
    value: true
- name: take_shareable_leave
  args: [p, c]
  effects:
  - fluent: on_shareable_leave
    args: [p]
    value: true
  - fluent: provides_care
    args: [p, c]
    value: true
- name: transfer_reserved
  args: [p, q]
  effects:
  - fluent: reserved_weeks_available
    args: [p]
    value: false
  - fluent: reserved_weeks_available
    args: [q]
    value: true
- name: transfer_shareable
  args: [p, q]
  effects:
  - fluent: shareable_weeks_available
    args: [p]
    value: false
  - fluent: shareable_weeks_available
    args: [q]
    value: true
- name: grant_reserved
  args: [plan, p]
  effects:
  - fluent: reserved_weeks_available
    args: [p]
    value: true
- name: forfeit
  args: [plan, p]
  effects:
  - fluent: reserved_weeks_available
    args: [p]
    value: false
- name: return_to_work
  args: [p, c]
  effects:
  - fluent: on_reserved_leave
    args: [p]
    value: false
  - fluent: on_shareable_leave
    args: [p]
    value: false
  - fluent: provides_care
    args: [p, c]
    value: false
rules:
- id: R1
  plain: 'The non-birthing parent may take reserved leave for the child when they are a parent of the child, not the birthing parent, and have reserved weeks available (QPIP s. 9).'
  attribute: non_birthing_parent
  deontic: may
  aim: (take_reserved_leave p c)
  conditions: (and (parent p c) (not (birthing_parent p c)) (reserved_weeks_available p))
  or_else: null
  strand: rival
  implicit: false
  source: 'Act respecting parental insurance, CQLR c. A-29.011, ss. 9, 10, 16, 17; https://www.legisquebec.gouv.qc.ca/en/document/cs/A-29.011 (s. 9: maximum of five weeks of paternity benefits or exclusive benefits for the non-birthing parent)'
  provenance:
  - source_id: qc-cqlr-a-29-011
    pin: s. 9
    jurisdiction: CA-QC
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
- id: R2
  plain: 'The non-birthing parent cannot transfer the reserved weeks to another parent: no such power exists (QPIP ss. 9, 16, 17).'
  attribute: non_birthing_parent
  deontic: must_not
  aim: (transfer_reserved p q)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  source: 'Act respecting parental insurance, CQLR c. A-29.011, ss. 9, 10, 16, 17; https://www.legisquebec.gouv.qc.ca/en/document/cs/A-29.011 (s. 9 labels the weeks exclusive; s. 16 sharing covers only shareable benefits; s. 17 adds unused weeks to the other parent only on death). A disability (or_else null): the Act confers no power to transfer; forfeiture (R3) is the use-it-or-lose-it consequence of the benefit period ending, not a sanction for transferring'
  provenance:
  - source_id: qc-cqlr-a-29-011
    pin: ss. 9, 10, 16, 17
    jurisdiction: CA-QC
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
  choices: 'Until 2026-11-04: must_not with R3 (forfeiture) as or_else. ADR 0013 reads an absent power as a disability, so or_else is null; R3 is kept (its own trigger is the benefit period ending; nothing now points at it from R2). transferable-leave replaces R2 whole, so the pair still differs on exactly R2.'
  var_roles:
    q: birthing_parent
- id: R3
  plain: 'The plan may forfeit a parent''s reserved weeks when reserved weeks remain and the child''s benefit period has ended (use-it-or-lose-it, QPIP s. 9).'
  attribute: plan
  deontic: may
  aim: (forfeit plan p)
  conditions: (and (reserved_weeks_available p) (benefit_period_ended c))
  or_else: null
  strand: rival
  implicit: false
  source: Act respecting parental insurance, CQLR c. A-29.011, ss. 9, 10, 16, 17; https://www.legisquebec.gouv.qc.ca/en/document/cs/A-29.011 (unused exclusive weeks lapse; use-it-or-lose-it)
  provenance:
  - source_id: qc-cqlr-a-29-011
    pin: ss. 9, 10, 16, 17
    jurisdiction: CA-QC
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
