id: hospital-visitation-pre2011
name: 'US hospital visitation before 2011: policy admits immediate family, staff decide who counts (minimal pair base)'
roles:
- name: patient
  gloss: the admitted patient whose visitors are at issue
- name: partner
  gloss: the would-be visitor; a spouse or an unmarried partner, depending on the trace (married is exogenous here)
- name: staff
  gloss: the charge nurse or unit staff who decide who counts as family and admit visitors
- name: hospital
  gloss: the hospital as an institution (administration); sets visitation policy and disciplines staff
fluents:
- name: admitted
  arity: 1
  gloss: p is an inpatient
  arg_roles: [patient]
- name: married
  arity: 2
  gloss: p and x are married (exogenous in this entry; set by marry in the coverture composite)
  arg_roles: [patient, partner]
- name: counts_as_family
  arity: 2
  gloss: 'staff treat x as family of p for visitation (the informal judgment; set by recognize_family)'
  arg_roles: [patient, partner]
- name: clinically_restricted
  arity: 1
  gloss: visiting p is clinically restricted (infection control, procedure, patient rest)
  arg_roles: [patient]
- name: visiting
  arity: 2
  gloss: x has been admitted as a visitor to p
  arg_roles: [partner, patient]
actions:
- name: admit
  args: [s, p]
  arg_roles: [staff, patient]
  effects:
  - fluent: admitted
    args: [p]
    value: true
- name: recognize_family
  args: [s, p, x]
  arg_roles: [staff, patient, partner]
  effects:
  - fluent: counts_as_family
    args: [p, x]
    value: true
- name: admit_visitor
  args: [s, x, p]
  arg_roles: [staff, partner, patient]
  effects:
  - fluent: visiting
    args: [x, p]
    value: true
- name: restrict
  args: [s, p]
  arg_roles: [staff, patient]
  effects:
  - fluent: clinically_restricted
    args: [p]
    value: true
- name: reprimand
  args: [o, s]
  arg_roles: [hospital, staff]
  effects: []
