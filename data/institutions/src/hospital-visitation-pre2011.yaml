- id: R2
  plain: '(practice, not written; reconstruction, no policy text found) Staff may treat any visitor as family of an admitted patient: the charge nurse decides who counts.'
  attribute: staff
  deontic: may
  aim: (recognize_family s p x)
  conditions: (and (admitted p) (not (counts_as_family p x)))
  or_else: null
  strand: tying
  implicit: true
  kind: norm
  sanctioner: none
  function: sorts_who_belongs
  source: 'The informal gate. No hospital policy text names the decider. Evidence that non-relatives were excluded while immediate family were admitted is the 2010 Presidential Memorandum''s own description of practice: ''a widow or widower with no children is denied the support and comfort of a good friend''; members of religious orders ''unable to choose someone other than an immediate family member to visit them''; ''gay and lesbian Americans who are often barred from the bedsides of the partners'' (hv-presmemo-2010, opened); and the final rule''s comment response on practice that ''denies patients access to their loved ones in times of need'' (hv-fr-2010-final-rule, opened). That the exclusion was exercised as staff discretion rather than written policy is the encoder''s reading (ASSUMED); Lambda Legal''s 2010 survey (hv-ll-2010-wcnc) could not be opened. The memo''s sentence ''no more restrictive than those that immediate family members enjoy'' is its target standard for designated visitors, not a description of the baseline (council 2026-11-08). Tag note: a permission carries no sanction of its own; the sanction that bounds the discretion is R3''s (sanctioner institution). D1 defines a norm as sanctioned; this `may` half of the practice is tagged norm with sanctioner none knowingly, and whether it should read strategy is an open question for the author (council 2026-11-08).'
