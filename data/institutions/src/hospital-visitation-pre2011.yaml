  source: 'The formal gate before 2011: hospital policy, not law. No pre-2011 hospital policy text or state hospital association model policy with ''immediate family'' wording was found or opened (unverified item below), so written-ness is ASSUMED and `kind: formal` rests on the ordinary existence of hospital visiting policies. That immediate family were admitted where others were not is the memo''s description of practice: members of religious orders were ''unable to choose someone other than an immediate family member to visit them'', while ''a widow or widower with no children is denied the support and comfort of a good friend'' and ''gay and lesbian Americans who are often barred from the bedsides of the partners'' (hv-presmemo-2010, opened). The memo''s ''no more restrictive than those that immediate family members enjoy'' is its target standard for designees, not the baseline (council 2026-11-08). Immediate family other than the spouse is not encoded (one visitor role). Written as an action obligation (must recognise) because no action can establish counts_as_family for the spouse at admission (ADR 0009 note). That recognition was a DUTY on staff rather than custom is ASSUMED; this rule, with R8, is what makes spouse_visit_guaranteed hold, so the guarantee is an encoding claim about the reconstructed policy (council 2026-11-08).'
