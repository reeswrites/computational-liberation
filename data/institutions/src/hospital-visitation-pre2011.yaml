- id: R8
  plain: '(reconstruction, no policy text found) Staff must admit a visitor they count as family of an admitted patient when visiting is not restricted and that visitor is not already visiting, or else the hospital may reprimand them (R6).'
  attribute: staff
  deontic: must
  aim: (admit_visitor s x p)
  conditions: (and (admitted p) (counts_as_family p x) (not (clinically_restricted p)) (not (visiting x p)))
  or_else: R6
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: institution
  source: 'Hospital policy before 2011: immediate family are admitted. No policy text was opened (unverified item below). The memo describes immediate family as the class admitted as of course (members of religious orders ''unable to choose someone other than an immediate family member to visit them'', while ''a widow or widower with no children is denied the support and comfort of a good friend'' and ''gay and lesbian Americans who are often barred from the bedsides of the partners'', hv-presmemo-2010, opened). Written as a duty (must), not a permission, so that the spouse''s visit is guaranteed and not merely possible; whether hospitals treated family admission as a duty on themselves is the encoder''s reading and the largest over-read in the entry (council 2026-11-08): the source shows custom, not a duty. The ''not visiting'' conjunct makes the duty fire once (one action slot per step).'
