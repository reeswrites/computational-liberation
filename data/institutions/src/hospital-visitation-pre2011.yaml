source_text: 'Before the 2011 Medicare rule there was no federal visitor-choice standard (North Carolina had amended its Patients'' Bill of Rights to let patients designate visitors, as the Presidential Memorandum of 2010-04-15 notes; no other state rule is encoded). The memorandum describes the practice: ''a widow or widower with no children is denied the support and comfort of a good friend'', members of religious orders ''unable to choose someone other than an immediate family member to visit them'', ''gay and lesbian Americans who are often barred from the bedsides of the partners''; the final rule''s comment responses speak of practice that ''denies patients access to their loved ones in times of need'' (75 FR 70831). Both are regulators'' descriptions; no pre-2011 hospital policy text was opened (plans/sourcing-worklist-marriage.md). Encoded as a reconstructed formal policy gate (R4: the spouse must be recognised as family; R8: family are admitted) over an informal staff gate (R2: staff decide who else counts; R3: staff may not admit anyone they do not count), a general permission to admit visitors (R5) that R3 narrows, and the restriction exception (R7) that the 2011 rule kept.'
