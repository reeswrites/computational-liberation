- id: R6
  plain: 'The wife cannot leave the marriage at her own will while married: no such power exists (pre-reform divorce required the spouse''s consent or proved fault, Stevenson & Wolfers; NY 1787 adultery only).'
  attribute: wife
  deontic: must_not
  aim: (leave w)
  conditions: (married h w)
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'UNVERIFIED (leads, not opened 2026-11-05; network fetches blocked): Stevenson & Wolfers, ''Bargaining in the Shadow of the Law: Divorce Laws and Family Distress'', Quarterly Journal of Economics 121(1) (2006), NBER w10175, on unilateral (no-fault) divorce adopted state by state from 1969; New York''s 1787 divorce act (absolute divorce for adultery only, until the 1966 reform) as one state''s fault statute (plans/sourcing-worklist-mwpa.md, Jurisdiction mismatch B). Reading (option B1): R6 encodes no exit at her own will. A judicial divorce on the husband''s proved fault (grounds varied by state; South Carolina had none) is an exit this encoding does not represent (option B2, a later preregistered experiment, plans/sourcing.md). The English sources of coverture-household R6 (Shanley 1989, Stone 1990, on England before the Matrimonial Causes Act 1857) are not cited here. [ADR 0013: or_else null: the exit bar is a disability, not a prohibition the subject answers for. Power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(w) = leave enabled (a default capacity), which this disability makes false while married Verification pass: Stevenson & Wolfers read 2026-11-06 at https://www.nber.org/system/files/working_papers/w10175/w10175.pdf (the NBER working paper of December 2003, not the QJE version): ''from the preexisting divorce laws (which typically required either the consent of both spouses or a demonstration of marital fault)'' ... ''prior to unilateral divorce, a partner wishing to dissolve the marriage could leave'' ... ''However, in such a situation, a legal divorce is not granted''; its Table 1 lists ''Pre-existing Unilateral Divorce statutes (predate beginning of sample in 1964)'' in nine states (Alaska, Louisiana, Maryland, North Carolina, Oklahoma, Utah, Virginia, Vermont, West Virginia), so the paper does not say that no state had unilateral divorce before 1969. New York, Laws of 1787 ch. 69 (passed 30 March 1787), read 2026-11-06 through the OCR at https://archive.org/download/bim_eighteenth-century_laws-of-the-state-of-new_new-york-state_1787/bim_eighteenth-century_laws-of-the-state-of-new_new-york-state_1787_djvu.txt: ''in all cases of adultery that have already been committed, or may hereafter be committed, where the parties are inhabitants of this State, for the party injured, to exhibit or present a petition or bill to the Chancellor'' (long s modernised; letters clipped at line starts restored).'
