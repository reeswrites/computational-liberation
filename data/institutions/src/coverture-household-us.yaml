  attribute: wife
  deontic: must_not
  aim: (leave w)
  conditions: (married h w)
  or_else: null
  strand: rival
  implicit: false
  source: 'UNVERIFIED (leads, not opened 2026-11-05; network fetches blocked): Stevenson & Wolfers, ''Bargaining in the Shadow of the Law: Divorce Laws and Family Distress'', Quarterly Journal of Economics 121(1) (2006), NBER w10175, on unilateral (no-fault) divorce adopted state by state from 1969; New York''s 1787 divorce act (absolute divorce for adultery only, until the 1966 reform) as one state''s fault statute (plans/sourcing-worklist-mwpa.md, Jurisdiction mismatch B). Reading (option B1): R6 encodes no exit at her own will. A judicial divorce on the husband''s proved fault (grounds varied by state; South Carolina had none) is an exit this encoding does not represent (option B2, a later preregistered experiment, plans/sourcing.md). The English sources of coverture-household R6 (Shanley 1989, Stone 1990, on England before the Matrimonial Causes Act 1857) are not cited here. [ADR 0013: or_else null: the exit bar is a disability, not a prohibition the subject answers for. Power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(w) = leave enabled (a default capacity), which this disability makes false while married'
