id: gestational-surrogacy
name: 'Gestational surrogacy: the rival input moves to another body (control for ectogenesis)'
extends: ectogenesis
roles_add:
- name: gestator
  gloss: the surrogate whose body carries the child; the rival input (one body, a short window; docs/theory.md 'Pregnancy, birth, nursing')
fluents_drop: [gestated_ex_utero]
fluents_set:
  birthing_parent:
    arg_roles: [gestator, child]
fluents_add:
- name: gestates
  arity: 2
  gloss: x's body carries c (surrogacy only)
  arg_roles: [gestator, child]
actions_drop: [start_gestation, transfer_to_device, decant]
actions_add:
- name: implant
  args: [provider, gestator, child]
  effects:
  - fluent: in_gestation
    args: [child]
    value: true
  - fluent: gestates
    args: [gestator, child]
    value: true
- name: give_birth
  args: [gestator, child]
  effects:
  - fluent: birthing_parent
    args: [gestator, child]
    value: true
  - fluent: is_subject
    args: [child]
    value: true
  - fluent: in_gestation
    args: [child]
    value: false
  - fluent: gestates
    args: [gestator, child]
    value: false
rules_drop: [R1]
rules_replace:
- id: R2
  plain: 'The provider may implant an embryo in the gestator for the child at any time (gestational surrogacy).'
  attribute: provider
  deontic: may
  aim: (implant provider gestator child)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'gestational surrogacy: the clinic implants an embryo in the gestator. Statute citations still to be added (state surrogacy acts vary). UNVERIFIED: no statute or case opened.'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: gestational surrogacy: the clinic implants an embryo in the gestator. Statute citations still to be added (state surrogacy acts vary)'
- id: R3
  plain: 'The gestator must give birth to the child when she is gestating it, or else the registry may reprimand (R6).'
  attribute: gestator
  deontic: must
  aim: (give_birth gestator child)
  conditions: (gestates gestator child)
  or_else: R6
  strand: rival
  implicit: false
  kind: formal
  sanctioner: institution
  sanctioner_review: derived
  source: 'the gestator carries to term and gives birth; the rival input sits in one body. Statute citations still to be added (state surrogacy acts vary). UNVERIFIED: no statute or case opened. Gestator consent and the right to keep the child are out of scope (ASSUMED author decision 2026-11-04).'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: the gestator carries to term and gives birth; the rival input sits in one body. Statute citations still to be added (state surrogacy acts vary)'
source_text: 'Construction, not a statute: gestational surrogacy as the control for ectogenesis (plans/ectogenesis.md section 1). Statute citations still to be added (state surrogacy acts vary). UNVERIFIED: no statute or case opened.'
expected_properties:
  birth_labor_rival: holds_to_k
  care_decoupled_from_birth: unreachable_open
  solo_care_by_non_birthing_parent: reachable
  care_assigned_by_sex: violated
isomorphic_to:
- id: ectogenesis
  level: guard
  sub_signature: []
not_isomorphic_to:
- ectogenesis
- coverture-household
- police-crisis
- cps
- kibbutz-childrens-house
minimal_pair_of: null
notes: 'Control: the rival input moves to a weaker party (failure mode Displacement; the model case is the global care chain; layer 3). The minimal pair is recorded on ectogenesis. Revision 2 (2026-11-04): start_gestation merged into implant per plans/ectogenesis.md v2; v1 drift 1 stays in the record. ASSUMED author decisions (2026-11-04, from the encoder''s brief, not from the plan file): R2+R3 substituted counts as a minimal pair; E R2/R3 tagged `superadditive` by hand (no new strand value; claim L11 is refuted for this reason, plan section 5c); R7 has no birthing_parent condition; R5 triggers on female(p) (role not body: Kleven, docs/theory.md); no leave action, so the plan''s leave_reserved_for_non_birthing_parent row is dropped; neither entry is in CONTROLS (ectogenesis is not registered as a care-without-control control); gestator consent is out of scope. BY CONSTRUCTION, flagged in advance (plan section 5): birth_labor_rival in ectogenesis restates R2''s effect list (gestates is never set there), and care_decoupled_from_birth in ectogenesis is reachable because decant omits birthing_parent (the only non-trivial leg is R7''s missing birth condition); both properties carry by_construction: true, which the engine ignores. Treat those two verdicts as information, as marriage_requires_binding was, not as evidence; non-circular evidence needs layer 2/3. Also by construction: gestated_ex_utero exists only to mark an absence. PREREGISTERED (plans/ectogenesis.md section 3, before any run; layer 1, init declared, strict compliance, k=6). gestational-surrogacy: birth_labor_rival holds_to_k; care_decoupled_from_birth unreachable_open; solo_care_by_non_birthing_parent reachable; care_assigned_by_sex violated. ectogenesis: birth_labor_rival violated; care_decoupled_from_birth reachable; solo_care_by_non_birthing_parent reachable; care_assigned_by_sex violated. Headline difference: birth_labor_rival. Iso (ADR 0010, about 65% confident): ectogenesis ~ surrogacy iso at guard, not iso at guard+strands (R2/R3 rival to superadditive tag flip), not iso at exact; ectogenesis not iso coverture-household / police-crisis / cps / kibbutz-childrens-house (no control permission over the subject, no exit bar, so the care+control sub-signature fails); vs transferable-leave / paternity-quota a guess of partial at guard+strands, two legs (R5~R7 implicit must-care by attribute; R4~R5 may care), about 40% confident. Failure modes (ADR 0016): surrogacy Displacement (layer 3); ectogenesis Dark twin (layer 3), Capture (needs a new rule), Dead letter (layer 2); R5 surviving is partial reform, no mode. Layer 2 not required.'
goods_note: 'Slice 2 revision 3 (plans/priority-slice2-results.md, "Revision 3" and "Revision 3 fix pass"): goods as encoded, strict compliance, k=6 and 8, both encoders read the same; a statement about encodings (ADR 0011). Two measures, never combined: guaranteed (the rules as obeyed force the good) and possible (it can hold under the rules as obeyed, within k, at one step, for some bearer in some starting world); the primary column reads each good under the author''s value call (R3.1). This entry is not in any good''s entries list: the readings below evaluate the dataset''s goods formulas here as extrapolation, as for every goods row outside a good''s listed entries. Prohibiting R4 (the registered parent''s permission to care) makes cared_for and known_carer impossible (fragile > absent): constitutive on the possible column, a prohibition of the care act itself, not evidence of a constitutive bundle in the glossary''s sense, and resting on strict compliance as in ectogenesis; on the primary column it is carrying (possible) for known_carer (cared_for is guaranteed-primary and never guaranteed here). Prohibiting R2 (implantation) means no child exists: the goods are not applicable, outside the ranking, not lost. R5 reads tying. In the blind-gloss experiment (formulas not adopted) the R4~prohibit row''s possible and primary readings differ between the two blind encoders. Second encoder: agent, not someone living under the institution (ADR 0012).'
