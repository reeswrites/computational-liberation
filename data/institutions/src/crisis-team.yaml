- id: R7
  plain: '(practice, not written) The responder may request police for the subject when responding to the subject and there is danger.'
  attribute: responder
  deontic: may
  aim: (request_police r o s)
  conditions: (and (responding r s) (danger s))
  or_else: null
  strand: tying
  implicit: true
  source: 'implicit rebundling path: the team can call police when a scene turns violent; practice, not written policy in the source read. UNVERIFIED (general knowledge; no source opened)'
  provenance:
