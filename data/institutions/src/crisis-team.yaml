id: crisis-team
name: Unarmed crisis response team, referral only (Denver STAR model)
roles:
- name: responder
  gloss: clinician + paramedic team; unarmed, no custody power
- name: subject
  gloss: the person in crisis
- name: dispatcher
  gloss: 911 dispatch; routes eligible calls to the team
- name: officer
  gloss: police, called only if the responder requests
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [subject]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [responder, subject]
- name: care_obliged
  arity: 2
  gloss: 'some rule in force at this step obliges x to give care to y (a must on the care act or the care state, sanctioned or not); derived from the rules, not asserted'
  arg_roles: [responder, subject]
  params: [x, y]
  derived: (obliged provides_care x y)
- name: in_custody
  arity: 1
  gloss: x is held by the institution and may not leave
  arg_roles: [subject]
- name: in_crisis
  arity: 1
  gloss: x is in a mental-health crisis
  arg_roles: [subject]
- name: danger
  arity: 1
  gloss: x is a danger to self or others, or gravely disabled (WIC 5150 trigger)
  arg_roles: [subject]
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [x, s]
  derived: (enabled detain x s)
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [s]
  derived: (enabled leave s)
  arg_roles: [subject]
- name: has_standing
  arity: 1
  gloss: x can start a legal claim in x's own name
  params: [s]
  derived: (enabled sue s)
  arg_roles: [subject]
- name: call_received
  arity: 1
  gloss: a crisis call about s has been received
  arg_roles: [subject]
- name: responding
  arity: 2
  gloss: r is on scene with s
- name: referred
  arity: 1
  gloss: s has been connected to services
- name: eligible
  arity: 1
  gloss: the call is a low-level, non-violent call eligible for the team
- name: armed
  arity: 1
  gloss: r carries a firearm
actions:
- name: dispatch_team
  args: [d, r, s]
  effects:
  - fluent: responding
    args: [r, s]
    value: true
  - fluent: is_subject
    args: [s]
    value: true
  - fluent: provides_care
    args: [r, s]
    value: true
  - fluent: call_received
    args: [s]
    value: false
- name: assess
  args: [r, s]
  effects:
  - fluent: provides_care
    args: [r, s]
    value: true
- name: withdraw
  args: [r, s]
  effects:
  - fluent: provides_care
    args: [r, s]
    value: false
- name: refer
  args: [r, s]
  effects:
  - fluent: referred
    args: [s]
    value: true
- name: leave
  args: [s]
  effects:
  - fluent: responding
    args: [r, s]
    value: false
  - fluent: provides_care
    args: [r, s]
    value: false
  default_capacity: true
- name: request_police
  args: [r, o, s]
  effects:
  - fluent: responding
    args: [o, s]
    value: true
- name: detain
  args: [x, s]
  arg_roles: [null, subject]
  effects:
  - fluent: in_custody
    args: [s]
    value: true
- name: sue
  args: [s]
  effects: []
  default_capacity: true
- name: carry_weapon
  args: [r]
  effects:
  - fluent: armed
    args: [r]
    value: true
rules:
- id: R1
  plain: 'The dispatcher must dispatch a team to the subject when a call about the subject has been received and the subject is eligible (Denver STAR).'
  attribute: dispatcher
  deontic: must
  aim: (dispatch_team d r s)
  conditions: (and (call_received s) (eligible s))
  or_else: null
  strand: tying
  implicit: false
  source: 'Denver STAR (Support Team Assisted Response), KUNC 2020-11-17; https://www.kunc.org/2020-11-17/in-denver-unarmed-mental-health-workers-respond-to-hundreds-of-911-calls-instead-of-police (low-level calls involving mental illness, homelessness, substance use are routed to the clinician-paramedic van). [ADR 0009: one-off action obligation; dispatch consumes call_received]'
  provenance:
  - source_id: kunc-2020-denver-star
    pin: null
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
- id: R2
  plain: 'The responder providing care to the subject must hold when the responder is responding to the subject and the subject is in crisis (Denver STAR).'
  attribute: responder
  deontic: must
  aim: (provides_care r s)
  conditions: (and (responding r s) (in_crisis s))
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Denver STAR (Support Team Assisted Response), KUNC 2020-11-17; https://www.kunc.org/2020-11-17/in-denver-unarmed-mental-health-workers-respond-to-hundreds-of-911-calls-instead-of-police. [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] dispatch_team establishes provides_care(r, s); assess restores it, withdraw breaks it'
  provenance:
  - source_id: kunc-2020-denver-star
    pin: null
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
  load_bearing: true
- id: R3
  plain: 'The responder may refer the subject (for example to medication pick-up or housing) when responding to the subject (Denver STAR).'
  attribute: responder
  deontic: may
  aim: (refer r s)
  conditions: (responding r s)
  or_else: null
  strand: superadditive
  implicit: false
  source: Denver STAR (Support Team Assisted Response), KUNC 2020-11-17; https://www.kunc.org/2020-11-17/in-denver-unarmed-mental-health-workers-respond-to-hundreds-of-911-calls-instead-of-police (medication pick-up, housing connection; referral is the output)
  provenance:
  - source_id: kunc-2020-denver-star
    pin: null
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
- id: R4
  plain: 'The responder cannot detain the subject at any time: no such power exists (Denver STAR).'
  attribute: responder
  deontic: must_not
  aim: (detain r s)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: false
  source: 'Denver STAR (Support Team Assisted Response), KUNC 2020-11-17; https://www.kunc.org/2020-11-17/in-denver-unarmed-mental-health-workers-respond-to-hundreds-of-911-calls-instead-of-police (''non-police response''; the team holds no custody power; or_else null because this is an absence of power, not a prohibition with a penalty). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_sanction(responder, s) = detain enabled, which this disability makes false'
  provenance:
  - source_id: kunc-2020-denver-star
    pin: null
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: 'cited with no record of reading in this row''s source; quote in the old string (no read date): ''non-police response''; re-open to upgrade'
- id: R5
  plain: 'The subject may leave at any time (Denver STAR, voluntary encounter).'
  attribute: subject
  deontic: may
  aim: (leave s)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: false
  source: Denver STAR (Support Team Assisted Response), KUNC 2020-11-17; https://www.kunc.org/2020-11-17/in-denver-unarmed-mental-health-workers-respond-to-hundreds-of-911-calls-instead-of-police (voluntary encounter)
  provenance:
  - source_id: kunc-2020-denver-star
    pin: null
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited with no record of reading in this row's source; re-open to upgrade
- id: R6
  plain: 'The responder cannot carry a weapon at any time: no such power exists (Denver STAR, unarmed).'
  attribute: responder
  deontic: must_not
  aim: (carry_weapon r)
  conditions: 'true'
  or_else: null
