source_text: 'From memory, NOT a verified quotation (the page could not be opened on 2026-11-04): the experiment ran online groups of 20-30 participants who, in randomly paired rounds, each proposed a name for a pictured object and were paid a small reward when the two names matched and charged a small penalty when they did not; once a group had converged on one name, a committed minority instructed to use a different name was added, and minorities of about 25% of the group overturned the established name while smaller ones (around 20% and below) did not. The abstract (as recalled) reports ''direct empirical demonstration of the existence of a tipping point in the dynamics of changing social conventions'' and that minority groups that reached the critical mass ''were consistently able to overturn the established behavior''. Centola, Becker, Brackbill & Baronchelli, ''Experimental evidence for tipping points in social convention'', Science 360(6393):1116-1119, 8 June 2018, doi:10.1126/science.aas8827. Not opened on 2026-11-04 (every host tried was outside that session''s allowed network), so this entry-level summary is from memory and UNVERIFIED as a quotation; the accepted manuscript was opened 2026-11-06 (rule provenance, level opened). plans/layer2-abm.md records these sources as opened on 2026-11-03 by the planning session; this entry''s encoder could not reopen them on 2026-11-04.'
expected_properties:
  new_convention_adopted: reachable
isomorphic_to: []
not_isomorphic_to: [coverture-household, police-crisis, cps]
minimal_pair_of: null
notes: 'Calibration / control entry for layer-2 gate (b) (plans/layer2-abm.md; philengine/abm/gate.py crit_b reads id `naming-convention`, the payoffs-block key `committed_action`, parameter `committed_minority`; the property `new_convention_adopted` was its placeholder reading until engine slice 4, see the drift note). A pure coordination game, not a liberation case: no subject, no care, no sanction, no exit; the only question it serves is whether the coordination module''s tipping location emerges from the sweep rather than from a constant. committed_minority: share of agents holding `use_new` regardless of payoff; Centola''s observed tipping band ~ 25%: largest failing minority ~21%, smallest succeeding ~25% (UNVERIFIED, from memory; reworded 2026-11-04 per the encoding review finding 9 from ''between 21% and 31%'', 31% being the largest minority tested, not the band''s edge). Recorded here, not asserted by the model. Payoffs (A1): both actions 1.0, because the coordination module pays only on matching, so the payoff IS the matching reward and the two names are symmetric; the gate sweeps committed_minority, not payoffs. Rules: two `may` with condition true (ADR 0015 A6 strict enabledness: every action needs a may) and no must or must_not (the game has no sanction: a mismatch forgoes the reward, it breaks no rule). Fluents: `uses_old` / `uses_new` are two fluents rather than one, because the ABM''s state is role-level and shared (A2 deferred) and `Reference.successor` lets set-true win over set-false, so when members fire both names in one step both atoms are true; the property therefore asks for new-and-not-old, which on the shared state reads ''some member fired use_new and no member fired use_old this step'', i.e. the convention has switched. `initial: (uses_old member)` records the established convention at layer 1. The payoffs block also carries the three RESERVED keys the engine''s slice-4 coordination module reads (philengine/abm/model.py RESERVED_PAYOFF_KEYS, ASSUMED, added by the engine agent concurrently on 2026-11-04 after the first material-only run here showed the agents bootstrapping practice from a payoff tie by rng and ignoring `initial`): `coordinated: [use_old, use_new]` (both names are assurance-gated: a name pays only when the agent''s same-role neighbour share of it meets its threshold), `committed_action: use_new` (what the committed_minority holds whatever it pays), `initial_practice: use_old` (every uncommitted member starts on the old name, so an established convention exists for the minority to tip). These keys are hand inputs, like the numbers (A1); nothing in them names a tipping location. Layer 2 with the coordination module (information, not a dataset verdict; written before the first (b) run): some adjacent pair of sweep points 0.05..0.50 is expected to show an adoption jump > 0.5 (crit_b PASS) and the location is NOT preregistered: the gate''s own point is that the dataset records Centola''s band and the model does not assert it. DRIFT, recorded not edited (2026-11-04, after the run): the engine''s slice-4 crit_b no longer reads `new_convention_adopted` (its review finding 6: a property mean cannot express a population share under shared role state) but the member role''s last-step share of `committed_action`; at 30 seeds that share by committed_minority 0.05..0.50 is [0.05, 0.10, 0.15, 0.20, 0.35, 0.54, 0.70, 0.80, 0.90, 0.97]: equal to the committed share through 0.20 (no uncommitted member converts), above it from 0.25 on, so the tipping begins at the 0.20 -> 0.25 boundary, inside Centola''s band, but the curve is graded and the max adjacent jump is 0.19, not > 0.5: crit_b FAIL under both coordination configurations. The location was not set by the dataset (the entry carries no threshold); whether the sharpness criterion, the threshold draw U(0, threshold_max) or the 20-agent graph is what grades the curve is an engine question, not a dataset one. `new_convention_adopted` stays the layer-1 property (reachable, as preregistered) and an information line at layer 2. Negative control in spirit: it is listed in CONTROLS (`not_isomorphic_to_control` on the three care+control cluster members, ADR 0007 / ADR 0013) because it must match nothing: PREREGISTERED none@guard+strands against coverture-household, police-crisis and cps (no must, no rival may, no subject). PREREGISTERED (2026-11-04, before any run): new_convention_adopted reachable (one use_new step from the declared initial state); persists / holds_to_k are not claimed and would read fails / violated (use_old is always permitted); no inert rule (both are may); no vacuity flag (no invariant claimed); layer-1 gate unchanged except the three new control pairs reading none. Layer 2, material only (information, no verdict): with equal payoffs, imitation never fires (no neighbour out-earns) and the step-0 bootstrap splits practice by rng, so the property''s last-step rate over seeds is expected to be coin-flip-shaped (neither ~0 nor ~1), not a tipping curve; crit_b stays BLOCKED until the coordination module and committed_minority exist. Deviations from the plan sketch: no `coordinated(member)` derived fluent (nothing reads it; the coordination module tags actions by the payoffs block, A1); the first encoder could not fetch the source (network), so every figure was marked UNVERIFIED; the accepted manuscript was opened 2026-11-06 (see the rule provenance), and the 25% band figures stay UNVERIFIED against that read. Sources: Centola, Becker, Brackbill & Baronchelli, ''Experimental evidence for tipping points in social convention'', Science 360(6393):1116-1119, 8 June 2018, doi:10.1126/science.aas8827. Not opened on 2026-11-04 (every host tried was outside that session''s allowed network), so the entry-level figures above were cited from memory; the accepted manuscript was opened 2026-11-06 (rule provenance, level opened) and supports the free-entry design of R1/R2 only. plans/layer2-abm.md records these sources as opened on 2026-11-03 by the planning session.'
