id: naming-convention
name: Naming convention (Centola et al. 2018 naming game; layer-2 gate (b) calibration control)
roles:
- name: member
  gloss: 'a participant in the naming game; everyone is a peer (one role, ADR 0006/0011: an institutional sort, not a population)'
fluents:
- name: uses_old
  arity: 1
  gloss: m uses the established (old) name for the object
  arg_roles: [member]
- name: uses_new
  arity: 1
  gloss: m uses the new name for the object (the one the committed minority introduces)
  arg_roles: [member]
actions:
- name: use_old
  args: [m]
  effects:
  - fluent: uses_old
    args: [m]
    value: true
  - fluent: uses_new
    args: [m]
    value: false
- name: use_new
  args: [m]
  effects:
  - fluent: uses_new
    args: [m]
    value: true
  - fluent: uses_old
    args: [m]
    value: false
rules:
- id: R1
  plain: 'A member may use the old name in any round (the game''s free-text entry: a design feature of Centola et al. 2018, not a stated rule; no one sanctions either choice).'
  attribute: member
  deontic: may
  aim: (use_old m)
  conditions: 'true'
  or_else: null
  strand: superadditive
  implicit: false
  kind: strategy
  sanctioner: none
  sanctioner_review: reviewed
  source: 'Centola, Becker, Brackbill & Baronchelli, ''Experimental evidence for tipping points in social convention'', Science 360(6393):1116-1119, 8 June 2018, doi:10.1126/science.aas8827; the accepted manuscript read 2026-11-06 at https://openaccess.city.ac.uk/id/eprint/20031/1/CM_CRO_Version.pdf (City Research Online; Science''s PDF returned 403): ''participants are shown an image (a picture of a man or a woman) and prompted to enter a name in the response field'' ... ''Continuous interactions led to occasional switching by subjects throughout the study.'' Support is design-only: free-text entry each round and occasional switching imply that either name may be used in any round; no sentence of the paper states a permission, and the rule is the encoder''s reading of the game''s design (each round a paired participant proposes any name; both are rewarded when the names match, penalised when they do not; no name is required or forbidden). The 25% tipping threshold is stated as ''not expected to be a universal value'' and is not a rule (it lives in docs/theory.md T7 and the layer-2 gate band). Cited from memory 2026-11-04 before the manuscript was opened; rewritten 2026-11-08 (faithfulness batch 3a, A8). [coordination: the payoff is the matching reward of the naming game; a name pays only when the partner uses it, which the layer-2 coordination module reads from the `payoffs` block (A1) and its own `threshold`; at layer 1 the rule is just a permission] Retagged strategy 2026-11-08 (batch 3b, B5 ruling): a tipping convention with no sanction.'
