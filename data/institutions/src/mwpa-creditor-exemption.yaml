id: mwpa-creditor-exemption
name: 'Married women''s property, 1839-50 form: creditor exemption only (dark twin; Capture per ADR 0016)'
extends: coverture-household
roles_add:
- name: creditor
  gloss: a creditor of the husband
fluents_set:
  is_subject:
    arg_roles: [wife]
  female:
    arg_roles: [wife]
  can_sanction:
    arg_roles: [husband, wife]
  can_exit:
    arg_roles: [wife]
  has_standing:
    arg_roles: [wife]
  married:
    arg_roles: [husband, wife]
  controls_property:
    arg_roles: [husband, wife]
  controls_own_property:
    arg_roles: [wife]
  owns_earnings:
    arg_roles: [wife]
  can_contract:
    arg_roles: [wife]
  acquired_property:
    arg_roles: [wife]
  earns:
    arg_roles: [wife]
fluents_add:
- name: transferred
  arity: 2
  gloss: h has conveyed property of his to w
  arg_roles: [husband, wife]
- name: narrowed
  arity: 1
  gloss: a court has construed the property act narrowly as to w (keeps the husband's control during marriage)
  arg_roles: [wife]
- name: can_attach
  arity: 2
  gloss: creditor c holds the power to attach (levy on) property in w's hands for the husband's debts
  params: [c, w]
  derived: (enabled attach c w)
  arg_roles: [creditor, wife]
actions_add:
- name: attach
  args: [c, w]
  effects: []
- name: transfer_to_wife
  args: [h, w]
  effects:
  - fluent: acquired_property
    args: [w]
    value: true
  - fluent: transferred
    args: [h, w]
    value: true
rules_add:
- id: R10
  plain: '(practice, not written) A creditor may attach the wife''s property when she is married (it reaches what the husband holds).'
  attribute: creditor
  deontic: may
  aim: (attach c w)
  conditions: (married h w)
  or_else: null
  strand: rival
  implicit: true
  source: 'implicit baseline: a husband''s creditors reach the property the husband holds, which under R1 includes his wife''s. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_attach(c, w) = attach enabled (R10) and not barred (R11)'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: implicit baseline: a husband''s creditors reach the property the husband holds, which under R1 includes his wife''s'
  var_roles:
    c: creditor
    w: wife
    h: husband
- id: R11
  plain: 'A creditor cannot attach the wife''s property while she is married and has acquired property: no such power exists (Chused 1984).'
  attribute: creditor
  deontic: must_not
  aim: (attach c w)
  conditions: (and (married h w) (acquired_property w))
  or_else: null
  strand: tying
  implicit: false
  source: 'Chused 1984 (https://core.ac.uk/download/230496986.pdf [F, via plans/backtest-mwpa.md]): the 1839-50 acts ''generally contained nothing more than statements exempting married women''s property from the debts of husbands''; courts ''narrowly construing'' the acts to keep husbands'' control during marriage (citing Chused 1983 at 1400; Chused 1983 itself [R], PDF refused: UNVERIFIED); Khan 1996, Married Women''s Property Laws and Female Commercial Activity, Table 1 (sole-trader dates; the 1839-50 wave as debt relief); https://www.laits.utexas.edu/~mbs31415/Khan_MarriedWomenPropertyRights.pdf [F, via plans/backtest-mwpa.md] (Mississippi 1839 shielded property from husbands'' creditors; Khan excludes it as debt relief). A disability (or_else null): the exemption removes the creditor''s power, no sanction is involved'
  provenance:
  - source_id: chused-1984
    pin: null
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: '[F, via plans/backtest-mwpa.md]: an earlier batch reports fetching it; relayed second-hand, no access date; quote recorded: ''generally contained nothing more than statements exempting married women''s property from the debts of husbands'' ... ''narrowly construing''; re-open to upgrade'
  - source_id: chused-1983
    pin: at 1400
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: old source string says UNVERIFIED
  - source_id: khan-1996
    pin: Table 1
    jurisdiction: null
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: '[F, via plans/backtest-mwpa.md]: an earlier batch reports fetching it; relayed second-hand, no access date; no excerpt recorded; re-open to upgrade'
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: the Mississippi 1839 act the row names ('Mississippi 1839 shielded property from husbands' creditors; Khan excludes it as debt relief') is named only through Khan 1996; statute text not opened; no bibliography entry
  var_roles:
    c: creditor
    w: wife
    h: husband
- id: R12
  plain: '(practice, not written) The husband may transfer property to his wife when they are married (Chused 1984).'
  attribute: husband
  deontic: may
  aim: (transfer_to_wife h w)
  conditions: (married h w)
  or_else: null
  strand: tying
  implicit: true
  source: 'implicit: the transfer vehicle the exemption invites (conveyance to the wife, in practice through a trustee); Chused 1984 (https://core.ac.uk/download/230496986.pdf [F, via plans/backtest-mwpa.md]): the 1839-50 acts ''generally contained nothing more than statements exempting married women''s property from the debts of husbands''; courts ''narrowly construing'' the acts to keep husbands'' control during marriage (citing Chused 1983 at 1400; Chused 1983 itself [R], PDF refused: UNVERIFIED). UNVERIFIED (general knowledge; no source opened) as a rule of the 1839-50 acts; Blackstone''s bar on grants between spouses is read as lifted by the exemption acts for property so conveyed'
  provenance:
