notes: 'Plan delta `earnings`: add wife may keep_earnings (R14). PREREGISTERED (2026-11-03, before any run): financial_dependence_unpropertied VIOLATED (a wage-earning wife without property is no longer dependent); DISPLACEMENT (plan''s DI): the implicit care obligation R3 is unchanged, so double_burden (a wife who owns her wages and still must keep house) becomes REACHABLE here and was open before; no burden moves to another role (the plan names none). cannot_contract holds, no_standing reachable, exit unchanged.'
goods_note: 'Slice 2 revision 2 (plans/priority-slice2-results.md, "Revision 2"): goods as encoded, strict compliance, k=6 and 8, both encoders read the same; a statement about encodings (ADR 0011). Two measures, never combined: guaranteed (the rules as obeyed force the good) and possible (it can hold under the rules as obeyed, within k, at one step, for some bearer in some starting world). Guaranteed: R2 (the husband''s maintenance duty) is guarantee-carrying for 4 goods formulas that read one strand, provides_care(h, w) (cared_for, known_carer, mutual_household_care, provided_for); R3 (the wife''s implicit, sanctioned household duty) is guarantee-carrying for mutual_household_care only: guaranteed only by R3, an implicit sanctioned duty; deleting it removes the guarantee of the husband''s receipt of household labour; not advice to keep it. Possible: no single deletion makes any good impossible (R2 and R3 unread); deleting R6 (the exit bar) moves chosen_mutual_care absent > fragile, the only rule that does; her care duty R3 still binds in that row and the formula cannot see it, so this is not chosen care becoming possible (as encoded, no compliant trace has mutual care while she has a permitted way out); the guaranteed column is not meaningful for this good. R4, R6, R7 read tying. Title-route end state of the route comparison: G guaranteed 5 here vs 4 in coverture-floor, by construction: the same margin case as C (provided_for on R2 for a wife with neither property nor wages); G possible 0 vs 0. Under strict compliance R2''s unsanctioned duty reads as delivered maintenance; the historical enforcement (tradesmen''s claims for necessaries) is not represented. Second encoder: agent, not someone living under the institution (ADR 0012).'
