id: mwpa-earnings
name: Married women's earnings act (property act plus may keep_earnings)
extends: mwpa-property
rules_add:
- id: R14
  plain: 'The wife may keep her earnings as her own when married and she earns wages outside the household (earnings acts, Geddes et al. 2007).'
  attribute: wife
  deontic: may
  aim: (keep_earnings w)
  conditions: (and (married h w) (earns w))
  or_else: null
  strand: tying
  implicit: false
  source: 'Geddes, Lueck & Tennyson 2007 (draft), Table 1 dates of property / earnings acts; https://isnie-archive.sioe.org/assets/files/papers2007/geddes.pdf [F, via plans/backtest-mwpa.md] (earnings acts: NY 1860, MA 1846/1874, PA 1872, ...: a married woman''s wages are her separate property). Statute texts not opened ([R]). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] owns_earnings(w) = keep_earnings enabled (R14)'
