notes: 'Plan delta `earnings`: add wife may keep_earnings (R14). PREREGISTERED (2026-11-03, before any run): financial_dependence_unpropertied VIOLATED (a wage-earning wife without property is no longer dependent); DISPLACEMENT (plan''s DI): the implicit care obligation R3 is unchanged, so double_burden (a wife who owns her wages and still must keep house) becomes REACHABLE here and was open before; no burden moves to another role (the plan names none). cannot_contract holds, no_standing reachable, exit unchanged.'
goods_note: 'Slice 2 revisions 2 and 3 (plans/priority-slice2-results.md, "Revision 2", "Revision 3" and "Revision 3 fix pass"): goods as encoded, strict compliance, k=6 and 8, both encoders read the same; a statement about encodings (ADR 0011). Two measures, never combined: guaranteed (the rules as obeyed force the good) and possible (it can hold under the rules as obeyed, within k, at one step, for some bearer in some starting world). Guaranteed: R2 (the husband''s maintenance duty) is guarantee-carrying for 4 goods formulas that read one strand, provides_care(h, w) (cared_for, known_carer, mutual_household_care, provided_for); R3 (the wife''s implicit, sanctioned household duty) is guarantee-carrying for mutual_household_care only: guaranteed only by R3, an implicit sanctioned duty; deleting it removes the guarantee of the husband''s receipt of household labour; not advice to keep it. Possible: no single deletion makes any good impossible (R2 and R3 unread); chosen_mutual_care (revision 3: it now excludes care that any rule obliges either spouse to give, read through the derived fluent care_obliged) is absent in the base by construction: R2 and R3 oblige care at every married step (the dataset''s care_obliged pins), so its not-obliged conjuncts fail there. Each of R2, R3 and R6 on its own bars it, so no single deletion makes it possible and it is absent in every single-deletion row (R6''s row: absent > absent; revision 2: absent > fragile); with R5 and R6 both deleted it stays absent (revision 2''s formula read that stable: obliged care read as chosen); it becomes possible (fragile: at one step, not throughout) only with all three of R2, R3 and R6 deleted, R5 present or not (scratch probes, not ablation rows). That holds even though R5, the husband''s power to chastise her, remains: the no-sanction clause reads only a power enabled at that step and R5''s condition (misbehaves) starts false, so the clause is idle under strict compliance; this reading must not be used, in slice 4 or elsewhere, to say that deleting R2, R3 and R6 yields chosen care free of domination. Any spousal duty of care or support would make the good unattainable in the same way, so the absence does not distinguish coverture from later marriage law. The guaranteed column is not meaningful for this good. Primary measure (the author''s value call per good, revision 3 R3.1; one measure per good, never two for one good): R2 is carrying (guaranteed) for cared_for and provided_for; under the author''s value call and the dataset''s mutual_household_care formula, R3 carries no good on the primary column (its only load is a guarantee of mutual_household_care, a good the author reads as possible). The possible measure cannot tell forced from free mutual care, so R3''s imposition is not visible there: carrying no good is not imposing no cost on any good. Under the blind-gloss experiment''s formulas R3 reads carrying (possible), a reading the revision-3 faithfulness review judged unfaithful (provides_care lumps maintenance with household labour). R4, R6, R7 read tying. Title-route end state of the route comparison: G guaranteed 5 here vs 4 in coverture-floor, by construction: the same margin case as C (provided_for on R2 for a wife with neither property nor wages); G possible 0 vs 0. Under strict compliance R2''s unsanctioned duty reads as delivered maintenance; the historical enforcement (tradesmen''s claims for necessaries) is not represented. Second encoder: agent, not someone living under the institution (ADR 0012).'
