id: airline-flight
name: Airline flight (permanent negative control, EXPECTED to match the care+control cluster)
roles:
- name: crew
  gloss: cabin crew; serves and may restrain
- name: passenger
  gloss: a passenger aboard; the counterparty
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [passenger]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [crew, passenger]
- name: care_obliged
  arity: 2
  gloss: 'some rule in force at this step obliges x to give care to y (a must on the care act or the care state, sanctioned or not); derived from the rules, not asserted'
  arg_roles: [crew, passenger]
  params: [x, y]
  derived: (obliged provides_care x y)
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [c, p]
  derived: (enabled restrain c p)
  arg_roles: [crew, passenger]
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [p]
  derived: (enabled leave p)
  arg_roles: [passenger]
- name: aboard
  arity: 1
  gloss: p is aboard a flight in the air
  arg_roles: [passenger]
- name: disruptive
  arity: 1
  gloss: p is behaving disruptively (exogenous)
  arg_roles: [passenger]
- name: restrained
  arity: 1
  gloss: p is physically restrained
  arg_roles: [passenger]
actions:
- name: board
  args: [c, p]
  effects:
  - fluent: aboard
    args: [p]
    value: true
  - fluent: is_subject
    args: [p]
    value: true
  - fluent: provides_care
    args: [c, p]
    value: true
- name: attend
  args: [c, p]
  effects:
  - fluent: provides_care
    args: [c, p]
    value: true
- name: withdraw
  args: [c, p]
  effects:
  - fluent: provides_care
    args: [c, p]
    value: false
- name: restrain
  args: [c, p]
  effects:
  - fluent: restrained
    args: [p]
    value: true
- name: leave
  args: [p]
  effects:
  - fluent: aboard
    args: [p]
    value: false
  - fluent: is_subject
    args: [p]
    value: false
  - fluent: provides_care
    args: [crew, p]
    value: false
  default_capacity: true
- name: complain
  args: [p]
  effects: []
rules:
- id: R1
  plain: 'The crew may board the passenger when the passenger is not aboard.'
  attribute: crew
  deontic: may
  aim: (board c p)
  conditions: (not (aboard p))
  or_else: null
  strand: tying
  implicit: false
  source: 'Reconstruction from the third review''s 6-rule sketch (no statute opened): 14 CFR 91.11 / 121.580 (interference with crew; crew may restrain) and flight-attendant duties are named by the reviewer from general knowledge. UNVERIFIED (general knowledge; no source opened)'
  provenance:
  - source_id: cfr-14-91-11
    pin: null
    jurisdiction: US
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: no marker next to the citation; the lowest marker later in the string reads unverified
  - source_id: cfr-14-121-580
    pin: null
    jurisdiction: US
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: old source string says UNVERIFIED
  var_roles:
    c: crew
    p: passenger
- id: R2
  plain: 'The crew providing care to the passenger must hold when the passenger is aboard (14 CFR 121.571 supports only a briefing and assistance duty; the general in-flight care duty is unverified).'
  attribute: crew
  deontic: must
  aim: (provides_care c p)
  conditions: (aboard p)
  or_else: null
  strand: superadditive
  implicit: false
  source: '14 CFR 121.571 ''Briefing passengers before takeoff'', read 2026-11-04 at https://www.law.cornell.edu/cfr/text/14/121.571 (ecfr.gov redirected to a block page): (a) ''shall insure that all passengers are orally briefed by the appropriate crewmember''; (a)(3) a required crewmember assigned to the flight must individually brief each person who may need another person''s help to reach an exit. That is a crew duty toward passengers aboard, but narrower than the rule''s provides_care (maintenance, services): the general in-flight care duty is UNVERIFIED (no text opened states it; 14 CFR 121.391, read at https://www.law.cornell.edu/cfr/text/14/121.391, only sets the number of flight attendants ''to provide the most effective egress of passengers''). 14 CFR 91.11 / 121.580 dropped 2026-11-04: they only forbid interference with crew. [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] board establishes provides_care; attend restores it, withdraw breaks it'
  provenance:
  - source_id: cfr-14-121-571
    pin: s. 121.571(a), (a)(3)
    jurisdiction: US
    effective_date: null
    verification: opened
    excerpt: shall insure that all passengers are orally briefed by the appropriate crewmember
    accessed: '2026-11-04'
    url: https://www.law.cornell.edu/cfr/text/14/121.571
    note: ecfr.gov redirected to a block page; supports a briefing duty, narrower than the rule's provides_care
  - source_id: cfr-14-121-391
    pin: s. 121.391
    jurisdiction: US
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: https://www.law.cornell.edu/cfr/text/14/121.391
    note: 'the string says ''read at <url>'' and quotes ''to provide the most effective egress of passengers'' but gives no read date for this section (121.571''s date is not borrowed): recalled, re-open to upgrade (review 2026-11-05, finding 10); only sets the number of flight attendants'
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'the general in-flight care duty: UNVERIFIED (no text opened states it)'
  load_bearing: true
  var_roles:
    c: crew
    p: passenger
- id: R3
  plain: 'The crew may restrain the passenger when the passenger is aboard and disruptive (14 CFR 91.11 / 121.580, unverified).'
  attribute: crew
  deontic: may
  aim: (restrain c p)
  conditions: (and (aboard p) (disruptive p))
  or_else: null
  strand: rival
  implicit: false
  source: 'Reconstruction from the third review''s 6-rule sketch (no statute opened): 14 CFR 91.11 / 121.580 (interference with crew; crew may restrain) and flight-attendant duties are named by the reviewer from general knowledge. UNVERIFIED (general knowledge; no source opened) (crew may restrain a disruptive passenger)'
  provenance:
  - source_id: cfr-14-91-11
    pin: null
    jurisdiction: US
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: no marker next to the citation; the lowest marker later in the string reads unverified
  - source_id: cfr-14-121-580
    pin: null
    jurisdiction: US
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: old source string says UNVERIFIED
  var_roles:
    c: crew
    p: passenger
- id: R4
  plain: 'The passenger cannot leave while aboard: no such power exists (14 CFR 91.11 / 121.580, unverified).'
  attribute: passenger
  deontic: must_not
  aim: (leave p)
  conditions: (aboard p)
  or_else: null
  strand: rival
  implicit: false
  source: 'Reconstruction from the third review''s 6-rule sketch (no statute opened): 14 CFR 91.11 / 121.580 (interference with crew; crew may restrain) and flight-attendant duties are named by the reviewer from general knowledge. UNVERIFIED (general knowledge; no source opened) (a passenger cannot leave in flight). [ADR 0013: or_else -> null. The subject''s exit bar is a disability (no permitted exit exists), not a prohibition the subject answers for; the sanction power that used to be linked here keeps its own trigger condition, so under strict compliance nothing changes and the link only duplicated it. Same reading for coverture R6, police-crisis R4, cps R10 and companion R6.] [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(p) = leave enabled (a default capacity), which this disability makes false aboard'
  provenance:
  - source_id: cfr-14-91-11
    pin: null
    jurisdiction: US
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
