    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: owner may have the animal euthanized by a veterinarian'
- id: R3
  plain: 'The owner must not abandon the animal when the owner owns it, or else the state may prosecute (R4) (Cal. Penal Code 597s).'
  attribute: owner
  deontic: must_not
  aim: (abandon o a)
  conditions: (owns o a)
  or_else: R4
  strand: rival
  implicit: false
  kind: formal
  sanctioner: state
  sanctioner_review: derived
  source: 'Cal. Penal Code s. 597s(a); https://law.justia.com/codes/california/2015/code-pen/part-1/title-14/section-597s/ (''Every person who willfully abandons any animal is guilty of a misdemeanor'') Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_penal_code_section_597s (text ''updated Jan. 1, 2000'' per the page): (a) ''Every person who willfully abandons any animal is guilty of a misdemeanor.'''
  provenance:
