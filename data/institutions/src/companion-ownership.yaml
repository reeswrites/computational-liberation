id: companion-ownership
name: Companion animal as property (owner may transfer, euthanize; abandonment sanctioned; no standing)
roles:
- name: owner
  gloss: the person holding title to the animal
- name: animal
  gloss: the companion animal; the subject
- name: state
  gloss: animal control / prosecutor
- name: court
  gloss: civil court; here, has no best-interest power
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [animal]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [owner, animal]
- name: owns
  arity: 2
  gloss: x owns y as property
  arg_roles: [owner, animal]
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [o, a]
  derived: (or (enabled euthanize o a) (exists ((x agent)) (enabled transfer o a x)))
  arg_roles: [owner, animal]
- name: controls_reproduction
  arity: 2
  gloss: x may set or prevent pregnant(y)
  params: [o, a]
  derived: (enabled breed_or_sterilize o a)
  arg_roles: [owner, animal]
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [a]
  derived: (enabled leave a)
  arg_roles: [animal]
- name: has_standing
  arity: 1
  gloss: x can start a legal claim in x's own name
  params: [a]
  derived: (enabled sue a)
  arg_roles: [animal]
- name: can_claim_for
  arity: 2
  gloss: x may start a claim whose condition refers to y's interest and whose effect changes y's custody or liberty
  params: [x, a]
  derived: (exists ((o agent)) (enabled reassign x o a))
  arg_roles: [court, animal]
- name: abandoned
  arity: 1
  gloss: a has been wilfully abandoned by its owner
  arg_roles: [animal]
- name: at_large
  arity: 1
  gloss: a is loose off the owner's premises
  arg_roles: [animal]
- name: best_interest
  arity: 2
  gloss: custody with x is in a's best interest / well-being
  arg_roles: [owner, animal]
actions:
- name: acquire
  args: [o, a]
  effects:
  - fluent: owns
    args: [o, a]
    value: true
  - fluent: is_subject
    args: [a]
    value: true
  - fluent: provides_care
    args: [o, a]
    value: true
- name: feed
  args: [o, a]
  effects:
  - fluent: provides_care
    args: [o, a]
    value: true
- name: neglect
  args: [o, a]
  effects:
  - fluent: provides_care
    args: [o, a]
    value: false
- name: transfer
  args: [o, a, o2]
  effects:
  - fluent: owns
    args: [o, a]
    value: false
  - fluent: provides_care
    args: [o, a]
    value: false
  - fluent: owns
    args: [o2, a]
    value: true
- name: euthanize
  args: [o, a]
  effects:
  - fluent: is_subject
    args: [a]
    value: false
- name: abandon
  args: [o, a]
  effects:
  - fluent: abandoned
    args: [a]
    value: true
  - fluent: owns
    args: [o, a]
    value: false
  - fluent: provides_care
    args: [o, a]
    value: false
- name: breed_or_sterilize
  args: [o, a]
  effects: []
- name: prosecute
  args: [state, o]
  effects: []
- name: leave
  args: [a]
  effects:
  - fluent: at_large
    args: [a]
    value: true
  default_capacity: true
- name: sue
  args: [a]
  effects: []
- name: impound
  args: [state, a]
  effects:
  - fluent: at_large
    args: [a]
    value: false
- name: reassign
  args: [court, o, a]
  effects:
  - fluent: owns
    args: [o, a]
    value: false
  - fluent: provides_care
    args: [o, a]
    value: false
rules:
- id: R1
  plain: ''
  attribute: owner
  deontic: may
  aim: (transfer o a o2)
  conditions: (owns o a)
  or_else: null
  strand: rival
  implicit: false
  source: 'property status of companion animals; Cal. Penal Code s. 597s(a); https://law.justia.com/codes/california/2015/code-pen/part-1/title-14/section-597s/. [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_sanction(o, a) reads transfer and euthanize'
- id: R2
  plain: ''
  attribute: owner
  deontic: may
  aim: (euthanize o a)
  conditions: (owns o a)
  or_else: null
  strand: rival
  implicit: false
  source: 'owner may have the animal euthanized by a veterinarian. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_sanction(o, a) reads transfer and euthanize'
- id: R3
  plain: ''
  attribute: owner
  deontic: must_not
  aim: (abandon o a)
  conditions: (owns o a)
  or_else: R4
  strand: rival
  implicit: false
  source: Cal. Penal Code s. 597s(a); https://law.justia.com/codes/california/2015/code-pen/part-1/title-14/section-597s/ ('Every person who willfully abandons any animal is guilty of a misdemeanor')
- id: R4
  plain: ''
  attribute: state
  deontic: may
  aim: (prosecute state o)
  conditions: (abandoned a)
  or_else: null
  strand: rival
  implicit: false
  source: Cal. Penal Code s. 597s(a); https://law.justia.com/codes/california/2015/code-pen/part-1/title-14/section-597s/
- id: R5
  plain: ''
  attribute: owner
  deontic: must
  aim: (provides_care o a)
  conditions: (owns o a)
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Cal. Penal Code 597(b) failure to provide food/water/shelter. UNVERIFIED (general knowledge; no source opened). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] acquire (and the initial state) establishes provides_care; feed restores it, neglect breaks it'
  load_bearing: true
- id: R6
  plain: ''
  attribute: animal
  deontic: must_not
  aim: (leave a)
  conditions: (is_subject a)
  or_else: null
  strand: rival
  implicit: true
  source: 'implicit: confinement / leash norm; the animal has no permitted exit while it is a companion animal, owned or stray (an animal at large is impounded, R7). UNVERIFIED (general knowledge; no source opened). [ADR 0013: or_else R7 -> null and condition owns -> is_subject: a disability on the animal, not a sanctioned prohibition (impound is the state''s power over an at-large animal, triggered by at_large, not a penalty the animal answers for), and conditioned on the animal''s status rather than on title so that reassign / abandon, which clear owns in the one-owner domain, do not read as giving the animal an exit.] [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(a) = leave enabled, which this disability makes false'
- id: R7
  plain: ''
  attribute: state
  deontic: may
  aim: (impound state a)
  conditions: (at_large a)
  or_else: null
  strand: rival
  implicit: false
  source: local animal-control impound of animals at large. UNVERIFIED (general knowledge; no source opened)
- id: R8
  plain: ''
  attribute: owner
  deontic: may
  aim: (breed_or_sterilize o a)
  conditions: (owns o a)
  or_else: null
  strand: rival
  implicit: false
  source: 'incident of ownership. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] controls_reproduction(o, a) = breed_or_sterilize enabled'
- id: R9
  plain: ''
  attribute: court
  deontic: must_not
  aim: (reassign court o a)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: true
  source: 'implicit: no role may start a claim in the animal''s own interest; animals are property and cannot sue, and custody follows title. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_claim_for(court, a) = reassign enabled, which this disability makes false'
- id: R10
  plain: ''
  attribute: owner
  deontic: may
  aim: (feed o a)
  conditions: (and (owns o a) (not (provides_care o a)))
  or_else: null
  strand: superadditive
  implicit: false
  source: feeding is the owner's act (incident of ownership) and restores provides_care after neglect; added with ADR 0009 so that feed, now discretionary, is scoped to the owner of the animal rather than always enabled. UNVERIFIED (general knowledge; no source opened)
- id: R11
  plain: ''
  attribute: animal
  deontic: must_not
  aim: (sue a)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: true
  source: 'implicit: an animal is property and cannot sue in its own name (a disability, or_else null). UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] has_standing(a) = sue enabled, which this disability makes false'
source_text: '''Every person who willfully abandons any animal is guilty of a misdemeanor.'' Cal. Penal Code s. 597s(a), read at https://law.justia.com/codes/california/2015/code-pen/part-1/title-14/section-597s/. Companion animals are personal property: the owner may sell, give away or have the animal euthanized, must feed it, and the animal cannot bring or be the subject of a claim in its own name (property status and anti-cruelty duties cited from general knowledge, UNVERIFIED).'
expected_properties:
  no_standing_persists: persists
  subject_cannot_exit_persists: persists
  reproduction_controlled_by_owner: holds_to_k
  care_and_sanction_same_role: holds_to_k
isomorphic_to: [companion-guardian-renamed]
not_isomorphic_to: [companion-guardianship]
minimal_pair_of: null
notes: 'Baseline for the cosmetic-reform test (gate f). The owner both must feed (R5) and may transfer, euthanize, breed (R1, R2, R8): care + control again, and the animal has no exit (R6, implicit) and no standing (R9, implicit, encoded as a court-side disability because the grammar has no ''no rule exists'' statement). Pitfalls: (1) R9 is the rule the guardianship variant flips; an encoder that omits it as ''obviously true'' makes no_standing undecidable rather than holding; (2) R6 is a disability on the animal (ADR 0013; it used to carry or_else R7): impound R7 is the state''s power over an at-large animal, conditioned on at_large, and must not be read as the owner sanctioning the exit; (3) welfare duties (R3, R5) are must rules on the owner that leave owns untouched; check persists(owns) with and without them, as the plan says for dairy. Only Penal Code 597s was read; the rest is UNVERIFIED in source. Any iso with coverture-household on ''cannot sue in own name'' and ''no exit'' is structural and partial: it asserts nothing about equal standing or harm. ADR 0009: R5 is a state obligation (must-be provides_care while owns); as a per-step ''must feed'' it filled the one action slot at every owned step and starved transfer, euthanize and reassign.'
initial:
- (owns owner animal)
- (is_subject animal)
- (provides_care owner animal)
initial_free: [best_interest]
