id: companion-ownership
name: Companion animal as property (owner may transfer, euthanize; abandonment sanctioned; no standing)
roles:
- name: owner
  gloss: the person holding title to the animal
- name: animal
  gloss: the companion animal; the subject
- name: state
  gloss: animal control / prosecutor
- name: court
  gloss: civil court; here, has no best-interest power
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [animal]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [owner, animal]
- name: care_obliged
  arity: 2
  gloss: 'some rule in force at this step obliges x to give care to y (a must on the care act or the care state, sanctioned or not); derived from the rules, not asserted'
  arg_roles: [owner, animal]
  params: [x, y]
  derived: (obliged provides_care x y)
- name: owns
  arity: 2
  gloss: x owns y as property
  arg_roles: [owner, animal]
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [o, a]
  derived: (or (enabled euthanize o a) (exists ((x agent)) (enabled transfer o a x)))
  arg_roles: [owner, animal]
- name: controls_reproduction
  arity: 2
  gloss: x may set or prevent pregnant(y)
  params: [o, a]
  derived: (enabled breed_or_sterilize o a)
  arg_roles: [owner, animal]
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [a]
  derived: (enabled leave a)
  arg_roles: [animal]
- name: has_standing
  arity: 1
  gloss: x can start a legal claim in x's own name
  params: [a]
  derived: (enabled sue a)
  arg_roles: [animal]
- name: can_claim_for
  arity: 2
  gloss: x may start a claim whose condition refers to y's interest and whose effect changes y's custody or liberty
  params: [x, a]
  derived: (exists ((o agent)) (enabled reassign x o a))
  arg_roles: [court, animal]
- name: abandoned
  arity: 1
  gloss: a has been wilfully abandoned by its owner
  arg_roles: [animal]
- name: at_large
  arity: 1
  gloss: a is loose off the owner's premises
  arg_roles: [animal]
- name: best_interest
  arity: 2
  gloss: custody with x is in a's best interest / well-being
  arg_roles: [owner, animal]
actions:
- name: acquire
  args: [o, a]
  effects:
  - fluent: owns
    args: [o, a]
    value: true
  - fluent: is_subject
    args: [a]
    value: true
  - fluent: provides_care
    args: [o, a]
    value: true
- name: feed
  args: [o, a]
  effects:
  - fluent: provides_care
    args: [o, a]
    value: true
- name: neglect
  args: [o, a]
  effects:
  - fluent: provides_care
    args: [o, a]
    value: false
- name: transfer
  args: [o, a, o2]
  effects:
  - fluent: owns
    args: [o, a]
    value: false
  - fluent: provides_care
    args: [o, a]
    value: false
  - fluent: owns
    args: [o2, a]
    value: true
- name: euthanize
  args: [o, a]
  effects:
  - fluent: is_subject
    args: [a]
    value: false
- name: abandon
  args: [o, a]
  effects:
  - fluent: abandoned
    args: [a]
    value: true
  - fluent: owns
    args: [o, a]
    value: false
  - fluent: provides_care
    args: [o, a]
    value: false
- name: breed_or_sterilize
  args: [o, a]
  effects: []
- name: prosecute
  args: [state, o]
  effects: []
- name: leave
  args: [a]
  effects:
  - fluent: at_large
    args: [a]
    value: true
  default_capacity: true
- name: sue
  args: [a]
  effects: []
- name: impound
  args: [state, a]
  effects:
  - fluent: at_large
    args: [a]
    value: false
- name: reassign
  args: [court, o, a]
  effects:
  - fluent: owns
    args: [o, a]
    value: false
  - fluent: provides_care
    args: [o, a]
    value: false
rules:
- id: R1
  plain: 'The owner may transfer the animal to another when the owner owns it (Cal. Civ. Code 655, 663).'
  attribute: owner
  deontic: may
  aim: (transfer o a o2)
  conditions: (owns o a)
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'property status of companion animals: Cal. Civ. Code s. 655: ''There may be ownership of all inanimate things which are capable of appropriation or of manual delivery; of all domestic animals''; s. 663: ''Every kind of property that is not real is personal'' (s. 658 defines real property as land and what is affixed or incidental to it, so a domestic animal is personal property). Read 2026-11-04 at https://codes.findlaw.com/ca/civil-code/civ-sect-655/ and https://codes.findlaw.com/ca/civil-code/civ-sect-663/ (leginfo.legislature.ca.gov and law.justia.com returned 403). Transfer is an incident of ownership of personal property; Cal. Penal Code 597s (wilful abandonment, cited here until 2026-11-04) says nothing about property status and is cited on R3 only. [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_sanction(o, a) reads transfer and euthanize'
  provenance:
  - source_id: cal-civ-655
    pin: s. 655
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: There may be ownership of all inanimate things which are capable of appropriation or of manual delivery; of all domestic animals
    accessed: '2026-11-04'
    url: https://codes.findlaw.com/ca/civil-code/civ-sect-655/
    note: leginfo.legislature.ca.gov and law.justia.com returned 403
  - source_id: cal-civ-663
    pin: s. 663
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: Every kind of property that is not real is personal
    accessed: '2026-11-04'
    url: https://codes.findlaw.com/ca/civil-code/civ-sect-663/
    note: ''
  - source_id: cal-civ-658
    pin: s. 658
    jurisdiction: US-CA
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited (defines real property) with no record of reading; re-open to upgrade
- id: R2
  plain: 'The owner may have the animal euthanized when the owner owns it.'
  attribute: owner
  deontic: may
  aim: (euthanize o a)
  conditions: (owns o a)
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'owner may have the animal euthanized by a veterinarian. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_sanction(o, a) reads transfer and euthanize'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
