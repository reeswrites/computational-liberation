id: ssi-marriage-penalty-individual
name: 'SSI with the couple resource limit removed (one-rule pair of ssi-marriage-penalty: R3 dropped; couple rate and holding-out test kept); power reading only'
extends: ssi-marriage-penalty
rules_drop: [R3]
expected_properties:
  married_couple_rated: holds_to_k
  married_couple_limited: violated
  penalty_reaches_unmarried: reachable
  married_rated_individually: reachable
  over_limit_ineligible: holds_to_k
minimal_pair_of:
  id: ssi-marriage-penalty
  rule: R3
  differs_on: married_couple_limited
notes: 'One-rule pair since revision 2 (plans/ssi-entry.md, "Revision 2 run", preregistered 2026-11-09; item 4 ruled 2026-11-09): the base with R3, the couple resource limit, dropped and nothing else changed; preregistered to differ from the base on married_couple_limited (holds_to_k in the base, violated here). Power reading only, as the base: `violated` means the agency holds no power to apply the couple limit, not that a law is broken; dollar amounts are not modelled. Known limit: with R3 gone a married pair living together has neither the couple limit nor the individual limit (R6 excludes them), so this is a one-rule deletion in the ADR 0007 sense, not a coherent reform text; no reform bill was read (S. 73 of 2025 is an unopened lead). The entry id is kept from the earlier pair and no longer describes it: R2 (couple rate), R4 (holding out), R5 and R6 (individual rate and limit, conditioned) and R7 (resource bar) are all inherited unchanged, and `pay_benefit` is the base''s default capacity. PREVIOUS PAIR, superseded 2026-11-09 and recorded here: a five-rule reform pair, `rules_drop: [R2, R3, R4]` with R5 and R6 replaced by `may ... when true` rows (individual rate and limit whatever the marital status; unverified counterfactuals resting on no source), `minimal_pair_of.rule: R2,R3,R4,R5,R6`, `differs_on: married_couple_rated`; its verdicts at k 6 and 8 were married_couple_rated violated, married_couple_limited violated, penalty_reaches_unmarried unreachable_open, married_rated_individually reachable, over_limit_ineligible holds_to_k (plans/ssi-entry.md Results, run 2026-11-08). Its notes read: This is a 5-rule reform pair, not a minimal pair (the field name `minimal_pair_of` is the dataset''s, ADR 0007 names one-rule pairs as the model). Revision 2 options for a one-rule pair: drop R3 alone (flips married_couple_limited), or drop R4 alone (holding out removed; flips penalty_reaches_unmarried). Dropping R2 alone leaves married pairs with no rate, which is why the reform edits R5 and R6. Penalty removed: R2, R3 (couple rate and limit gated on marriage) and R4 (the holding-out gate) are dropped, and R5, R6 lose their marital-status condition, so the individual rate and limit apply to every claimant. This is not one rule apart (three dropped, two edited); `rule` names the five rules (R2,R3,R4 dropped; R5,R6 replaced) and the pair is read on verdicts, not on the one-rule gate. R5 and R6 of the pair rest on no source (unverified counterfactuals). `violated` here means the power is absent, not that a law is broken; dollar amounts are not modelled. Holding out is DROPPED, not kept: with no couple rate there is nothing for the test to gate, and no reform text was read that keeps it (S. 73 of 2025 is an unopened lead; the CRS report gives rule and size only). The fluents `holds_out`, `cohabits` and the actions remain declared so the two entries share a vocabulary and can be compared; here they gate nothing. The resource bar (R1, R7) is kept: the reform removes the penalty, not the resource test. Preregistered in plans/ssi-entry.md before any run. (end of the previous pair''s notes). Consent guard ruling, quoted exactly: "Consent guard note (plans/consent-guard-note-DRAFT.md) ruled not applicable to benefits rules by the author, 2026-11-08."'
