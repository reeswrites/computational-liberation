id: coverture-household
name: Coverture household (Blackstone)
roles:
- name: husband
  gloss: the husband; the legal person the marriage keeps
- name: wife
  gloss: the feme covert; her legal existence is suspended during marriage
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
- name: female
  arity: 1
  gloss: x is female (sex as assigned by the institution's own records)
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [h, w]
  derived: (enabled chastise h w)
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [w]
  derived: (enabled leave w)
- name: has_standing
  arity: 1
  gloss: x can start a legal claim in x's own name
  params: [w]
  derived: (enabled sue w)
- name: married
  arity: 2
  gloss: h and w are married
- name: controls_property
  arity: 2
  gloss: h holds and manages w's property and earnings
  params: [h, w]
  derived: (enabled control_property h w)
- name: controls_own_property
  arity: 1
  gloss: w holds and controls separate property in her own right
  params: [w]
  derived: (enabled hold_property w)
- name: owns_earnings
  arity: 1
  gloss: w's earnings are her own separate property
  params: [w]
  derived: (enabled keep_earnings w)
- name: can_contract
  arity: 1
  gloss: w may contract in her own name
  params: [w]
  derived: (enabled contract w)
- name: acquired_property
  arity: 1
  gloss: w has acquired property by gift or inheritance (exogenous)
- name: earns
  arity: 1
  gloss: w earns wages outside the household (exogenous)
- name: misbehaves
  arity: 1
  gloss: w's conduct is what the old law called gross misbehaviour (the encoder's name for Blackstone's condition on restraint)
actions:
- name: marry
  args: [h, w]
  effects:
  - fluent: married
    args: [h, w]
    value: true
  - fluent: is_subject
    args: [w]
    value: true
  - fluent: provides_care
    args: [h, w]
    value: true
  - fluent: provides_care
    args: [w, h]
    value: true
- name: hold_property
  args: [w]
  effects: []
- name: keep_earnings
  args: [w]
  effects: []
- name: maintain
  args: [h, w]
  effects:
  - fluent: provides_care
    args: [h, w]
    value: true
- name: neglect
  args: [h, w]
  effects:
  - fluent: provides_care
    args: [h, w]
    value: false
- name: keep_house
  args: [w, h]
  effects:
  - fluent: provides_care
    args: [w, h]
    value: true
- name: neglect_house
  args: [w, h]
  effects:
  - fluent: provides_care
    args: [w, h]
    value: false
- name: control_property
  args: [h, w]
  effects: []
- name: chastise
  args: [h, w]
  effects: []
- name: misbehave
  args: [w]
  effects:
  - fluent: misbehaves
    args: [w]
    value: true
- name: leave
  args: [w]
  effects: []
  default_capacity: true
- name: sue
  args: [w]
  effects: []
  default_capacity: true
- name: contract
  args: [w]
  effects: []
  default_capacity: true
rules:
- id: R1
  plain: 'The husband may control his wife''s property when they are married (Blackstone II.29).'
  attribute: husband
  deontic: may
  aim: (control_property h w)
  conditions: (married h w)
  or_else: null
  strand: tying
  implicit: false
  source: 'Blackstone, Commentaries on the Laws of England, Book II ch. 29 ''Of Title by Succession, Marriage, and Judgment'' (1766), read 2026-11-04 at https://avalon.law.yale.edu/18th_century/blackstone_bk2ch29.asp: chattels ''which belonged formerly to the wife, are by act of law vested in the husband'' and ''the husband hath therein an immediate and absolute property, devolved to him by the marriage'' (long s modernised from the OCR). Re-sourced 2026-11-04: Book I ch. 15 (the earlier citation; https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/, the husband and wife are one person in law) says ''I speak not at present of the rights of property'' and so did not support this rule.'
  provenance:
  - source_id: blackstone-1766-bk2-ch29
    pin: Bk II ch 29
    jurisdiction: England
    effective_date: null
    verification: opened
    excerpt: which belonged formerly to the wife, are by act of law vested in the husband ... the husband hath therein an immediate and absolute property, devolved to him by the marriage
    accessed: '2026-11-04'
    url: null
    note: long s modernised from the OCR
- id: R2
  plain: 'The husband providing care to his wife must hold when they are married; no sanction is attached (Blackstone I.15).'
  attribute: husband
  deontic: must
  aim: (provides_care h w)
  conditions: (married h w)
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Blackstone, Commentaries on the Laws of England, Book I ch. 15 ''Of Husband and Wife'' (1765); https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/ (the husband is bound to provide his wife with necessaries). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] marry establishes provides_care(h, w); maintain restores it, neglect breaks it'
  provenance:
  - source_id: blackstone-1765-bk1-ch15
    pin: Bk I ch 15
    jurisdiction: England
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/
    note: cited via the NYHS WAMS page with a paraphrase, no read date or quote in this row (the entry source_text quotes Bk I ch 15 and says the passage was checked); re-open to upgrade
  load_bearing: true
- id: R3
  plain: '(practice, not written) The wife providing care to her husband (household labour) must hold when they are married, or else the husband may chastise her (R5).'
  attribute: wife
  deontic: must
  aim: (provides_care w h)
  conditions: (married h w)
  or_else: R5
  strand: superadditive
  implicit: true
  source: 'implicit norm: household labour is the wife''s; not in Blackstone''s text, assumed by it. UNVERIFIED (general knowledge; no source opened). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] marry establishes provides_care(w, h); keep_house restores it, neglect_house breaks it (sanction R5)'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: implicit norm: household labour is the wife''s; not in Blackstone''s text, assumed by it'
  load_bearing: true
- id: R4
  plain: 'The wife cannot sue in her own name while married: no such power exists (Blackstone I.15).'
  attribute: wife
  deontic: must_not
  aim: (sue w)
  conditions: (married h w)
  or_else: null
  strand: tying
  implicit: false
  source: 'Blackstone, Commentaries on the Laws of England, Book I ch. 15 ''Of Husband and Wife'' (1765); https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/ (she cannot sue or be sued in her own name without her husband); a disability, not a sanctioned prohibition, hence or_else null. [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] has_standing(w) = sue enabled (a default capacity), which this disability removes while married'
  provenance:
  - source_id: blackstone-1765-bk1-ch15
    pin: Bk I ch 15
    jurisdiction: England
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/
    note: cited via the NYHS WAMS page with a paraphrase, no read date or quote in this row (the entry source_text quotes Bk I ch 15 and says the passage was checked); re-open to upgrade
- id: R5
  plain: 'The husband may chastise his wife (restrain her liberty) when they are married and her conduct is gross misbehaviour (Blackstone I.15).'
  attribute: husband
  deontic: may
  aim: (chastise h w)
  conditions: (and (married h w) (misbehaves w))
  or_else: null
  strand: rival
  implicit: false
  source: 'Blackstone, Commentaries on the Laws of England, Book I ch. 15 ''Of Husband and Wife'' (1765), read 2026-11-04 at https://avalon.law.yale.edu/18th_century/blackstone_bk1ch15.asp: ''The husband also (by the old law) might give his wife moderate correction'' ... ''the courts of law will still permit a husband to restrain a wife of her liberty, in case of any gross misbehaviour'' (long s modernised from the OCR). Earlier pointer: https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/. The condition (misbehaves w) is set by the free action misbehave, which no rule regulates: the encoder''s way to make Blackstone''s condition reachable.'
  provenance:
  - source_id: blackstone-1765-bk1-ch15
    pin: Bk I ch 15
    jurisdiction: England
    effective_date: null
    verification: opened
    excerpt: The husband also (by the old law) might give his wife moderate correction ... the courts of law will still permit a husband to restrain a wife of her liberty, in case of any gross misbehaviour
    accessed: '2026-11-04'
    url: null
    note: long s modernised from the OCR; earlier pointer https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/
  choices: 'Broad reading (the encoding until 2026-11-04): may chastise whenever married; the care+control match with police-crisis R3 (detain) and cps R3 (remove) was read on it. Narrow reading (chosen 2026-11-04): Blackstone''s text makes moderate correction ''the old law'' and permits restraint only ''in case of any gross misbehaviour''; the fluent misbehaves and the free action misbehave are the encoder''s device for that condition.'
- id: R6
  plain: 'The wife cannot leave the marriage while married: no such power exists (no unilateral exit before the Matrimonial Causes Act 1857; unverified).'
  attribute: wife
  deontic: must_not
  aim: (leave w)
  conditions: (married h w)
  or_else: null
  strand: rival
  implicit: false
  source: 'UNVERIFIED (not opened 2026-11-04): Shanley, Feminism, Marriage and the Law in Victorian England, 1850-1895 (1989), and Stone, Road to Divorce: England 1530-1987 (1990), on restitution of conjugal rights and the absence of any unilateral exit from marriage before the Matrimonial Causes Act 1857 (archive.org search-inside returned 403 and the Google Books API 429, two tries each). Re-sourced 2026-11-04: Blackstone Book I ch. 15 (https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/), cited before, contains no exit bar (its nearest passage: an eloping wife forfeits necessaries) and is no longer cited for this rule. [ADR 0013: or_else -> null. The subject''s exit bar is a disability (no permitted exit exists), not a prohibition the subject answers for; the sanction power that used to be linked here keeps its own trigger condition, so under strict compliance nothing changes and the link only duplicated it. Same reading for coverture R6, police-crisis R4, cps R10 and companion R6.] [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(w) = leave enabled (a default capacity), which this disability makes false while married'
  provenance:
  - source_id: shanley-1989
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: not opened 2026-11-04 (archive.org 403, Google Books API 429); cited for restitution of conjugal rights and no unilateral exit before the Matrimonial Causes Act 1857
  - source_id: stone-1990
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: not opened 2026-11-04 (archive.org 403, Google Books API 429); same point as Shanley
- id: R7
  plain: 'The wife cannot contract in her own name while married: no such power exists (Blackstone I.15).'
  attribute: wife
  deontic: must_not
  aim: (contract w)
  conditions: (married h w)
  or_else: null
  strand: tying
  implicit: false
  source: Blackstone, Commentaries on the Laws of England, Book I ch. 15 'Of Husband and Wife' (1765); https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/ (contracts between husband and wife void; her contracts are his)
  provenance:
  - source_id: blackstone-1765-bk1-ch15
    pin: Bk I ch 15
    jurisdiction: England
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/
    note: cited via the NYHS WAMS page with a paraphrase, no read date or quote in this row (the entry source_text quotes Bk I ch 15 and says the passage was checked); re-open to upgrade
source_text: '''By marriage, the husband and wife are one person in law: that is, the very being or legal existence of the woman is suspended during the marriage, or at least is incorporated and consolidated into that of the husband: under whose wing, protection, and cover, she performs every thing; and is therefore called ... a feme-covert.'' He cannot grant anything to her or covenant with her, she cannot sue in her own name, and ''the husband is bound to provide his wife with necessaries by law''. Blackstone, Commentaries on the Laws of England, Book I, ch. 15 (Oxford: Clarendon, 1765). Passage checked at https://wams.nyhistory.org/colonies-and-revolution/english-colonies/coverture/'
expected_properties:
  dependent_cannot_exit: reachable
  subject_cannot_exit: reachable
  care_and_sanction_same_role: holds_to_k
  no_standing: reachable
  care_assigned_by_sex: violated
  financial_dependence: holds_to_k
  financial_dependence_unpropertied: holds_to_k
  cannot_contract: holds_to_k
  double_burden: unreachable_open
  creditor_shield: unreachable_open
isomorphic_to:
- id: police-crisis
  level: guard+strands
  sub_signature:
  - R2~R2 provides_care~provides_care
  - R5~R3 chastise~detain
  - R6~R4 leave~leave
- id: cps
  level: guard+strands
  sub_signature:
  - R2~R4 provides_care~in_home_considered
  - R5~R3 chastise~remove
  - R6~R10 leave~leave
not_isomorphic_to: [crisis-team]
not_isomorphic_to_control: [lease, public-library, naming-convention]
minimal_pair_of: null
notes: 'Care + control: the husband both maintains (R2, provides_care h w) and may chastise/restrain (R5, can_sanction h w) the same subject. That is the sub-signature matched against police-crisis and cps; the wife''s own labour (R3) is implicit and runs the other way (provides_care w h), which is why care_and_sanction_same_role is restricted to care received by is_subject, and why care_assigned_by_sex is ''violated'' rather than ''holds'' (the husband''s maintenance also counts as care). Pitfalls: (1) an encoder that drops R3 loses the household-labour strand and reports the wife as purely a recipient of care; (2) R4 and R7 are disabilities (or_else null) and should not be lowered as sanctioned prohibitions; (3) no_standing is ''reachable'' not ''holds_to_k'' because before marry() the woman has standing (feme sole); the iso with the animal entries on ''cannot sue in own name'' holds only post-marriage and is structural, not a claim of equal status. Rival reading: equity courts'' separate estates (not encoded) gave propertied wives a partial exit from R1; recorded here, not in the rules. ADR 0009: R2 and R3 are state obligations (must-be provides_care); as per-step action obligations they filled the one action slot at every married step and made marriage unsatisfiable (care_assigned_by_sex held vacuously).'
