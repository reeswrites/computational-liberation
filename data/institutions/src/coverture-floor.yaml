id: coverture-floor
name: 'Coverture with a material floor (counterfactual: US coverture plus an income in her own right)'
extends: coverture-household-us
fluents_set:
  is_subject:
    arg_roles: [wife]
  female:
    arg_roles: [wife]
  can_sanction:
    arg_roles: [husband, wife]
  can_exit:
    arg_roles: [wife]
  has_standing:
    arg_roles: [wife]
  married:
    arg_roles: [husband, wife]
  controls_property:
    arg_roles: [husband, wife]
  controls_own_property:
    arg_roles: [wife]
  owns_earnings:
    arg_roles: [wife]
  can_contract:
    arg_roles: [wife]
  acquired_property:
    arg_roles: [wife]
  earns:
    arg_roles: [wife]
rules_add:
- id: R20
  plain: '(counterfactual, not historical) The wife may draw subsistence, an income in her own right from outside the marriage, at any time (the material floor; plans/priority-slice2.md section 5).'
  attribute: wife
  deontic: may
  aim: (draw_subsistence w)
  conditions: 'true'
  or_else: null
  strand: superadditive
  implicit: false
  source: 'counterfactual encoding: no work cited and none claimed; the rule is the floor route of plans/priority-slice2.md section 5 (preregistered 2026-11-06), read from the material floor of docs/glossary.md (subsistence regardless of any relationship). UNVERIFIED as history: no jurisdiction ever enacted it on the coverture frame.'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: counterfactual encoding: no work cited and none claimed; the rule is the floor route of plans/priority-slice2.md section 5 (preregistered 2026-11-06), read from the material floor of docs/glossary.md (subsistence regardless of any relationship)'
  var_roles:
    w: wife
  choices: 'Candidate wording (plans/priority.md, floor route vs title route): state must provide_subsistence w when (is_subject w). Deviation stated before any run (plans/priority-slice2.md section 5): (a) the dataset encodes a resource as a derived power over the holder''s action (R13, R14); a state duty with no matching power would leave every financial property blind, and an action must either fills the one action slot each step (ADR 0009) or, once deleted, leaves an unregulated action that fires freely; so the floor is the wife''s entitlement, the correlative of the state''s duty (ASSUMED: the engine has no duty/claim pairing). (b) condition true, not (is_subject w): is_subject is set only by marry, so the candidate''s floor was an allowance for wives, while the glossary''s floor is ''regardless of any relationship''. Strand superadditive is an ASSUMED placeholder: a floor is not a strand of the bundle and the tag vocabulary has no slot for it (recorded for the strand-tag redesign in docs/plan.md).'
source_text: 'Counterfactual, not a historical institution (ADR 0004: no forward claim; ADR 0011: every result is a statement about encodings). The US coverture base (coverture-household-us) plus one rule, R20, giving the wife an income in her own right regardless of marriage: the material floor of docs/glossary.md. Preregistered in plans/priority-slice2.md section 5 (2026-11-06) as the floor route, compared against the title route (the MWPA chain ending in mwpa-earnings).'
expected_properties:
  dependent_cannot_exit: reachable
  subject_cannot_exit: reachable
  care_and_sanction_same_role: holds_to_k
  no_standing: reachable
  care_assigned_by_sex: violated
  financial_dependence: holds_to_k
  financial_dependence_unpropertied: holds_to_k
  financial_dependence_means: violated
  financial_dependence_margin: violated
  cannot_contract: holds_to_k
  double_burden: unreachable_open
  creditor_shield: unreachable_open
isomorphic_to: []
not_isomorphic_to: []
not_isomorphic_to_control: []
minimal_pair_of: null
notes: 'COUNTERFACTUAL ENCODING (plans/priority-slice2.md section 5; provenance unverified). Base coverture-household-us, so the title route (mwpa-creditor-exemption -> mwpa-property -> mwpa-earnings) and the floor route start from one rule set; initial_free and the fluent arg_roles are mwpa-creditor-exemption''s, so both end states quantify over the same exogenous worlds. One rule added (R20); no R13, no R14, R1 kept: no property grant. PREREGISTERED (2026-11-06, before any run): financial_dependence and financial_dependence_unpropertied holds_to_k (both read only property and earnings, so they cannot see a floor: as written, material independence means title); financial_dependence_means violated; financial_dependence_margin violated BY CONSTRUCTION (R20''s condition is true); double_burden unreachable_open (needs owns_earnings, which only R14 grants); creditor_shield unreachable_open by construction (no creditor role; transferred and can_attach undeclared); exit, standing, contract, care and sanction as in the US base. Goods (slice 2): second encoder: agent, not someone living under the institution (ADR 0012). Rejected base: mwpa-creditor-exemption (would put the floor on a debtor-relief statute and make creditor_shield reachable); a later variant, not built.'
initial: []
initial_free: [female, acquired_property, earns]
