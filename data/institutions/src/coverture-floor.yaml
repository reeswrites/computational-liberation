notes: 'COUNTERFACTUAL ENCODING (plans/priority-slice2.md section 5; provenance unverified). Base coverture-household-us, so the title route (mwpa-creditor-exemption -> mwpa-property -> mwpa-earnings) and the floor route start from one rule set; initial_free and the fluent arg_roles are mwpa-creditor-exemption''s, so both end states quantify over the same exogenous worlds. One rule added (R20: an unconditional income-access floor for the wife, not the glossary''s material floor; strand null, untagged; plans/priority-slice2.md R2.5); no R13, no R14, R1 kept: no property grant. PREREGISTERED (2026-11-06, before any run): financial_dependence and financial_dependence_unpropertied holds_to_k (both read only property and earnings, so they cannot see a floor: as written, material independence means title); financial_dependence_means violated; financial_dependence_margin violated BY CONSTRUCTION (R20''s condition is true); double_burden unreachable_open (needs owns_earnings, which only R14 grants); creditor_shield unreachable_open by construction (no creditor role; transferred and can_attach undeclared); exit, standing, contract, care and sanction as in the US base. Goods (slice 2): second encoder: agent, not someone living under the institution (ADR 0012). Rejected base: mwpa-creditor-exemption (would put the floor on a debtor-relief statute and make creditor_shield reachable); a later variant, not built.'
initial: []
initial_free: [female, acquired_property, earns]
goods_note: 'Slice 2 revisions 2 and 3 (plans/priority-slice2-results.md, "Revision 2", "Revision 3" and "Revision 3 fix pass"): goods as encoded, strict compliance, k=6 and 8, both encoders read the same; a statement about encodings (ADR 0011). Two measures, never combined: guaranteed (the rules as obeyed force the good) and possible (it can hold under the rules as obeyed, within k, at one step, for some bearer in some starting world). Guaranteed: R2 (the husband''s maintenance duty) is guarantee-carrying for 3 goods formulas that read one strand, provides_care(h, w) (cared_for, known_carer, mutual_household_care); R3 (the wife''s implicit, sanctioned household duty) is guarantee-carrying for mutual_household_care only: guaranteed only by R3, an implicit sanctioned duty; deleting it removes the guarantee of the husband''s receipt of household labour; not advice to keep it. Possible: no single deletion makes any good impossible (R2 and R3 unread); chosen_mutual_care (revision 3: it now excludes care that any rule obliges either spouse to give, read through the derived fluent care_obliged) is absent in the base by construction: R2 and R3 oblige care at every married step (the dataset''s care_obliged pins), so its not-obliged conjuncts fail there. Each of R2, R3 and R6 on its own bars it, so no single deletion makes it possible and it is absent in every single-deletion row (R6''s row: absent > absent; revision 2: absent > fragile); with R5 and R6 both deleted it stays absent (revision 2''s formula read that stable: obliged care read as chosen); it becomes possible (fragile: at one step, not throughout) only with all three of R2, R3 and R6 deleted, R5 present or not (scratch probes, not ablation rows). That holds even though R5, the husband''s power to chastise her, remains: the no-sanction clause reads only a power enabled at that step and R5''s condition (misbehaves) starts false, so the clause is idle under strict compliance; this reading must not be used, in slice 4 or elsewhere, to say that deleting R2, R3 and R6 yields chosen care free of domination. Any spousal duty of care or support would make the good unattainable in the same way, so the absence does not distinguish coverture from later marriage law. The guaranteed column is not meaningful for this good. Primary measure (the author''s value call per good, revision 3 R3.1; one measure per good, never two for one good): R2 is carrying (guaranteed) for cared_for (provided_for stays guaranteed through R20); under the author''s value call and the dataset''s mutual_household_care formula, R3 carries no good on the primary column (its only load is a guarantee of mutual_household_care, a good the author reads as possible). The possible measure cannot tell forced from free mutual care, so R3''s imposition is not visible there: carrying no good is not imposing no cost on any good. Under the blind-gloss experiment''s formulas R3 reads carrying (possible), a reading the revision-3 faithfulness review judged unfaithful (provides_care lumps maintenance with household labour). R4, R6, R7 read tying. provided_for stays guaranteed with R2 deleted because R20 gives her income access (a power to draw an income; no subsistence is delivered), through the freedom-shaped disjunct of provided_for (three of its four disjuncts are power fluents); R20 is an unconditional income-access floor for the wife, not the glossary''s material floor, untagged (strand null), and its rows are unread. Route comparison: G guaranteed 4 here vs 5 in mwpa-earnings, by construction: the same margin case as C; G possible 0 vs 0. Under strict compliance R2''s unsanctioned duty reads as delivered maintenance; the historical enforcement (tradesmen''s claims for necessaries) is not represented. Second encoder: agent, not someone living under the institution (ADR 0012).'
