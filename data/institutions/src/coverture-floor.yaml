  no_standing: reachable
  care_assigned_by_sex: violated
  financial_dependence: holds_to_k
  financial_dependence_unpropertied: holds_to_k
  financial_dependence_means: violated
  financial_dependence_margin: violated
  cannot_contract: holds_to_k
  double_burden: unreachable_open
  creditor_shield: unreachable_open
isomorphic_to: []
not_isomorphic_to: []
not_isomorphic_to_control: []
minimal_pair_of: null
notes: 'COUNTERFACTUAL ENCODING (plans/priority-slice2.md section 5; provenance unverified). Base coverture-household-us, so the title route (mwpa-creditor-exemption -> mwpa-property -> mwpa-earnings) and the floor route start from one rule set; initial_free and the fluent arg_roles are mwpa-creditor-exemption''s, so both end states quantify over the same exogenous worlds. One rule added (R20: an unconditional income-access floor for the wife, not the glossary''s material floor; strand null, untagged; plans/priority-slice2.md R2.5); no R13, no R14, R1 kept: no property grant. PREREGISTERED (2026-11-06, before any run): financial_dependence and financial_dependence_unpropertied holds_to_k (both read only property and earnings, so they cannot see a floor: as written, material independence means title); financial_dependence_means violated; financial_dependence_margin violated BY CONSTRUCTION (R20''s condition is true); double_burden unreachable_open (needs owns_earnings, which only R14 grants); creditor_shield unreachable_open by construction (no creditor role; transferred and can_attach undeclared); exit, standing, contract, care and sanction as in the US base. Goods (slice 2): second encoder: agent, not someone living under the institution (ADR 0012). Rejected base: mwpa-creditor-exemption (would put the floor on a debtor-relief statute and make creditor_shield reachable); a later variant, not built.'
initial: []
initial_free: [female, acquired_property, earns]
goods_note: 'Slice 2 revision 2 (plans/priority-slice2-results.md, "Revision 2"): goods as encoded, strict compliance, k=6 and 8, both encoders read the same; a statement about encodings (ADR 0011). Two measures, never combined: guaranteed (the rules as obeyed force the good) and possible (it can hold under the rules as obeyed, within k, at one step, for some bearer in some starting world). Guaranteed: R2 (the husband''s maintenance duty) is guarantee-carrying for 3 goods formulas that read one strand, provides_care(h, w) (cared_for, known_carer, mutual_household_care); R3 (the wife''s implicit, sanctioned household duty) is guarantee-carrying for mutual_household_care only: guaranteed only by R3, an implicit sanctioned duty; deleting it removes the guarantee of the husband''s receipt of household labour; not advice to keep it. Possible: no single deletion makes any good impossible (R2 and R3 unread); deleting R6 (the exit bar) moves chosen_mutual_care absent > fragile, the only rule that does; her care duty R3 still binds in that row and the formula cannot see it, so this is not chosen care becoming possible (as encoded, no compliant trace has mutual care while she has a permitted way out); the guaranteed column is not meaningful for this good. R4, R6, R7 read tying. provided_for stays guaranteed with R2 deleted because R20 gives her income access (a power to draw an income; no subsistence is delivered), through the freedom-shaped disjunct of provided_for (three of its four disjuncts are power fluents); R20 is an unconditional income-access floor for the wife, not the glossary''s material floor, untagged (strand null), and its rows are unread. Route comparison: G guaranteed 4 here vs 5 in mwpa-earnings, by construction: the same margin case as C; G possible 0 vs 0. Under strict compliance R2''s unsanctioned duty reads as delivered maintenance; the historical enforcement (tradesmen''s claims for necessaries) is not represented. Second encoder: agent, not someone living under the institution (ADR 0012).'
