id: coverture-floor
name: 'Coverture with an income-access floor (counterfactual: US coverture plus an income in her own right)'
extends: coverture-household-us
fluents_set:
  is_subject:
    arg_roles: [wife]
  female:
    arg_roles: [wife]
  can_sanction:
    arg_roles: [husband, wife]
  can_exit:
    arg_roles: [wife]
  has_standing:
    arg_roles: [wife]
  married:
    arg_roles: [husband, wife]
  controls_property:
    arg_roles: [husband, wife]
  controls_own_property:
    arg_roles: [wife]
  owns_earnings:
    arg_roles: [wife]
  can_contract:
    arg_roles: [wife]
  acquired_property:
    arg_roles: [wife]
  earns:
    arg_roles: [wife]
rules_add:
- id: R20
  plain: '(counterfactual, not historical) The wife may draw subsistence, an income in her own right from outside the marriage, at any time: an unconditional income-access floor for the wife, not the glossary''s material floor (plans/priority-slice2.md section 5 and R2.5).'
  attribute: wife
  deontic: may
  aim: (draw_subsistence w)
  conditions: 'true'
  or_else: null
  strand: null
  implicit: false
  source: 'counterfactual encoding: no work cited and none claimed; the rule is the floor route of plans/priority-slice2.md section 5 (preregistered 2026-11-06), read from the material floor of docs/glossary.md (subsistence regardless of any relationship). UNVERIFIED as history: no jurisdiction ever enacted it on the coverture frame.'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: counterfactual encoding: no work cited and none claimed; the rule is the floor route of plans/priority-slice2.md section 5 (preregistered 2026-11-06), read from the material floor of docs/glossary.md (subsistence regardless of any relationship)'
  var_roles:
    w: wife
  choices: 'Candidate wording (plans/priority.md, floor route vs title route): state must provide_subsistence w when (is_subject w). Deviation stated before any run (plans/priority-slice2.md section 5): (a) the dataset encodes a resource as a derived power over the holder''s action (R13, R14); a state duty with no matching power would leave every financial property blind, and an action must either fills the one action slot each step (ADR 0009) or, once deleted, leaves an unregulated action that fires freely; so the floor is the wife''s entitlement, the correlative of the state''s duty (ASSUMED: the engine has no duty/claim pairing). (b) condition true, not (is_subject w): is_subject is set only by marry, so the candidate''s floor was an allowance for wives, while the glossary''s floor is ''regardless of any relationship''. Strand: null (untagged, outside the bundle; plans/priority-slice2.md R2.5, 2026-11-06). A floor is not a strand of the bundle and the tag vocabulary has no slot for it; the revision-1 placeholder `superadditive` is removed (faithfulness review 2026-11-06 finding 10; recorded for the strand-tag redesign in docs/plan.md). Scope: R20 is an unconditional income-access floor for the wife, not the glossary''s material floor: income only (no care, health or housing), no adequacy (draw_subsistence has no effects), no state duty that can fail, and only wives exist in the entry.'
source_text: 'Counterfactual, not a historical institution (ADR 0004: no forward claim; ADR 0011: every result is a statement about encodings). The US coverture base (coverture-household-us) plus one rule, R20, giving the wife an income in her own right regardless of marriage: an unconditional income-access floor for the wife, read from but narrower than the material floor of docs/glossary.md (care, health, housing and income). Preregistered in plans/priority-slice2.md section 5 (2026-11-06) as the floor route, compared against the title route (the MWPA chain ending in mwpa-earnings).'
