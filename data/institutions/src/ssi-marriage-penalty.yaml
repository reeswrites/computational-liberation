id: ssi-marriage-penalty
name: 'SSI marriage penalty (couple rate and resource limit gated on marriage and living together, extended to unmarried couples who hold out); power reading only'
roles:
- name: claimant
  gloss: the person who applies for or receives SSI (the benefit's subject)
- name: spouse
  gloss: the other person of the pair, a legal spouse or a cohabitant who holds out as one
- name: agency
  gloss: the Social Security Administration, which decides marital status and applies the rate and the limit
fluents:
- name: married
  arity: 2
  gloss: c and s are married (legal marriage)
  arg_roles: [claimant, spouse]
- name: cohabits
  arity: 2
  gloss: c and s live together in the same household
  arg_roles: [claimant, spouse]
- name: holds_out
  arity: 2
  gloss: c and s lead people in their community to believe they are married (the holding-out test)
  arg_roles: [claimant, spouse]
- name: resources_under_limit
  arity: 1
  gloss: the countable resources c is assessed on are within the limit that applies (read as a boolean; dollar amounts are not represented)
  arg_roles: [claimant]
- name: couple_rate
  arity: 2
  gloss: the agency holds the power to rate c and s as a couple (couple federal rate, combined income); derived from the rules
  params: [c, s]
  derived: (exists ((g agent)) (enabled apply_couple_rate g c s))
  arg_roles: [claimant, spouse]
- name: couple_limit
  arity: 2
  gloss: the agency holds the power to apply the couple resource limit to c and s; derived from the rules
  params: [c, s]
  derived: (exists ((g agent)) (enabled apply_couple_limit g c s))
  arg_roles: [claimant, spouse]
- name: individual_rate
  arity: 2
  gloss: the agency holds the power to rate c as an individual although s is the other person of the pair; derived from the rules
  params: [c, s]
  derived: (exists ((g agent)) (enabled apply_individual_rate g c s))
  arg_roles: [claimant, spouse]
- name: individual_limit
  arity: 2
  gloss: the agency holds the power to apply the individual resource limit to c; derived from the rules
  params: [c, s]
  derived: (exists ((g agent)) (enabled apply_individual_limit g c s))
  arg_roles: [claimant, spouse]
- name: eligible
  arity: 1
  gloss: the agency holds the power to pay c a benefit; derived from the rules
  params: [c]
  derived: (exists ((g agent)) (enabled pay_benefit g c))
  arg_roles: [claimant]
actions:
- name: wed
  args: [c, s]
  effects:
  - fluent: married
    args: [c, s]
    value: true
- name: divorce
  args: [c, s]
  effects:
  - fluent: married
    args: [c, s]
    value: false
- name: cohabit
  args: [c, s]
  effects:
  - fluent: cohabits
    args: [c, s]
    value: true
- name: separate
  args: [c, s]
  effects:
  - fluent: cohabits
    args: [c, s]
    value: false
  - fluent: holds_out
    args: [c, s]
    value: false
- name: present_as_married
  args: [c, s]
  effects:
  - fluent: holds_out
    args: [c, s]
    value: true
- name: cease_holding_out
  args: [c, s]
  effects:
  - fluent: holds_out
    args: [c, s]
    value: false
- name: accumulate
  args: [c]
  effects:
  - fluent: resources_under_limit
    args: [c]
    value: false
- name: spend_down
  args: [c]
  effects:
  - fluent: resources_under_limit
    args: [c]
    value: true
- name: apply_couple_rate
  args: [g, c, s]
  effects: []
- name: apply_couple_limit
  args: [g, c, s]
  effects: []
- name: apply_individual_rate
  args: [g, c, s]
  effects: []
- name: apply_individual_limit
  args: [g, c, s]
  effects: []
- name: pay_benefit
  args: [g, c]
  arg_roles: [agency, claimant]
  effects: []
  default_capacity: true
rules:
- id: R2
  plain: 'The agency may rate the claimant and the other person as a couple, counting combined income at the couple rate, when they are married and living together (20 CFR 416.1802(b)(1); 42 U.S.C. 1382(b)(2)). The source states this for a spouse "with whom he or she is living" (20 CFR 416.1801(c); 42 U.S.C. 1382(a)(1)(B)(i)); the condition is married and cohabits since revision 2 (2026-11-09), so a married pair living apart is not rated as a couple. A power the agency holds, not an applied rate (power reading only).'
  attribute: agency
  deontic: may
  aim: (apply_couple_rate g c s)
  conditions: (and (married c s) (cohabits c s))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: reviewed
  function: penalises_marriage_rate
  source: '20 CFR 416.1802 ''Effects of marriage on eligibility and amount of benefits'' (https://www.law.cornell.edu/cfr/text/20/416.1802), as carried from plans/sourcing-worklist-marriage.md section 5 (a summarising fetch, not raw text; not re-opened for this row; level snippet): ''we will count your combined income and calculated the benefit amount for you as a couple.'' (the worklist''s quotation, typo included) and ''(d)(1) Benefits depend on whether you are married or not married at the beginning of each month.'' The couple federal rate is lower than two individual rates (42 U.S.C. 1382(b)(2), not (a)(1)(B), per the faithfulness review''s raw read; 1974 base rates $1,752 individual, $2,628 couple per the worklist; 2026 rates $994 / $1,491 are an unverified lead). Sanctioner none: no enforcement of the agency''s duty is in the text read. Read as a power (`may`), not an applied rate; the statute is mandatory, which the encoding does not carry. Revision 2 (2026-11-09, item 1): the condition gained `cohabits` (20 CFR 416.1801(c); 42 U.S.C. 1382(a)(1)(B)(i), both read raw by the faithfulness seat, not re-opened by the builder; no excerpt added).'
  provenance:
  - source_id: ssi-cfr-416-1802
    pin: s. 416.1802(b)(1); (d)(1)
    jurisdiction: US
    effective_date: null
    verification: snippet
    excerpt: we will count your combined income and calculated the benefit amount for you as a couple. ... (d)(1) Benefits depend on whether you are married or not married at the beginning of each month.
    accessed: '2026-11-08'
    url: https://www.law.cornell.edu/cfr/text/20/416.1802
    note: 'level and excerpt carried from the sourcing worklist (summarising fetch, not raw text); not re-opened by the builder (the faithfulness seat confirmed the excerpt verbatim from raw text, 2026-11-08); effective date unread; (b) applies to an eligible spouse as defined in 416.1801(c), who lives in the same household: cohabitation condition encoded 2026-11-09 (revision 2 item 1; `cohabits` in the rule condition); 416.1804, 416.1805 and the deeming sections 416.1160-1163 not opened'
  - source_id: ssi-usc-1382a
    pin: s. 1382(b)(2)
    jurisdiction: US
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: https://www.law.cornell.edu/uscode/text/42/1382
    note: 'the couple rate ($2,628 on the 1974 base); pin supplied by the faithfulness seat from its raw read of 1382(a)-(b), 2026-11-08; not re-opened by the builder, so no excerpt and no level above unverified'
  var_roles:
    g: agency
    c: claimant
    s: spouse
- id: R3
  plain: 'The agency may apply the couple resource limit ($3,000) when they are married and living together (42 U.S.C. 1382(a)(3)(A)). The source states the couple limit for an individual with a spouse "with whom he is living" (42 U.S.C. 1382(a)(1)(B)(i)); the condition is married and cohabits since revision 2 (2026-11-09). Note, the CRS reading, not the text: two individuals may hold $4,000 together, so the couple limit is the lower.'
  attribute: agency
  deontic: may
  aim: (apply_couple_limit g c s)
  conditions: (and (married c s) (cohabits c s))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: reviewed
  function: penalises_marriage_limit
  source: '42 U.S.C. 1382(a)(3)(A)-(B) (https://www.law.cornell.edu/uscode/text/42/1382), as carried from the worklist (first 100,000 of 170,641 characters, through a summarising fetch; not re-opened; level snippet): ''$3,000 on January 1, 1989'' for a couple and ''$2,000 on January 1, 1989'' for an individual (Pub. L. 98-369 s. 2611, not indexed to inflation; the 1.5 ratio is arithmetic). A pair of individuals may hold $4,000 together, so the couple limit is the lower of the two. Sanctioner none: no enforcement in the text read. The 2026 limits equal the 1989 figures per an unverified search-summary lead. Revision 2 (2026-11-09, item 1): the condition gained `cohabits` (42 U.S.C. 1382(a)(1)(B)(i), a spouse with whom he is living, read raw by the faithfulness seat, not re-opened by the builder; no excerpt added).'
  provenance:
  - source_id: ssi-usc-1382a
    pin: s. 1382(a)(3)(A)-(B)
    jurisdiction: US
    effective_date: '1989-01-01'
    verification: snippet
    excerpt: $3,000 on January 1, 1989 ... $2,000 on January 1, 1989
    accessed: '2026-11-08'
    url: https://www.law.cornell.edu/uscode/text/42/1382
    note: 'level and excerpt carried from the worklist (summarising fetch, partial text; the faithfulness seat confirmed both figures verbatim from raw text); the limit applies to an individual with a spouse living with them, not to marriage alone: cohabitation condition encoded 2026-11-09 (revision 2 item 1; `cohabits` in the rule condition); the dollar figures are not represented in the encoding; the date is the statutory step date, not an effective date of the rule'
  var_roles:
    g: agency
    c: claimant
    s: spouse
- id: R4
  plain: 'The agency may rate cohabitants as a couple, as if married, when they live together and lead people to believe they are husband and wife. Text as written (20 CFR 416.1806(a)(3)): "an unrelated person of the opposite sex ... at or after the time you apply". The encoding follows POMS SI 00501.152, which applies the test to same-sex couples, so the formal rule carries no sex condition.'
  attribute: agency
  deontic: may
  aim: (apply_couple_rate g c s)
  conditions: (and (cohabits c s) (holds_out c s))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: reviewed
  function: extends_penalty_to_holding_out
  source: '20 CFR 416.1806 (https://www.law.cornell.edu/cfr/text/20/416.1806), as carried from the worklist (a summarising fetch; not re-opened; level snippet): someone is a spouse for SSI purposes where (a)(3) ''You and an unrelated person of the opposite sex are living together in the same household'' and ''you both lead people to believe that you are husband and wife.'' POMS SI 00501.150 (TN 80, 02-25): ''Living together in the same household and holding themselves out as a married couple to the community in which they live.'' POMS SI 00501.152 (TN 85, 12-25): ''both individuals lead people in the community in which they reside to believe they are a married couple''. POMS covers same-sex couples per a search summary; the Cornell regulation text still says opposite sex. This is the displaced gate: a conduct test that carries the couple rate to unmarried pairs. Sanctioner none (see notes): R4 is an agency `may` power with no duty to sanction, and the engine rejects a sanctioner without an or_else. Unencoded qualifiers: the regulation''s `unrelated` and `at or after the time you apply`; the opposite-sex limit is deliberately not encoded (POMS). Overpayment recovery (20 CFR 416.537, not opened) sanctions the claimant under a different, unencoded rule.'
  provenance:
  - source_id: ssi-cfr-416-1806
    pin: s. 416.1806(a)(3)
    jurisdiction: US
    effective_date: null
    verification: snippet
    excerpt: You and an unrelated person of the opposite sex are living together in the same household ... you both lead people to believe that you are husband and wife.
    accessed: '2026-11-08'
    url: https://www.law.cornell.edu/cfr/text/20/416.1806
    note: 'carried from the worklist (summarising fetch; the faithfulness seat confirmed the excerpt verbatim from raw text, 2026-11-08); effective date unread; the text says opposite sex and the encoding follows POMS SI 00501.152 (same-sex couples included), so the formal rule differs from this text; unencoded qualifiers: `unrelated`, and timing (`at or after the time you apply`)'
  - source_id: ssi-poms-si-00501-150
    pin: SI 00501.150
    jurisdiction: US
    effective_date: null
    verification: snippet
    excerpt: Living together in the same household and holding themselves out as a married couple to the community in which they live.
    accessed: '2026-11-08'
    url: https://secure.ssa.gov/poms.nsf/lnx/0500501150
    note: 'carried from the worklist (summarising fetch); TN 80 (02-25); agency guidance, not law; G.2 presumption on resumed cohabitation of former spouses is not encoded'
  - source_id: ssi-poms-si-00501-152
    pin: SI 00501.152
    jurisdiction: US
    effective_date: null
    verification: snippet
    excerpt: both individuals lead people in the community in which they reside to believe they are a married couple
    accessed: '2026-11-08'
    url: https://secure.ssa.gov/poms.nsf/lnx/0500501152
    note: 'carried from the worklist (summarising fetch); TN 85 (12-25); examples (calling each other spouse, shared name, joint records) are not encoded'
  var_roles:
    g: agency
    c: claimant
    s: spouse
- id: R5
  plain: 'The agency may rate the claimant as an individual when the pair are not living together as a married or holding-out couple (a married pair living apart is rated individually; revision 2, 2026-11-09). The individual-rate consequence for the unmarried is from CRS RL33675 (snippet); 20 CFR 416.1802(d)(1) says only that benefits depend on whether you are married.'
  attribute: agency
  deontic: may
  aim: (apply_individual_rate g c s)
  conditions: (not (and (cohabits c s) (or (married c s) (holds_out c s))))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: reviewed
  source: 'CRS RL33675 (https://www.everycrsreport.com/reports/RL33675.html), as carried from the worklist (summarising fetch; not re-opened): ''a married couple has a lower resource limit, a lower maximum federal benefit, and a lower amount of excluded income.'' (so the unmarried are rated as individuals). 20 CFR 416.1802(d)(1) as in R2 (it does not itself state an individual rate for the unmarried). The complement condition is the encoder''s reading of the three tests in the worklist; since revision 2 (2026-11-09) it is the exact complement of the two couple routes: not (living together and (married or holding out)).'
  provenance:
  - source_id: ssi-crs-rl33675
    pin: null
    jurisdiction: US
    effective_date: '2008-01-30'
    verification: snippet
    excerpt: a married couple has a lower resource limit, a lower maximum federal benefit, and a lower amount of excluded income.
    accessed: '2026-11-08'
    url: https://www.everycrsreport.com/reports/RL33675.html
    note: 'carried from the worklist (summarising fetch); 2008 report, figures then: two singles up to $1,348 a month combined against $1,011 for a couple; the complement condition is the encoder''s'
  - source_id: ssi-cfr-416-1802
    pin: s. 416.1802(d)(1)
    jurisdiction: US
