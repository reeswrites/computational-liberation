source_text: 'Per the sourcing worklist (summarising fetches, not raw text): 20 CFR 416.1802 (''we will count your combined income and calculated the benefit amount for you as a couple.''; ''(d)(1) Benefits depend on whether you are married or not married at the beginning of each month.''); 20 CFR 416.1806 (a)(3) (cohabitants who ''lead people to believe that you are husband and wife'' are spouses for SSI); SSA POMS SI 00501.150 and .152 (holding out); 42 U.S.C. 1382(a)(3) (resource limits $2,000 individual and $3,000 couple as of 1 January 1989); CRS RL33675 (a married couple has a lower resource limit, a lower maximum federal benefit and a lower amount of excluded income).'
