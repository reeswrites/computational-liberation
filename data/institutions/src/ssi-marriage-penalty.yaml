notes: 'POWER READING ONLY (revision 2 item 2, ruled 2026-11-09): every rule here is a power the agency holds (`may`, or a default capacity a disability removes), not the statute''s mandatory duty and not an applied rate or limit; the ADR 0009 must-be encoding is not attempted in this entry and is a later preregistration of its own. Revision 2 (plans/ssi-entry.md, "Revision 2 run", preregistered 2026-11-09): (item 1) R2 and R3 are conditioned on married and cohabits, R5 and R6 on the complement not (cohabits and (married or holds_out)), so a married pair living apart gets the individual rate and limit; `cohabits` was already declared (set by `cohabit` / `separate`, false at the start, not a free fluent). (item 3) `pay_benefit` is a `default_capacity` action typed `arg_roles [agency, claimant]` and the grant rule R1 (`may pay_benefit when true`) is deleted, ids not renumbered; R5 and R6 stay rules because they carry a condition, which a default capacity cannot. (item 4) the pair ssi-marriage-penalty-individual is now a one-rule pair that drops R3. The properties married_couple_rated and married_couple_limited read married and cohabits since the same revision. SSI marriage penalty, encoded as powers the rules grant the agency (the project''s convention: a derived fluent reads `enabled`). Roles claimant, spouse, agency; `married` arity 2 typed [claimant, spouse] so it can be aliased to partner_a / partner_b for composition with coverture-household-us (plans/composition.md; ADR 0018). Preregistered in plans/ssi-entry.md before any run. Encoded as `may` powers, not the statute''s mandatory ''must'': a must on an action fires every step and blocks the other actions (ADR 0009), and a must-be would need the establishing action to carry the rate. Dollar amounts are not represented: the couple penalty appears only as which limit and which rate the agency is empowered to apply. Deviations from the brief, recorded: (1) R4, the displaced gate, is `kind: formal, sanctioner: none`, not `state`: R4 is an agency `may` power with no duty to sanction, and the engine rejects a sanctioner without an or_else; overpayment recovery (20 CFR 416.537, not opened) sanctions the claimant under a different, unencoded rule; the displaced reading therefore cannot lean on a sanctioner difference and reads attribute sets only. (2) Holding out is encoded as a power on the same aim as R2 (a second route to the couple rate), not as a rewrite of `married`, because a derived fluent cannot read `married or holds_out`. Unverified or unread: 20 CFR 416.1804, 416.1805 and the deeming sections 416.1160-1163; effective dates of 416.1806; 2026 federal benefit rates and limits (a search-summary lead); 20 CFR 416.537 (overpayment recovery); no secondary source frames holding out as a displaced gate (CRS gives rule and size only); every provenance level is `snippet` or `unverified` (ADR 0017 s.3): the excerpts were carried from the worklist, whose fetches returned a summary, not raw text, and were not re-opened by the builder (the faithfulness seat confirmed 416.1802(b)(1) and (d)(1), 416.1806(a)(3) and 1382(a)(3)(A)-(B) verbatim from raw text). `divorce` is an unsourced encoder action (a bare setter of married false; no source mentions divorce, and no rule uses it). `marry` was renamed `wed` for composition (P2b, plans/p2-ssi-composite.md) because coverture-household-us also has a `marry`; no rule, plain line or source changed. Vocabulary is the worklist''s ASSUMED vocabulary. No `is_subject`, `can_exit` or care fluents are declared, so none of the 34 older properties is applicable to this entry alone; they become applicable only in a composite (what P2 needs is in plans/ssi-entry.md). Unencoded: R4 qualifiers `unrelated` and timing, R5/R6 complement omits 416.1806(a)(2) and the 416.1802(a) deeming case. R4 follows POMS SI 00501.152 (same-sex included), not the opposite-sex text of 416.1806(a)(3). Consent guard ruling, quoted exactly: "Consent guard note (plans/consent-guard-note-DRAFT.md) ruled not applicable to benefits rules by the author, 2026-11-08."'
