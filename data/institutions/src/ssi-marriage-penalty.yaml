    s: spouse
- id: R7
  plain: 'The agency cannot pay the claimant a benefit while the claimant''s countable resources exceed the applicable limit: no such power exists then (the power to pay is a default capacity of the agency since revision 2, 2026-11-09, formerly the encoder''s grant R1; the bar is an eligibility condition, 42 U.S.C. 1382(a)(1)(B), (a)(2)(B); the limits are in (a)(3)(A)-(B)).'
  attribute: agency
  deontic: must_not
  aim: (pay_benefit g c)
  conditions: (not (resources_under_limit c))
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: reviewed
  source: '42 U.S.C. 1382(a)(1)(B) and (a)(2)(B) (the bar: eligible only if resources are not more than the limit; pin from the faithfulness seat''s raw read, not re-opened by the builder) and (a)(3)(A)-(B) (the limits) (https://www.law.cornell.edu/uscode/text/42/1382), as carried from the worklist (summarising fetch; not re-opened; level snippet): the resource limits ''$2,000 on January 1, 1989'' (individual) and ''$3,000 on January 1, 1989'' (couple). A disability, not a sanctioned prohibition, hence or_else null. That exceeding the limit bars payment is read from the eligibility condition in (a)(1)(B); the `must_not` form is a reading of ''eligible only if''.'
  provenance:
