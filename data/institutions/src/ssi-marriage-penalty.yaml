    note: 'cited only for what it says (benefits depend on marital status); it states no individual rate; carried from the worklist, confirmed verbatim by the faithfulness seat; the complement condition omits 416.1806(a)(2) and the 416.1802(a) deeming case'
  var_roles:
    g: agency
    c: claimant
    s: spouse
- id: R6
  plain: 'The agency may apply the individual resource limit ($2,000) when the pair are not living together as a married or holding-out couple (a married pair living apart gets the individual limit; revision 2, 2026-11-09) (42 U.S.C. 1382(a)(3)).'
  attribute: agency
  deontic: may
  aim: (apply_individual_limit g c s)
  conditions: (not (and (cohabits c s) (or (married c s) (holds_out c s))))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: reviewed
  source: '42 U.S.C. 1382(a)(3)(B) as carried from the worklist (summarising fetch; not re-opened; level snippet): ''$2,000 on January 1, 1989'' for an individual, ''$3,000 on January 1, 1989'' for a couple. The complement condition is the encoder''s reading; since revision 2 (2026-11-09) it is not (living together and (married or holding out)), so a spouse not living with the claimant leaves the individual limit in place (1382(a)(1)(B)(i), read raw by the faithfulness seat only).'
  provenance:
  - source_id: ssi-usc-1382a
