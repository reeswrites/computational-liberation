id: ectogenesis
name: 'Ectogenesis (artificial womb; Firestone 1970): gestation in a device, no birthing parent'
roles:
- name: intended_parent
  gloss: the person or couple who will raise the child; the carer; the institutional sort, not a demographic (ADR 0011)
- name: child
  gloss: 'the subject: the child, a subject only once born (is_subject is set only by a birth action)'
- name: provider
  gloss: the clinic or lab that starts, transfers, implants or decants gestation
- name: registry
  gloss: 'vital records / court: registers parentage and reprimands'
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [child]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [intended_parent, child]
- name: care_obliged
  arity: 2
  gloss: 'some rule in force at this step obliges x to give care to y (a must on the care act or the care state, sanctioned or not); derived from the rules, not asserted'
  arg_roles: [intended_parent, child]
  params: [x, y]
  derived: (or (obliged provides_care x y) (obliged provide_care x y))
- name: female
  arity: 1
  gloss: x is female (sex as assigned by the institution's own records)
  arg_roles: [intended_parent]
- name: parent
  arity: 2
  gloss: p is a parent of c
  arg_roles: [intended_parent, child]
- name: birthing_parent
  arity: 2
  gloss: p gave birth to c
  arg_roles: [intended_parent, child]
- name: in_gestation
  arity: 1
  gloss: c is being carried or incubated, anywhere
  arg_roles: [child]
- name: gestated_ex_utero
  arity: 1
  gloss: c is in a device (ectogenesis only; exists to mark an absence of a body)
  arg_roles: [child]
actions:
- name: start_gestation
  args: [provider, child]
  effects:
  - fluent: in_gestation
    args: [child]
    value: true
- name: register_parentage
  args: [registry, intended_parent, child]
  effects:
  - fluent: parent
    args: [intended_parent, child]
    value: true
- name: provide_care
  args: [intended_parent, child]
  effects:
  - fluent: provides_care
    args: [intended_parent, child]
    value: true
- name: reprimand
  args: [registry, x]
  effects: []
- name: transfer_to_device
  args: [provider, child]
  effects:
  - fluent: gestated_ex_utero
    args: [child]
    value: true
- name: decant
  args: [provider, child]
  effects:
  - fluent: is_subject
    args: [child]
    value: true
  - fluent: in_gestation
    args: [child]
    value: false
  - fluent: gestated_ex_utero
    args: [child]
    value: false
rules:
- id: R1
  plain: 'A provider may start gestation of a child at any time (Firestone 1970).'
  attribute: provider
  deontic: may
  aim: (start_gestation provider child)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Firestone, The Dialectic of Sex (1970), ch.1 (the demand to free women from ''the tyranny of their reproductive biology'' and to spread child-bearing and child-rearing across society; wording from memory, check before quoting) and ch.10 ''The Ultimate Revolution'' (artificial reproduction and the end of the biological family; from memory). UNVERIFIED: no text opened for this rule (plans/ectogenesis.md section 2: Firestone 1970 ch.1 and ch.10 are cited from memory; the one network probe, an archive.org search, returned HTTP 200 and no text was read or downloaded) (the technology that makes gestation a service; for surrogacy, the clinic''s role in assisted conception)'
  provenance:
  - source_id: firestone-1970
    pin: ch. 1; ch. 10
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'UNVERIFIED: no text opened; wording from memory (plans/ectogenesis.md section 2)'
- id: R2
  plain: 'The provider may transfer the child to the device when the child is in gestation (Firestone 1970).'
  attribute: provider
  deontic: may
  aim: (transfer_to_device provider child)
  conditions: (in_gestation child)
  or_else: null
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Firestone, The Dialectic of Sex (1970), ch.1 (the demand to free women from ''the tyranny of their reproductive biology'' and to spread child-bearing and child-rearing across society; wording from memory, check before quoting) and ch.10 ''The Ultimate Revolution'' (artificial reproduction and the end of the biological family; from memory). UNVERIFIED: no text opened for this rule (plans/ectogenesis.md section 2: Firestone 1970 ch.1 and ch.10 are cited from memory; the one network probe, an archive.org search, returned HTTP 200 and no text was read or downloaded). Strand tag is a HAND TAG (ASSUMED author decision 2026-11-04; plan section 5c): the rival input is deleted, not redistributed, and no strand value says ''no strand''.'
  provenance:
  - source_id: firestone-1970
    pin: ch. 1; ch. 10
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'UNVERIFIED: no text opened; wording from memory (plans/ectogenesis.md section 2)'
- id: R3
  plain: 'The provider must decant the child when the child has been gestated ex utero, or else the registry may reprimand (R6) (Firestone 1970).'
  attribute: provider
  deontic: must
  aim: (decant provider child)
  conditions: (gestated_ex_utero child)
  or_else: R6
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: institution
  sanctioner_review: derived
  source: 'Firestone, The Dialectic of Sex (1970), ch.1 (the demand to free women from ''the tyranny of their reproductive biology'' and to spread child-bearing and child-rearing across society; wording from memory, check before quoting) and ch.10 ''The Ultimate Revolution'' (artificial reproduction and the end of the biological family; from memory). UNVERIFIED: no text opened for this rule (plans/ectogenesis.md section 2: Firestone 1970 ch.1 and ch.10 are cited from memory; the one network probe, an archive.org search, returned HTTP 200 and no text was read or downloaded). The birth duty moves from a body to a device operator; decant never sets birthing_parent. Strand tag is a HAND TAG (ASSUMED author decision 2026-11-04).'
  provenance:
  - source_id: firestone-1970
    pin: ch. 1; ch. 10
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'UNVERIFIED: no text opened; wording from memory (plans/ectogenesis.md section 2)'
- id: R4
  plain: 'An intended parent may provide care for the child when a registered parent of the child and the child is a born subject.'
  attribute: intended_parent
  deontic: may
  aim: (provide_care intended_parent child)
  conditions: (and (parent intended_parent child) (is_subject child))
  or_else: null
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'care by any registered parent of a born child is permitted, men included; nothing here bars it. UNVERIFIED: no text opened for this rule (plans/ectogenesis.md section 2: Firestone 1970 ch.1 and ch.10 are cited from memory; the one network probe, an archive.org search, returned HTTP 200 and no text was read or downloaded)'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named for this rule; rationale: care by any registered parent of a born child is permitted, men included; nothing here bars it'
- id: R5
  plain: '(practice, not written) A female intended parent must provide care for the child when a registered parent of the child and the child is a born subject; no sanction is attached.'
  attribute: intended_parent
  deontic: must
  aim: (provide_care intended_parent child)
  conditions: (and (parent intended_parent child) (is_subject child) (female intended_parent))
  or_else: null
  strand: tying
  implicit: true
  kind: norm
  sanctioner: none
  sanctioner_review: derived
  source: 'implicit norm (a care-norm, not a written rule; no sanction): the female registered parent of a born child must care for it. The condition names female and parent, NOT birthing_parent: the Kleven finding in docs/theory.md (adoptive mothers take the same hit, so role not body carries it). ASSUMED decision (author, 2026-11-04): trigger on female(p), so the norm survives the loss of the body. Not load-bearing at layer 1: it fires either way, so ''the tying strand outlives the rival input'' is carried by the encoding, not discovered. UNVERIFIED: no text opened for this rule (plans/ectogenesis.md section 2: Firestone 1970 ch.1 and ch.10 are cited from memory; the one network probe, an archive.org search, returned HTTP 200 and no text was read or downloaded)'
  provenance:
