id: police-crisis
name: Armed police response to mental-health crisis (Cal. WIC 5150)
roles:
- name: officer
  gloss: peace officer dispatched to the call; armed
- name: subject
  gloss: the person in crisis
- name: dispatcher
  gloss: 911 dispatch; chooses who responds
- name: facility
  gloss: the designated facility that evaluates and releases under WIC 5150/5152
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [subject]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [facility, subject]
- name: care_obliged
  arity: 2
  gloss: 'some rule in force at this step obliges x to give care to y (a must on the care act or the care state, sanctioned or not); derived from the rules, not asserted'
  arg_roles: [facility, subject]
  params: [x, y]
  derived: (obliged provides_care x y)
- name: in_custody
  arity: 1
  gloss: x is held by the institution and may not leave
  arg_roles: [subject]
- name: in_crisis
  arity: 1
  gloss: x is in a mental-health crisis
  arg_roles: [subject]
- name: danger
  arity: 1
  gloss: x is a danger to self or others, or gravely disabled (WIC 5150 trigger)
  arg_roles: [subject]
- name: requires_treatment
  arity: 1
  gloss: the treating psychiatrist believes, as a result of the evaluation, that s still requires evaluation or treatment (WIC 5152(a)); exogenous
  arg_roles: [subject]
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [o, s]
  derived: (or (exists ((f agent)) (enabled detain o f s)) (enabled use_force o s) (enabled hold o s))
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [s]
  derived: (enabled leave s)
  arg_roles: [subject]
- name: has_standing
  arity: 1
  gloss: x can start a legal claim in x's own name
  params: [s]
  derived: (or (enabled sue s) (enabled petition_review s))
  arg_roles: [subject]
- name: call_received
  arity: 1
  gloss: a crisis call about s has been received
  arg_roles: [subject]
- name: responding
  arity: 2
  gloss: o is on scene with s
- name: armed
  arity: 1
  gloss: o carries a firearm
- name: resists
  arity: 1
  gloss: s resists the hold
actions:
- name: dispatch_officer
  args: [d, o, s]
  effects:
  - fluent: responding
    args: [o, s]
    value: true
  - fluent: is_subject
    args: [s]
    value: true
  - fluent: call_received
    args: [s]
    value: false
- name: assess
  args: [f, s]
  effects:
  - fluent: provides_care
    args: [f, s]
    value: true
- name: withdraw
  args: [f, s]
  effects:
  - fluent: provides_care
    args: [f, s]
    value: false
- name: detain
  args: [o, f, s]
  effects:
  - fluent: in_custody
    args: [s]
    value: true
  - fluent: provides_care
    args: [f, s]
    value: true
- name: hold
  args: [f, s]
  effects:
  - fluent: in_custody
    args: [s]
    value: true
  - fluent: provides_care
    args: [f, s]
    value: true
- name: use_force
  args: [o, s]
  effects:
  - fluent: resists
    args: [s]
    value: false
- name: release
  args: [o, s]
  effects:
  - fluent: in_custody
    args: [s]
    value: false
- name: leave
  args: [s]
  effects:
  - fluent: responding
    args: [o, s]
    value: false
  default_capacity: true
- name: petition_review
  args: [s]
  effects: []
- name: sue
  args: [s]
  effects: []
  default_capacity: true
- name: carry_weapon
  args: [o]
  effects:
  - fluent: armed
    args: [o]
    value: true
rules:
- id: R1
  plain: '(practice, not written; nobody enforces it) The dispatcher must dispatch an officer to a subject when a call about that subject has been received.'
  attribute: dispatcher
  deontic: must
  aim: (dispatch_officer d o s)
  conditions: (call_received s)
  or_else: null
  strand: tying
  implicit: true
  kind: strategy
  sanctioner: none
  sanctioner_review: reviewed
  source: 'implicit: police are the default responder to a crisis call; nothing in WIC 5150 requires it, dispatch practice does. UNVERIFIED (general knowledge; no source opened). [ADR 0009: one-off action obligation; dispatch consumes call_received so it fires once per call] Retagged strategy 2026-11-08 (batch 3b, B2 ruling): a regularity nobody sanctions; the must is kept so the engine sees who carries the duty under strict compliance, though nobody enforces it.'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named for this rule (WIC 5150 is cited as not requiring it); rationale: implicit: police are the default responder to a crisis call; nothing in WIC 5150 requires it, dispatch practice does'
  var_roles:
    o: officer
    s: subject
    d: dispatcher
- id: R2
  plain: 'The facility must keep providing care to the subject while the subject is in custody (Cal. WIC 5150(a), (c); 5152(a)).'
  attribute: facility
  deontic: must
  aim: (provides_care f s)
  conditions: (in_custody s)
  or_else: null
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. Welf. & Inst. Code s. 5150(a); https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (assessment, evaluation and crisis intervention ''shall be conducted and provided on an ongoing basis''). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] dispatch establishes provides_care(o, s); assess restores it, withdraw (the officer stops attending) breaks it Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (text ''updated Jan. 1, 2023'' per the page; corrected 2026-11-06, the card seat): ''At a minimum, assessment, as defined in Section 5150.4, and evaluation, as defined in subdivision (a) of Section 5008, shall be conducted and provided on an ongoing basis'' (passive: the section does not name the officer as the one who provides it). Re-encoded 2026-11-06 (L1 landing, preregistered; faithfulness batch 2 P3): the duty is the facility''s while the subject is in custody (5150(a) passive voice on the 72-hour stay; 5150(c) the facility''s professional person assesses); detain and the facility''s hold (R11) establish provides_care(f, s), assess restores it, withdraw breaks it; the officer no longer carries it, and the dispatch sentence above is superseded. WIC 5152 read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5152: (a) a person admitted for 72-hour treatment and evaluation ''shall receive whatever treatment and care the person''s condition requires for the full period that they are held''.'
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: At a minimum, assessment, as defined in Section 5150.4, and evaluation, as defined in subdivision (a) of Section 5008, shall be conducted and provided on an ongoing basis
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: the page gives the text as 'updated Jan. 1, 2023' and its source as leginfo.legislature.ca.gov (2024 until the 2026-11-06 card seat caught it); the duty is in the passive voice, on the 72-hour stay; since the L1 landing (2026-11-06) the row puts it on the facility while the subject is in custody, as 5150(c) has the facility's professional person assess (until then the row had it on the responding officer, a faithfulness finding)
  - source_id: cal-wic-5152
    pin: s. 5152(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: shall receive whatever treatment and care the person's condition requires for the full period that they are held
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5152
    note: 'added on the card seat''s advice (2026-11-06): the stronger source for the facility''s care duty; apostrophe straightened; 5152 governs a person admitted to the facility, so the window before delivery (in custody, not yet admitted) is not covered by it'
  load_bearing: true
  var_roles:
    f: facility
    s: subject
- id: R3
  plain: 'The officer may detain the subject, delivering them to a facility, when responding to a subject who is in crisis and there is danger (Cal. WIC 5150).'
  attribute: officer
  deontic: may
  aim: (detain o f s)
  conditions: (and (responding o s) (in_crisis s) (danger s))
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. Welf. & Inst. Code s. 5150(a); https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (a peace officer may, upon probable cause, take the person into custody for up to 72 hours) Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150: ''When a person, as a result of a mental health disorder, is a danger to others, or to themselves, or gravely disabled, a peace officer'' ... ''may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours''. Re-encoded 2026-11-06 (L1 landing): detain takes the receiving facility, detain(o, f, s), and establishes the facility''s care duty (R2).'
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: When a person, as a result of a mental health disorder, is a danger to others, or to themselves, or gravely disabled, a peace officer ... may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: the page gives the text as 'updated Jan. 1, 2023' and its source as leginfo.legislature.ca.gov (2024 until the 2026-11-06 card seat caught it); the statute's trigger also includes 'gravely disabled' and requires probable cause; the row reads only danger
  var_roles:
    f: facility
    s: subject
    o: officer
- id: R4
  plain: 'The subject cannot leave while in custody: no such power exists (Cal. WIC 5150).'
  attribute: subject
  deontic: must_not
  aim: (leave s)
  conditions: (in_custody s)
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. Welf. & Inst. Code s. 5150(a); https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (custody for up to 72 hours). [ADR 0013: or_else -> null. The subject''s exit bar is a disability (no permitted exit exists), not a prohibition the subject answers for; the sanction power that used to be linked here keeps its own trigger condition, so under strict compliance nothing changes and the link only duplicated it. Same reading for coverture R6, police-crisis R4, cps R10 and companion R6.] [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(s) = leave enabled (a default capacity), which this disability makes false in custody Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150: ''take, or cause to be taken, the person into custody for a period of up to 72 hours'' ... ''The 72-hour period begins at the time when the person is first detained.'''
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: take, or cause to be taken, the person into custody for a period of up to 72 hours ... The 72-hour period begins at the time when the person is first detained.
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: the page gives the text as 'updated Jan. 1, 2023' and its source as leginfo.legislature.ca.gov (2024 until the 2026-11-06 card seat caught it); the section states custody, not the subject's exit bar, which the row infers from custody; 5150(c) lets the facility serve the person on a voluntary basis instead of detaining
  var_roles:
    s: subject
- id: R5
  plain: 'The officer may use force on the subject when the subject is in custody and resists.'
  attribute: officer
  deontic: may
  aim: (use_force o s)
  conditions: (and (in_custody s) (resists s))
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: use-of-force authority incident to lawful custody; general peace-officer powers. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: use-of-force authority incident to lawful custody; general peace-officer powers'
  var_roles:
    s: subject
    o: officer
- id: R6
  plain: 'The officer may carry a weapon at any time.'
  attribute: officer
  deontic: may
  aim: (carry_weapon o)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: officers respond armed; standard equipment policy. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: officers respond armed; standard equipment policy'
  var_roles:
    o: officer
- id: R7
  plain: 'The facility must not release the subject early while the treating psychiatrist finds the subject still requires evaluation or treatment (Cal. WIC 5152(a)).'
  attribute: facility
  deontic: must_not
  aim: (release f s)
  conditions: (and (in_custody s) (requires_treatment s))
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. Welf. & Inst. Code s. 5152, read 2026-11-04 at https://california.public.law/codes/ca_welf_and_inst_code_section_5152 (leginfo.legislature.ca.gov returned 403): (a) ''A person admitted to a facility for 72-hour treatment and evaluation ... shall receive an evaluation as soon as possible after the person is admitted''; ''The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person''s treatment believes ... that the person no longer requires evaluation or treatment''; (b) ''A person who has been detained for evaluation and treatment shall be released, referred for further care and treatment on a voluntary basis, or certified for intensive treatment''. Release is the facility''s act (its treating psychiatrist or medical director), not the officer''s: s. 5150(a) (https://california.public.law/codes/ca_welf_and_inst_code_section_5150, cited here until 2026-11-04) gives the officer custody and delivery (R3), no release duty. Re-encoded 2026-11-06 (preregistered, plans/sourcing.md; card-only seat finding): read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5152: (a) ''The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person''s treatment believes, as a result of the psychiatrist''s personal observations, that the person no longer requires evaluation or treatment.'' R7 is now the prohibition side of that ''only if'' (no early release while treatment is still required, exogenous fluent requires_treatment); R12 is the permission side. The earlier duty to release on ''no danger'' was unfaithful and unreachable (danger never changes; detain and hold require it).'
  provenance:
  - source_id: cal-wic-5152
    pin: s. 5152(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person's treatment believes, as a result of the psychiatrist's personal observations, that the person no longer requires evaluation or treatment.
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5152
    note: apostrophes straightened; the psychiatrist's belief is the exogenous fluent requires_treatment; first opened 2026-11-04, when the row encoded a release duty on 'no danger' (unfaithful, card seat 2026-11-06); 5152(b)'s end-of-hold outcomes are not encoded (no clock)
  var_roles:
    s: subject
    f: facility
  choices: 'Until 2026-11-04 the release duty sat on the officer (the one responder role); moved to the new role facility on the card-seat finding that WIC 5150 gives the officer no release duty and 5152 gives it to the facility. Condition and or_else unchanged; the aim variable is renamed o -> f (the attribute binds it).'
- id: R8
  plain: 'The subject may petition for review of the hold when the subject is in custody (Cal. WIC 5275).'
  attribute: subject
  deontic: may
  aim: (petition_review s)
  conditions: (in_custody s)
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. WIC 5275 certification review / habeas; subject keeps standing. UNVERIFIED (general knowledge; no source opened) Verification pass: WIC 5275 read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5275 (text ''updated Jan. 1, 2024'' per the page): ''Every person detained under this part shall have a right to a hearing by writ of habeas corpus for their release'' (the request goes to the person delivering the certification notice or to the intensive-treatment staff).'
  provenance:
  - source_id: cal-wic-5275
    pin: s. 5275
    jurisdiction: US-CA
    effective_date: '2024-01-01'
    verification: opened
    excerpt: Every person detained under this part shall have a right to a hearing by writ of habeas corpus for their release
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5275
    note: effective_date is the page's 'updated Jan. 1, 2024' (the text as amended in 2023); 'this part' (the LPS Act) covers a 5150 hold; the request procedure is written for certification, and the separate certification review hearing (s. 5256) was not opened
  var_roles:
    s: subject
- id: R10
  plain: 'The subject may sue in their own name at any time.'
  attribute: subject
  deontic: may
  aim: (sue s)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'an adult keeps legal capacity to sue in their own name; a 5150 hold does not remove it. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] has_standing(s) = sue or petition_review enabled'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: an adult keeps legal capacity to sue in their own name; a 5150 hold does not remove it'
  var_roles:
    s: subject
- id: R11
  plain: 'The facility may hold the subject when the subject is in crisis and there is danger (Cal. WIC 5150(a)).'
  attribute: facility
  deontic: may
  aim: (hold f s)
  conditions: (and (in_crisis s) (danger s))
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. Welf. & Inst. Code s. 5150(a), read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150: the custody power belongs to ''a peace officer, professional person in charge of a facility designated by the county for evaluation and treatment, member of the attending staff'' ... who ''may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours''. Added 2026-11-06 (L1 landing, preregistered; faithfulness batch 2 P4): the facility holds the same custody power as the officer, and its hold establishes R2 (ADR 0009). [ADR 0013: power fluents are derived from rule enabledness; this rule is what can_sanction reads for the facility]'
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: a peace officer, professional person in charge of a facility designated by the county for evaluation and treatment, member of the attending staff ... may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: the page gives the text as 'updated Jan. 1, 2023' and its source as leginfo.legislature.ca.gov (2024 until the 2026-11-06 card seat caught it); the facility and the officer hold the same power on the same trigger, so the officer remains a second sanctioner (care_and_sanction_same_role violated)
  var_roles:
    s: subject
    f: facility
- id: R12
  plain: 'The facility may release the subject when the treating psychiatrist finds the subject no longer requires evaluation or treatment (Cal. WIC 5152(a)).'
  attribute: facility
  deontic: may
  aim: (release f s)
  conditions: (and (in_custody s) (not (requires_treatment s)))
  or_else: null
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Cal. Welf. & Inst. Code s. 5152, read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5152: (a) ''The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person''s treatment believes, as a result of the psychiatrist''s personal observations, that the person no longer requires evaluation or treatment.'' Added 2026-11-06 (preregistered R7 re-encode, plans/sourcing.md): the permission side of the ''only if''; R7 is the prohibition side. 5152(b)''s end-of-hold outcomes (release, voluntary referral, certification for intensive treatment) are not encoded: the model has no clock for 72 hours (disclosed gap). Apostrophes straightened.'
  provenance:
  - source_id: cal-wic-5152
    pin: s. 5152(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person's treatment believes, as a result of the psychiatrist's personal observations, that the person no longer requires evaluation or treatment.
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5152
    note: apostrophes straightened; 'only if' gives a necessary condition, so the permission is the encoder's reading of when release is lawful; 5152(b) (release, referral or certification at the end of the hold) not encoded
  var_roles:
    s: subject
    f: facility
source_text: '''When a person, as a result of a mental health disorder, is a danger to others, or to themselves, or gravely disabled, a peace officer, ... designated members of a mobile crisis team, or professional person designated by the county may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours for assessment, evaluation, and crisis intervention.'' ''At a minimum, assessment ... and evaluation ... shall be conducted and provided on an ongoing basis.'' Cal. Welf. & Inst. Code s. 5150(a), read at https://california.public.law/codes/ca_welf_and_inst_code_section_5150'
expected_properties:
  care_and_sanction_same_role: violated
  subject_cannot_exit: reachable
  dependent_cannot_exit: reachable
  no_standing: unreachable_open
isomorphic_to:
- id: cps
  level: guard+strands
  sub_signature:
  - R2~R4 provides_care~in_home_considered
  - R11~R3 hold~remove
  - R4~R10 leave~leave
- id: coverture-household
  level: guard+strands
  sub_signature:
  - R2~R2 provides_care~provides_care
  - R11~R5 hold~chastise
  - R4~R6 leave~leave
not_isomorphic_to: [crisis-team]
