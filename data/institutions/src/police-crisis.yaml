notes: 'Since 2026-11-06 (WIC 5150 re-encode): the facility is bound to care (R2) and may hold (R11), the officer may detain (R3) and use force (R5), so the carer also sanctions but is not the only sanctioner (care_and_sanction_same_role violated). Until then this note read: the same role (officer) is bound to care (R2, assess) and empowered to detain (R3) and use force (R5). subject_cannot_exit is reachable with scope=interaction only (the 72-hour hold), not institution; report the scope. Pitfalls: (1) R1 is the implicit rule that makes this police-crisis rather than crisis-team; the statute itself also names mobile crisis teams as holders of the 5150 power, so an encoder reading only the statute will not see why armed officers are the ones who come; (2) a trivial encoding that ignores or_else on R4 will cluster this with crisis-team (plan: worked pitfall); (3) no_standing is unreachable_open, not ''safe'': the subject keeps has_standing via R8, but the bound k=6 says nothing beyond it. Armed status (R6) is a tying strand: it is not required by 5150 and is what the crisis-team reform removes. ADR 0009: R2 is a state obligation (''on an ongoing basis'' is a state); R1 stays an action obligation but dispatch consumes the call. Exogenous triggers (call_received, in_crisis, danger, resists) are initial_free, since under init=declared a fluent no action sets would otherwise be pinned false and no call could ever arrive. Re-encoded 2026-11-06 to WIC 5150 (plans/sourcing.md, L1 landing): the care duty (R2) and a custody power (R11) are the facility''s; the officer keeps detain (R3, now detain(o, f, s), delivering to a facility) and force (R5), so care_and_sanction_same_role is violated here (a second sanctioner) while the care+control form holds with the facility as the bundled role. Earlier sentences of these notes describe the officer-as-carer encoding.'
initial: []
initial_free: [call_received, in_crisis, danger, resists, requires_treatment]
goods_note: 'Slice 2 revision 2 (plans/priority-slice2-results.md, "Revision 2"): goods as encoded, strict compliance, k=6 and 8, both encoders read the same; a statement about encodings (ADR 0011). Two measures, never combined: guaranteed (the rules as obeyed force the good) and possible (it can hold under the rules as obeyed, within k, at one step, for some bearer in some starting world). As encoded, no rule guarantees these goods (cared_for, known_carer) and no single deletion makes them impossible, so the instrument reads no care strand here under either measure; this is not a finding that care is fragile in police crisis response. R2 unread; R4 (the custody exit bar) reads tying. Known limit: is_subject is never cleared, so a person whose crisis has ended is still read as needing care. Second encoder: agent, not someone living under the institution (ADR 0012).'
