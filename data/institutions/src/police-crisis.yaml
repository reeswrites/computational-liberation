id: police-crisis
name: Armed police response to mental-health crisis (Cal. WIC 5150)
roles:
- name: officer
  gloss: peace officer dispatched to the call; armed
- name: subject
  gloss: the person in crisis
- name: dispatcher
  gloss: 911 dispatch; chooses who responds
- name: facility
  gloss: the designated facility that evaluates and releases under WIC 5150/5152
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [subject]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
  arg_roles: [officer, subject]
- name: in_custody
  arity: 1
  gloss: x is held by the institution and may not leave
  arg_roles: [subject]
- name: in_crisis
  arity: 1
  gloss: x is in a mental-health crisis
  arg_roles: [subject]
- name: danger
  arity: 1
  gloss: x is a danger to self or others, or gravely disabled (WIC 5150 trigger)
  arg_roles: [subject]
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [o, s]
  derived: (or (enabled detain o s) (enabled use_force o s))
  arg_roles: [officer, subject]
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [s]
  derived: (enabled leave s)
  arg_roles: [subject]
- name: has_standing
  arity: 1
  gloss: x can start a legal claim in x's own name
  params: [s]
  derived: (or (enabled sue s) (enabled petition_review s))
  arg_roles: [subject]
- name: call_received
  arity: 1
  gloss: a crisis call about s has been received
  arg_roles: [subject]
- name: responding
  arity: 2
  gloss: o is on scene with s
- name: armed
  arity: 1
  gloss: o carries a firearm
- name: resists
  arity: 1
  gloss: s resists the hold
actions:
- name: dispatch_officer
  args: [d, o, s]
  effects:
  - fluent: responding
    args: [o, s]
    value: true
  - fluent: is_subject
    args: [s]
    value: true
  - fluent: provides_care
    args: [o, s]
    value: true
  - fluent: call_received
    args: [s]
    value: false
- name: assess
  args: [o, s]
  effects:
  - fluent: provides_care
    args: [o, s]
    value: true
- name: withdraw
  args: [o, s]
  effects:
  - fluent: provides_care
    args: [o, s]
    value: false
- name: detain
  args: [o, s]
  effects:
  - fluent: in_custody
    args: [s]
    value: true
- name: use_force
  args: [o, s]
  effects:
  - fluent: resists
    args: [s]
    value: false
- name: release
  args: [o, s]
  effects:
  - fluent: in_custody
    args: [s]
    value: false
- name: leave
  args: [s]
  effects:
  - fluent: responding
    args: [o, s]
    value: false
  - fluent: provides_care
    args: [o, s]
    value: false
  default_capacity: true
- name: petition_review
  args: [s]
  effects: []
- name: sue
  args: [s]
  effects: []
  default_capacity: true
- name: carry_weapon
  args: [o]
  effects:
  - fluent: armed
    args: [o]
    value: true
rules:
- id: R1
  plain: '(practice, not written) The dispatcher must dispatch an officer to a subject when a call about that subject has been received.'
  attribute: dispatcher
  deontic: must
  aim: (dispatch_officer d o s)
  conditions: (call_received s)
  or_else: null
  strand: tying
  implicit: true
  source: 'implicit: police are the default responder to a crisis call; nothing in WIC 5150 requires it, dispatch practice does. UNVERIFIED (general knowledge; no source opened). [ADR 0009: one-off action obligation; dispatch consumes call_received so it fires once per call]'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named for this rule (WIC 5150 is cited as not requiring it); rationale: implicit: police are the default responder to a crisis call; nothing in WIC 5150 requires it, dispatch practice does'
- id: R2
  plain: 'The officer providing care to the subject must hold when the officer is responding to the subject and the subject is in crisis (Cal. WIC 5150).'
  attribute: officer
  deontic: must
  aim: (provides_care o s)
  conditions: (and (responding o s) (in_crisis s))
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Cal. Welf. & Inst. Code s. 5150(a); https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (assessment, evaluation and crisis intervention ''shall be conducted and provided on an ongoing basis''). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] dispatch establishes provides_care(o, s); assess restores it, withdraw (the officer stops attending) breaks it Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (text ''updated Jan. 1, 2024'' per the page): ''At a minimum, assessment, as defined in Section 5150.4, and evaluation, as defined in subdivision (a) of Section 5008, shall be conducted and provided on an ongoing basis'' (passive: the section does not name the officer as the one who provides it).'
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: At a minimum, assessment, as defined in Section 5150.4, and evaluation, as defined in subdivision (a) of Section 5008, shall be conducted and provided on an ongoing basis
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: 'the page gives the text as ''updated Jan. 1, 2024'' and its source as leginfo.legislature.ca.gov; the duty is in the passive voice and is not placed on the officer: the row''s provides_care(o, s) on the responding officer is the encoder''s reading (faithfulness finding, plans/sourcing.md)'
  load_bearing: true
- id: R3
  plain: 'The officer may detain the subject when responding to a subject who is in crisis and there is danger (Cal. WIC 5150).'
  attribute: officer
  deontic: may
  aim: (detain o s)
  conditions: (and (responding o s) (in_crisis s) (danger s))
  or_else: null
  strand: rival
  implicit: false
  source: 'Cal. Welf. & Inst. Code s. 5150(a); https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (a peace officer may, upon probable cause, take the person into custody for up to 72 hours) Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150: ''When a person, as a result of a mental health disorder, is a danger to others, or to themselves, or gravely disabled, a peace officer'' ... ''may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours''.'
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: When a person, as a result of a mental health disorder, is a danger to others, or to themselves, or gravely disabled, a peace officer ... may, upon probable cause, take, or cause to be taken, the person into custody for a period of up to 72 hours
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: the page gives the text as 'updated Jan. 1, 2024' and its source as leginfo.legislature.ca.gov; the statute's trigger also includes 'gravely disabled' and requires probable cause; the row reads only danger
- id: R4
  plain: 'The subject cannot leave while in custody: no such power exists (Cal. WIC 5150).'
  attribute: subject
  deontic: must_not
  aim: (leave s)
  conditions: (in_custody s)
  or_else: null
  strand: rival
  implicit: false
  source: 'Cal. Welf. & Inst. Code s. 5150(a); https://california.public.law/codes/ca_welf_and_inst_code_section_5150 (custody for up to 72 hours). [ADR 0013: or_else -> null. The subject''s exit bar is a disability (no permitted exit exists), not a prohibition the subject answers for; the sanction power that used to be linked here keeps its own trigger condition, so under strict compliance nothing changes and the link only duplicated it. Same reading for coverture R6, police-crisis R4, cps R10 and companion R6.] [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(s) = leave enabled (a default capacity), which this disability makes false in custody Verification pass: read 2026-11-06 at https://california.public.law/codes/ca_welf_and_inst_code_section_5150: ''take, or cause to be taken, the person into custody for a period of up to 72 hours'' ... ''The 72-hour period begins at the time when the person is first detained.'''
  provenance:
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: take, or cause to be taken, the person into custody for a period of up to 72 hours ... The 72-hour period begins at the time when the person is first detained.
    accessed: '2026-11-06'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5150
    note: the page gives the text as 'updated Jan. 1, 2024' and its source as leginfo.legislature.ca.gov; the section states custody, not the subject's exit bar, which the row infers from custody; 5150(c) lets the facility serve the person on a voluntary basis instead of detaining
- id: R5
  plain: 'The officer may use force on the subject when the subject is in custody and resists.'
  attribute: officer
  deontic: may
  aim: (use_force o s)
  conditions: (and (in_custody s) (resists s))
  or_else: null
  strand: rival
  implicit: false
  source: use-of-force authority incident to lawful custody; general peace-officer powers. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: use-of-force authority incident to lawful custody; general peace-officer powers'
- id: R6
  plain: 'The officer may carry a weapon at any time.'
  attribute: officer
  deontic: may
  aim: (carry_weapon o)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  source: officers respond armed; standard equipment policy. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: officers respond armed; standard equipment policy'
- id: R7
  plain: 'The facility must release the subject when the subject is in custody and there is no danger (Cal. WIC 5152).'
  attribute: facility
  deontic: must
  aim: (release f s)
  conditions: (and (in_custody s) (not (danger s)))
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Cal. Welf. & Inst. Code s. 5152, read 2026-11-04 at https://california.public.law/codes/ca_welf_and_inst_code_section_5152 (leginfo.legislature.ca.gov returned 403): (a) ''A person admitted to a facility for 72-hour treatment and evaluation ... shall receive an evaluation as soon as possible after the person is admitted''; ''The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person''s treatment believes ... that the person no longer requires evaluation or treatment''; (b) ''A person who has been detained for evaluation and treatment shall be released, referred for further care and treatment on a voluntary basis, or certified for intensive treatment''. Release is the facility''s act (its treating psychiatrist or medical director), not the officer''s: s. 5150(a) (https://california.public.law/codes/ca_welf_and_inst_code_section_5150, cited here until 2026-11-04) gives the officer custody and delivery (R3), no release duty.'
  provenance:
  - source_id: cal-wic-5152
    pin: s. 5152(a), (b)
    jurisdiction: US-CA
    effective_date: null
    verification: opened
    excerpt: A person admitted to a facility for 72-hour treatment and evaluation ... shall receive an evaluation as soon as possible after the person is admitted ... The person shall be released before 72 hours have elapsed only if the psychiatrist directly responsible for the person's treatment believes ... that the person no longer requires evaluation or treatment ... A person who has been detained for evaluation and treatment shall be released, referred for further care and treatment on a voluntary basis, or certified for intensive treatment
    accessed: '2026-11-04'
    url: https://california.public.law/codes/ca_welf_and_inst_code_section_5152
    note: leginfo.legislature.ca.gov returned 403
  - source_id: cal-wic-5150
    pin: s. 5150(a)
    jurisdiction: US-CA
    effective_date: null
    verification: recalled
    excerpt: null
    accessed: null
    url: null
    note: cited for what it lacks (no release duty on the officer); no read record for this use
  choices: 'Until 2026-11-04 the release duty sat on the officer (the one responder role); moved to the new role facility on the card-seat finding that WIC 5150 gives the officer no release duty and 5152 gives it to the facility. Condition and or_else unchanged; the aim variable is renamed o -> f (the attribute binds it).'
- id: R8
  plain: 'The subject may petition for review of the hold when the subject is in custody (Cal. WIC 5275).'
  attribute: subject
  deontic: may
  aim: (petition_review s)
  conditions: (in_custody s)
  or_else: null
  strand: tying
  implicit: false
  source: Cal. WIC 5275 certification review / habeas; subject keeps standing. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: cal-wic-5275
    pin: s. 5275
    jurisdiction: US-CA
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: old source string says UNVERIFIED
- id: R10
  plain: 'The subject may sue in their own name at any time.'
  attribute: subject
  deontic: may
  aim: (sue s)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  source: 'an adult keeps legal capacity to sue in their own name; a 5150 hold does not remove it. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] has_standing(s) = sue or petition_review enabled'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
