id: transferable-leave
name: Transferable parental leave (paternity-quota with one rule changed)
extends: paternity-quota
rules_replace:
- id: R2
  plain: 'The non-birthing parent may transfer reserved weeks to another parent of the child when holding reserved weeks (minimal-pair construction: reserved block made shareable).'
  attribute: non_birthing_parent
  deontic: may
  aim: (transfer_reserved p q)
  conditions: (and (reserved_weeks_available p) (parent q c))
  or_else: null
  strand: tying
  implicit: false
  source: 'Minimal-pair construction: the reserved block is made shareable, as the shareable block is under QPIP s. 16 and as all 35 standard parental weeks were under Canadian EI before the 2019-03-17 Parental Sharing Benefit. Employment Insurance maternity and parental benefits, canada.ca; https://www.canada.ca/en/services/benefits/ei/ei-maternity-parental.html; Act respecting parental insurance, CQLR c. A-29.011, ss. 9, 10, 16, 17; https://www.legisquebec.gouv.qc.ca/en/document/cs/A-29.011'
  var_roles:
    q: birthing_parent
source_text: 'Canadian EI standard parental benefits: ''up to 40 weeks can be shared between parents, but one parent cannot receive more than 35 weeks of standard benefits''; maternity benefits ''can''t be shared between parents'' (canada.ca, read at https://www.canada.ca/en/services/benefits/ei/ei-maternity-parental.html). Before 2019-03-17 there were no reserved weeks: the Parental Sharing Benefit added the 5 (standard) or 8 (extended) use-it-or-lose-it weeks for children born on or after that date (https://canada.ca/en/employment-social-development/campaigns/ei-improvements/parent-sharing.html). The entry encodes the pre-2019 form: the same block exists but may be transferred.'
expected_properties:
  solo_care_by_non_birthing_parent: reachable
  leave_reserved_for_non_birthing_parent: violated
  care_assigned_by_sex: reachable
not_isomorphic_to: [paternity-quota]
minimal_pair_of:
  id: paternity-quota
  rule: R2
  differs_on: leave_reserved_for_non_birthing_parent
  postregistered: true
  supersedes: solo_care_by_non_birthing_parent
notes: 'Identical to paternity-quota except R2: must_not transfer_reserved (a disability, or_else null since 2026-11-04; before that with forfeiture as or_else) becomes may transfer_reserved (no or_else). solo_care_by_non_birthing_parent stays reachable (R1 is untouched) but leave_reserved_for_non_birthing_parent is violated: a compliant trace transfers the reserved weeks to the birthing parent, who then takes them, and with the implicit default R7 that is the trace the norm selects. Pitfalls: (1) the encoder must keep R3 (forfeiture) even though nothing now triggers it as a sanction; dropping it changes the rule count and the iso report should say ''one rule apart'', not two; (2) expected care_assigned_by_sex is ''reachable'' here versus ''violated'' in the quota: that is the historical finding (transferable weeks go to mothers) stated as permission, not frequency; (3) the real present-day Canadian regime is itself a quota (5 reserved weeks), so cite it for the shareable 35, not as the pure transferable case.'
