id: kibbutz-childrens-house
name: Kibbutz children's house (communal sleeping, metapelet care rota)
roles:
- name: committee
  gloss: the work / education committee that staffs the children's house (the kibbutz general assembly's organ)
- name: metapelet
  gloss: the metapelet (nanny / caregiver) assigned to the children's house; a woman
- name: male_member
  gloss: a male kibbutz member; a parent who visits, never a children's-house carer
- name: child
  gloss: a child of the kibbutz; sleeps in the children's house
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [child]
- name: provides_care
  arity: 2
  gloss: x provides care (maintenance, assessment, treatment, services, feeding) to y
- name: female
  arity: 1
  gloss: x is female (sex as assigned by the institution's own records)
  arg_roles: [metapelet]
- name: can_sanction
  arity: 2
  gloss: 'x holds a power to coerce y: detain, remove, chastise, prosecute'
  params: [c, x]
  derived: (enabled reprimand c x)
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [s]
  derived: (enabled sleep_home s)
  arg_roles: [child]
- name: can_assign
  arity: 2
  gloss: c holds the power to put x on the children's-house care rota
  params: [c, x]
  derived: (enabled assign c x)
- name: member
  arity: 1
  gloss: x is an adult member of the kibbutz (eligible for work assignment)
- name: assigned
  arity: 1
  gloss: x is on the children's-house care rota
- name: at_home
  arity: 1
  gloss: the child sleeps in the parents' home rather than the children's house
  arg_roles: [child]
actions:
- name: assign
  args: [committee, x]
  effects:
  - fluent: provides_care
    args: [x, child]
    value: true
  - fluent: assigned
    args: [x]
    value: true
- name: release
  args: [committee, x]
  effects:
  - fluent: provides_care
    args: [x, child]
    value: false
  - fluent: assigned
    args: [x]
    value: false
- name: neglect
  args: [x, child]
  effects:
  - fluent: provides_care
    args: [x, child]
    value: false
- name: visit
  args: [x, child]
  effects: []
- name: sleep_home
  args: [child]
  effects:
  - fluent: at_home
    args: [child]
    value: true
  default_capacity: true
- name: reprimand
  args: [committee, x]
  effects: []
rules:
- id: R1
  plain: 'The committee may assign a member to the children''s house when that person is a member.'
  attribute: committee
  deontic: may
  aim: (assign committee x)
  conditions: (member x)
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Wikipedia, ''Kibbutz communal child rearing and collective education'' (read 2026-11-03): ''The nanny position was always a woman''s role. Teacher positions were both for women and men.''; children ''lived in the children''s house, where they had communal sleeping arrangements'' and ''visited their parents for 2-3 hours a day''; https://en.wikipedia.org/wiki/Kibbutz_communal_child_rearing_and_collective_education (members are assigned to the children''s house by the committee; the rule as written is sex-blind: any member). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_assign(committee, x) = assign enabled (R1); R2 is a sanctioned norm, so `enabled` does not read it and compliant traces carry it'
- id: R2
  plain: '(practice, not written) The committee must not assign a male member to the children''s house, or else the committee may reprimand (R6).'
  attribute: committee
  deontic: must_not
  aim: (assign committee male_member)
  conditions: 'true'
  or_else: R6
  strand: tying
  implicit: true
  source: 'SANCTIONED NORM encoding a documented PRACTICE, not a written rule (third review 2026-11-03: the sources support a practice, not a committee disability): the nanny ''was always a woman''s role'' (WIKI_KIB); no kibbutz by-law said so, the rota simply never put a man in the children''s house, and Tiger & Shepher, Women in the Kibbutz (Harcourt Brace Jovanovich, 1975): women concentrated in child care, education and services despite formal equality. Cited by WIKI_KIB (pp. 41, 167); book and sample (34,040 members) confirmed via Kirkus review https://www.kirkusreviews.com/book-reviews/lionel-joseph-shepher-tiger/women-in-the-kibbutz/ ; the assignment finding itself NOT read directly: UNVERIFIED reports women concentrated in child care as a pattern (the finding is framed there as women''s own choice). Encoded as a prohibition the committee answers for (or_else R6, the implicit reprimand), not as a disability; under strict compliance the effect on traces is the same, which is what gate (d) reads. Earlier draft (disability, or_else null) retired by the third review'
  load_bearing: true
- id: R3
  plain: 'The metapelet caring for the child must hold when the metapelet is assigned, or else the committee may reprimand (R6).'
  attribute: metapelet
  deontic: must
  aim: (provides_care metapelet child)
  conditions: (assigned metapelet)
  or_else: R6
  strand: superadditive
  implicit: false
  source: 'Wikipedia, ''Kibbutz communal child rearing and collective education'' (read 2026-11-03): ''The nanny position was always a woman''s role. Teacher positions were both for women and men.''; children ''lived in the children''s house, where they had communal sleeping arrangements'' and ''visited their parents for 2-3 hours a day''; https://en.wikipedia.org/wiki/Kibbutz_communal_child_rearing_and_collective_education (the metapelet runs the children''s house). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] assign establishes provides_care(x, child); neglect breaks it (sanction R6); release ends the assignment'
  load_bearing: true
- id: R4
  plain: 'The child cannot sleep at home at any time: no such power exists (communal sleeping in the children''s house).'
  attribute: child
  deontic: must_not
  aim: (sleep_home child)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: false
  source: 'Wikipedia, ''Kibbutz communal child rearing and collective education'' (read 2026-11-03): ''The nanny position was always a woman''s role. Teacher positions were both for women and men.''; children ''lived in the children''s house, where they had communal sleeping arrangements'' and ''visited their parents for 2-3 hours a day''; https://en.wikipedia.org/wiki/Kibbutz_communal_child_rearing_and_collective_education (communal sleeping: the children lived and slept in the children''s house). A disability (or_else null), as every subject-side exit bar since ADR 0013; the draft''s or_else R6 is dropped for the same reason as coverture R6. [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(child) = sleep_home enabled (a default capacity) and not barred (R4)'
- id: R5
  plain: 'A male member may visit the child at any time.'
  attribute: male_member
  deontic: may
  aim: (visit male_member child)
  conditions: 'true'
  or_else: null
  strand: superadditive
  implicit: false
  source: 'Wikipedia, ''Kibbutz communal child rearing and collective education'' (read 2026-11-03): ''The nanny position was always a woman''s role. Teacher positions were both for women and men.''; children ''lived in the children''s house, where they had communal sleeping arrangements'' and ''visited their parents for 2-3 hours a day''; https://en.wikipedia.org/wiki/Kibbutz_communal_child_rearing_and_collective_education (children ''visited their parents for 2-3 hours a day''; the father''s relation to the children''s house is the visit, not care)'
- id: R6
  plain: '(practice, not written) The committee may reprimand a member at any time (the sanction for R3 and R2).'
  attribute: committee
  deontic: may
  aim: (reprimand committee x)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: true
  source: 'implicit: the committee / general assembly disciplines a member who neglects the rota (R3''s or_else). Guard (assigned x) tried 2026-11-04 and reverted (see the entry notes): with it can_sanction(committee, child) is unreachable and care_and_sanction_same_role flips to holds_to_k (vacuous). UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_sanction(committee, x) = reprimand enabled (R6)'
- id: R8
  plain: '(practice, not written) The metapelet may neglect the child when assigned to the children''s house.'
  attribute: metapelet
  deontic: may
  aim: (neglect metapelet child)
  conditions: (assigned metapelet)
  or_else: null
  strand: superadditive
  implicit: true
  source: 'implicit, added 2026-11-04 per ADR 0015 A6 (strict enabledness at layer 2: an action needs a may/must rule) so that the breaker of R3 is an enabled action for the layer-2 ABM: the metapelet can always fail the children''s house, and that is the choice R3''s or_else R6 answers. Under layer 1 the permissive floor already let the unregulated neglect fire in traces, so no verdict should change; the rule makes neglect regulated, which narrows its firing to the assigned metapelet (the only bearer of R3). Condition mirrors R3: neglect is a breach only while assigned. Tagged superadditive as the care strand''s own breach (R3), as companion R10 `may feed` is tagged for the restore. UNVERIFIED (general knowledge; no source opened)'
source_text: '''Children''s lives had three focal points: the children''s house, parents'' house, and the whole kibbutz.'' ''They lived in the children''s house, where they had communal sleeping arrangements'' and ''visited their parents for 2-3 hours a day.'' ''The nanny position was always a woman''s role. Teacher positions were both for women and men.'' (Wikipedia, ''Kibbutz communal child rearing and collective education'', read 2026-11-03.) ''The era ended over the weekend, when the 80 children at Kibbutz Baram in the lower Galilee moved into their parents'' homes'' (JTA, 1997-06-16); the pressure came ''particularly from young mothers'' (SCMP, 1997).'
expected_properties:
  care_assigned_by_sex: persists
  subject_cannot_exit: reachable
  care_and_sanction_same_role: violated
isomorphic_to:
- id: coverture-household
  level: guard+strands
  sub_signature: [R3~R3 provides_care~provides_care]
not_isomorphic_to: [police-crisis, cps]
minimal_pair_of: null
notes: 'Gate (d): the historical failure. The explicit rules are sex-blind (R1 may assign any member) and the reform of the 1970s-1990s removed the exit bar on the child (R4), yet care_assigned_by_sex PERSISTS because the implicit sanctioned norm R2 (never a man in the children''s house; a documented practice, or_else R6) survives: every strictly compliant trace keeps provides_care in female hands. RE-ENCODED after the third review (2026-11-03): R2 was a disability (or_else null); the sources support a practice, not a committee disability, so it is now must_not + or_else R6. ''implicit'' is a human tag the engine reports back; the ablation bites because R1 was written sex-blind (disclosed). PREREGISTERED (2026-11-03, before any run): care_assigned_by_sex persists here; fails in kibbutz-childrens-house-no-implicit, which is this entry minus R2 (differs_on care_assigned_by_sex); subject_cannot_exit reachable (R4 bars sleep_home); care_and_sanction_same_role violated (the committee sanctions, the metapelet cares). Deviations from plans/institutions-batch2.md: R1 is ''(assign committee x) when (member x)'' rather than ''(assign committee metapelet)'', because an action instance no may/must rule names is disabled, so the draft''s ablation (drop R2 -> assign male_member) only bites if R1 covers the man; R4 is a disability (or_else null) per the ADR 0013 exit convention, so R6 is R3''s or_else only and its condition is ''true'' (the or_else link enables it on breach); sleep_home is a default capacity (flagged on the action since revision 4, 2026-11-04; the former implicit R7 ''may sleep_home when true'' is deleted) so can_exit is carried by the capacity unless R4 bars it, as in every other entry; the draft''s release action is kept but the breaker of R3 is neglect (release clears the condition with the state, so it breaks nothing). Pitfalls: (1) female needs arg_roles [metapelet] or the solver invents a female male_member; (2) an encoder that writes R1 as ''may assign metapelet'' hides R2 inside R1 and the no-implicit variant collapses into the original; (3) ''persists'' is about what the rules permit, not uptake. Rival reading (notes only): regendering of care came from mothers'' demands (SCMP), not from the committee; the entry does not encode who drove the reform. PREREGISTERED 2026-11-04 (before any run; ADR 0015 A6: R8 ''metapelet may neglect when assigned'', implicit, in KIB_RULES so it flows into the no-implicit pair too): expected effect on this entry''s three properties is NONE. care_assigned_by_sex persists (neglect can only clear provides_care, never put it in male hands; at layer 1 the unregulated neglect already fired freely under the trace floor, and making it regulated narrows its firing to the assigned metapelet, which removes no trace that bears on the property); subject_cannot_exit reachable (R4 untouched; sleep_home stays a default capacity); care_and_sanction_same_role violated (the committee''s reprimand power and the metapelet''s care are untouched; the violating trace needs assign, not neglect). Minimal pair kibbutz-childrens-house-no-implicit: unchanged (fails / reachable / violated), distance to this entry stays 1 with R2 the one separating rule (R8 is in both). isomorphic_to coverture-household at guard+strands: it already reads NO today (matched 0, distance 9: a pre-existing disagreement with the claim as written, found while baselining, not caused by this change) and is expected to stay NO with matched 0 and distance 9, because coverture has no may-rule tagged superadditive for R8 to match and distance = max(8, 9) - 0 is unchanged; not_isomorphic_to police-crisis / cps stay yes. Gate (d): PASS unchanged (persists vs fails, R2 the one separating rule). check-all: 106/106, no inert rule (R8 is a may). Layer 2 (information only): neglect becomes an available action for the assigned metapelet; the baseline ABM run (2026-11-04, before R8) shows the metapelet with no available action at all. PREREGISTERED 2026-11-04 (before any run; R6 guard, accepted decision of 2026-11-04): R6 ''may reprimand'' gains the condition (assigned x) (ASSUMED: the committee disciplines only a member on the rota; previously ''true'', under which the layer-2 ABM had the committee reprimand random members about half the time). Expected effect on the three expected_properties: NONE. care_assigned_by_sex persists (reprimand has no effects; nothing new puts care in male hands); subject_cannot_exit reachable (R4 untouched; sleep_home stays a default capacity); care_and_sanction_same_role violated (can_sanction(committee, x) = (enabled reprimand committee x) now holds only while assigned(x); assigned(metapelet) is in the initial state, so can_sanction(committee, metapelet) is still true in compliant traces while the metapelet provides care, and the property''s (= z x) fails exactly as before). The or_else links R2->R6 and R3->R6 are unaffected: under compliance=sanctioned a breach enables the or_else action whatever its condition, and check-all runs strict, where or_else is not read. Minimal pair kibbutz-childrens-house-no-implicit: unchanged (fails / reachable / violated), distance 1 with R2 the separating rule (R6 is in both via KIB_RULES). check-all: 106/106 agreement, no inert rule (R6 is a may); the ''R6: untyped variable(s) [x]'' warning stays. Gate: PASS; (d) unchanged (persists vs fails, R2 the one separating rule); (a) 0 inert; (b), (c), (e), (f) untouched (kibbutz is outside the cluster). isomorphic_to coverture-household at guard+strands: stays NO, matched 0, distance 9 (R6''s skeleton becomes (may, (role, var), guarded, no or_else, rival); coverture R5 chastise is (may, (var, var), guarded, no or_else, rival): the aim patterns differ, so no new pair); not_isomorphic_to police-crisis / cps stay yes (distances 10 / 11 move by at most 1). Layer 2 (information only; baseline run 2026-11-04 before the guard, 10 seeds x 30 steps, committee adoption split: assign(committee,metapelet) 0.32, reprimand(committee,metapelet) 0.275, reprimand(committee,child) 0.225, reprimand(committee,male_member) 0.18): expected after the guard, reprimand(committee,child) and reprimand(committee,male_member) disappear (never assigned; the committee''s R2 breach rate is 0.0 in the baseline) and the committee splits between assign(committee,metapelet) and reprimand(committee,metapelet) (plus ''none'' if the material module prefers it); metapelet, male_member and child unchanged. If any verdict flips the guard is reverted, not the expectation. R6 guard tried 2026-11-04 and reverted: care_and_sanction_same_role flipped from violated to holds_to_k (flags vacuous, antecedent-unreachable) in this entry AND in kibbutz-childrens-house-no-implicit (check-all 104/106; gate still PASS). The preregistration above was wrong about which binding carries the verdict: the property quantifies sanction power over the SUBJECT ((is_subject y) and (can_sanction z y) and (provides_care x y) => (= z x)), so the violating trace needs can_sanction(committee, child) = (enabled reprimand committee child), which R6 ''true'' grants and (assigned child) never does (the child is not a member, so R1 cannot put it on the rota: the antecedent becomes unreachable and the invariant holds vacuously). The guard would have to be ''(or (assigned x) (is_subject x))'' or the property''s reading changed; neither was accepted, so R6 is back to ''true'' and the ABM keeps reprimanding random members (committee split with the guard, 10 seeds x 30 steps: assign(committee,metapelet) 0.685, reprimand(committee,metapelet) 0.315, as preregistered for layer 2; without it: 0.32 / 0.275 / child 0.225 / male_member 0.18). Layer-2 reading of R8 at step 0 (2026-11-04): assigned(metapelet) is in the entry''s `initial` (_kib_init, alongside provides_care(metapelet, child)), so Reference.initial_split puts it in the fixed set and the ABM''s step-0 state carries it; neglect(metapelet, child) is therefore a power at step 0 (verified with Reference.power on the ABM''s initial state: available_for(''metapelet'') = [neglect]); the slice-3 observation that it was not predates R8 reaching institutions.json, and the metapelet''s ''none'' adoption is a choice (neglect breaches R3, sanctioned by R6), not an absence of power; no rule change. DISAGREEMENT 2026-11-04: iso with coverture-household at guard+strands reads NO (matched 0, distance 9) under the current matcher; claim not edited; cause unexamined (candidate: the matcher needs the same strand tag on R3 and coverture R3 and a shared guard shape). Encoder observation, not a cause finding: rules_iso.rule_skeleton keys the aim by literal-role vs variable positions, and this entry''s R3 aim names roles (provides_care metapelet child) while coverture R3 uses bound variables (provides_care w h).'
initial:
- (female metapelet)
- (is_subject child)
- (member metapelet)
- (member male_member)
- (assigned metapelet)
- (provides_care metapelet child)
