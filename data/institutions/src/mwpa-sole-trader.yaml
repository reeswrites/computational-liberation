id: mwpa-sole-trader
name: Sole-trader act (earnings act minus R7, plus may contract)
extends: mwpa-earnings
rules_drop: [R7]
rules_add:
- id: R15
  plain: 'The wife may contract in her own name at any time (sole-trader acts, Khan 1996).'
  attribute: wife
  deontic: may
  aim: (contract w)
  conditions: 'true'
  or_else: null
  strand: tying
  implicit: false
  source: 'Khan 1996, Married Women''s Property Laws and Female Commercial Activity, Table 1 (sole-trader dates; the 1839-50 wave as debt relief); https://www.laits.utexas.edu/~mbs31415/Khan_MarriedWomenPropertyRights.pdf [F, via plans/backtest-mwpa.md] (sole-trader provisions: a married woman may carry on trade and contract in her own name; ME 1844, MA 1860, NY 1860, ...). Statute texts not opened ([R]). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_contract(w) = contract enabled (R15), no longer barred (R7 deleted)'
  provenance:
