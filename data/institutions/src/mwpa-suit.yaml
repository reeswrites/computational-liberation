- id: R19
  plain: 'The wife cannot sue her husband while married: no such power exists (the suit acts leave suits between spouses barred: omitted in MA 1855 c. 304, barred in terms by MA 1874 c. 184 s. 3; in New York by construction, Longendyke 1863).'
  attribute: wife
  deontic: must_not
  aim: (sue_spouse w h)
  conditions: (married h w)
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'UNVERIFIED (leads, not opened 2026-11-05; plans/sourcing-worklist-mwpa.md, Jurisdiction mismatch A, option A2): Massachusetts St. 1855 c. 304 s. 3, proviso ''nothing herein contained shall authorize suits between husband and wife'' (quoted in the worklist from a case-law summary, not from the statute); New York Laws 1860 ch. 90 s. 7 as read in Longendyke v. Longendyke (N.Y. Sup. Ct. 1863, as summarised): not against her husband for assault or slander. The part of coverture''s R4 disability the acts leave standing: every US act found bars or omits suits between spouses. A disability (or_else null), not a sanctioned prohibition. [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] has_standing_against_spouse(w, h) = sue_spouse enabled (a default capacity), which this disability removes while married Verification pass: Massachusetts St. 1855 c. 304 read 2026-11-06 at https://archives.lib.state.ma.us/server/api/core/bitstreams/6cc4626f-6cc6-47f5-9a38-7a775ff276b4/content: it contains no proviso on suits between husband and wife (s. 3 is conveyance and contract; the suit clauses, ss. 4 and 7, are silent on the husband); the quoted proviso is in Massachusetts St. 1874 c. 184, read 2026-11-06 at https://archives.lib.state.ma.us/server/api/core/bitstreams/ce48bb31-9c82-4384-925f-39ba51ab54b4/content (''Approved April 24, 1874''): s. 3 ''A married woman may sue and be sued in the same manner and to the same extent as if she were sole, but nothing herein contained shall authorize suits between husband and wife.'' New York Laws 1860 ch. 90 s. 7 bars nothing in terms (''except her husband'' there qualifies gifts); Longendyke v. Longendyke, 44 Barb. 366 (N.Y. Sup. Ct. 1863), read 2026-11-06 at https://static.case.law/barb/44/cases/0366-01.json: ''It is conceded by counsel that by the rules of the common law husband and wife could not sue each other in a civil action'' ... ''The right to sue her husband in an action of assault and battery may perhaps be covered under the literal language of this section; but I think such was not the meaning and intent of the legislature''. Suit clauses read for this row (2026-11-06): Massachusetts 1855 s. 4 ''may, while married, sue and be sued, in all matters having relation to her property, in the same manner as if she were sole''; New York 1860 s. 7 ''Any married woman may, while married, sue and be sued in all matters having relation to her property'' (neither names the husband).'
