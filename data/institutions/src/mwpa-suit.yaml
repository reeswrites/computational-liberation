- name: sue_spouse
  args: [w, h]
  effects: []
  default_capacity: true
rules_drop: [R4]
rules_add:
- id: R16
  plain: 'The wife may sue third parties in her own name when married (US suit acts: NY 1860 ch. 90 s. 7, NY 1862 ch. 172, MA 1855 c. 304 ss. 4, 7); suits against her husband stay barred (R19).'
  attribute: wife
  deontic: may
  aim: (sue w)
  conditions: (married h w)
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'UNVERIFIED (leads, not opened 2026-11-05; network fetches blocked; plans/sourcing-worklist-mwpa.md, Jurisdiction mismatch A): New York Laws 1860 ch. 90 s. 7 (may sue and be sued ''in all matters having relation to her property''), broadened by Laws 1862 ch. 172; Massachusetts St. 1855 c. 304 s. 3 (may sue and be sued as if sole, with a proviso against suits between husband and wife, R19). Read at the broader reading (NY 1862, MA 1855: as if sole, as to third parties); NY 1860''s scope to matters of her property is recorded here, not encoded. Earlier pointer kept: Geddes, Lueck & Tennyson 2007 (draft), Table 1 dates of property / earnings acts; https://isnie-archive.sioe.org/assets/files/papers2007/geddes.pdf [F, via plans/backtest-mwpa.md] (acts giving a married woman the right to sue and be sued in her own name; dates follow the property/earnings acts, e.g. NY 1860). Re-sourced 2026-11-05 (plans/sourcing.md, A2): the Married Women''s Property Act 1882 (UK), cited until then, is an English act and is no longer cited here; no English chain is kept (A3 not taken). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] has_standing(w) = sue enabled, where sue is a suit against anyone but her husband in this entry: sue is a default capacity (the former R9 ''may sue when not married'' is deleted, revision 4) and R4, the disability, is deleted; R16 is kept as the act''s own express permission Verification pass: New York Laws 1860 ch. 90, read 2026-11-06 at http://www.houseofrussell.com/american-legal-history/assignments/laws-of-new-york-83d-sessio.html (a course-site transcription, ''Passed March 20, 1860''): s. 7 ''Any married woman may, while married, sue and be sued in all matters having relation to her property'' ... ''any married woman may bring and maintain an action in her own name, for damages, against any person or body corporate, for any injury to her person or character, the same as if she were sole''. New York Laws 1862 ch. 172, read 2026-11-06 at https://www.houseofrussell.com/american-legal-history/docs/laws-of-new-york-85th-sessi.pdf (''Passed April 10, 1862''), s. 7 as amended: ''sue and be sued in all matters having relation to her sole and separate property, or which may hereafter come to her by descent, devise, bequest, purchase, or the gift or grant of any person''. Massachusetts St. 1855 c. 304, read 2026-11-06 at https://archives.lib.state.ma.us/server/api/core/bitstreams/6cc4626f-6cc6-47f5-9a38-7a775ff276b4/content (''Approved by the Governor, May 5, 1855''): s. 4 ''may, while married, sue and be sued, in all matters having relation to her property, in the same manner as if she were sole'' ... s. 7 ''she may sue and be sued as if sole in regard to her trade, business, labor, services and earnings''. The pin ''s. 3'' above is wrong (s. 3 is conveyance and contract), and the 1855 act has no proviso on suits between spouses.'
