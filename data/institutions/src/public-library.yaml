id: public-library
name: 'Public library (negative control: service duty + suspension power, patron may leave)'
roles:
- name: librarian
  gloss: library staff; serves and may suspend
- name: patron
  gloss: a library user; the counterparty, not a dependent
fluents:
- name: is_subject
  arity: 1
  gloss: 'x is the institution''s subject: the dependent, detainee, child or animal the rules act on'
  arg_roles: [patron]
- name: can_exit
  arity: 1
  gloss: x has a permitted, unsanctioned way out of the relation (see property scope)
  params: [p]
  derived: (enabled leave p)
  arg_roles: [patron]
- name: open
  arity: 1
  gloss: lb's library is open
  arg_roles: [librarian]
- name: present
  arity: 1
  gloss: p is in the library
  arg_roles: [patron]
- name: served
  arity: 2
  gloss: lb is providing service to p
  arg_roles: [librarian, patron]
- name: suspended
  arity: 1
  gloss: p's library privileges are suspended
  arg_roles: [patron]
- name: disruptive
  arity: 1
  gloss: p is behaving disruptively (exogenous)
  arg_roles: [patron]
actions:
- name: open_library
  args: [lb]
  effects:
  - fluent: open
    args: [lb]
    value: true
- name: enter
  args: [p]
  effects:
  - fluent: present
    args: [p]
    value: true
  - fluent: is_subject
    args: [p]
    value: true
  - fluent: served
    args: [librarian, p]
    value: true
- name: serve
  args: [lb, p]
  effects:
  - fluent: served
    args: [lb, p]
    value: true
- name: refuse_service
  args: [lb, p]
  effects:
  - fluent: served
    args: [lb, p]
    value: false
- name: suspend
  args: [lb, p]
  effects:
  - fluent: suspended
    args: [p]
    value: true
  - fluent: present
    args: [p]
    value: false
  - fluent: is_subject
    args: [p]
    value: false
  - fluent: served
    args: [lb, p]
    value: false
- name: leave
  args: [p]
  effects:
  - fluent: present
    args: [p]
    value: false
  - fluent: is_subject
    args: [p]
    value: false
  default_capacity: true
- name: borrow
  args: [p]
  effects: []
rules:
- id: R1
  plain: 'The librarian may open the library when it is not open.'
  attribute: librarian
  deontic: may
  aim: (open_library lb)
  conditions: (not (open lb))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: opening hours. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: opening hours'
- id: R2
  plain: 'The patron being served must hold when the library is open and the patron is present and not suspended (Berkeley Patron Suspension Policy).'
  attribute: librarian
  deontic: must
  aim: (served lb p)
  conditions: (and (open lb) (present p) (not (suspended p)))
  or_else: null
  strand: superadditive
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Berkeley Public Library, Patron Suspension Policy (orig. 2002-09-11, rev. 2018-11-14, Res. R18-053): the Library aims to ''provide and maintain a welcoming and safe environment for all patrons and library staff''; ''Violation of the Library''s Rules of Use Policy may warrant a suspension of library privileges''; ''Authorized library staff will instruct anyone displaying these behaviors to leave the library facility immediately''; https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf (service to all patrons is the policy''s premise; the duty to serve is read from it, not stated as such: UNVERIFIED as a rule). [ADR 0009: converted from an action obligation to a state obligation (must-be); the establishing action carries the state, so it does not fire every step] enter establishes served; serve restores it, refuse_service breaks it Verification pass: read 2026-11-06 at https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf: ''In order to provide and maintain a welcoming and safe environment for all patrons and library staff''.'
  provenance:
  - source_id: berkeley-public-library-2018-patron-suspension-policy
    pin: p. 1
    jurisdiction: null
    effective_date: null
    verification: opened
    excerpt: In order to provide and maintain a welcoming and safe environment for all patrons and library staff
    accessed: '2026-11-06'
    url: https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf
    note: a purpose clause, not a duty to serve
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'the rule (a duty to serve) is read from the policy''s premise, not stated: UNVERIFIED as a rule'
- id: R3
  plain: 'The librarian may suspend the patron when the patron is present and disruptive (Berkeley Patron Suspension Policy).'
  attribute: librarian
  deontic: may
  aim: (suspend lb p)
  conditions: (and (present p) (disruptive p))
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Berkeley Public Library, Patron Suspension Policy (orig. 2002-09-11, rev. 2018-11-14, Res. R18-053): the Library aims to ''provide and maintain a welcoming and safe environment for all patrons and library staff''; ''Violation of the Library''s Rules of Use Policy may warrant a suspension of library privileges''; ''Authorized library staff will instruct anyone displaying these behaviors to leave the library facility immediately''; https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf (violation of the Rules of Use ''may warrant a suspension of library privileges''; staff ''will instruct anyone displaying these behaviors to leave'') Verification pass: read 2026-11-06 at https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf: ''Continued disruption (same or different day): Library privileges will be suspended for the day by an authorized staff-member and the patron will be asked to leave the Library building.'''
  provenance:
  - source_id: berkeley-public-library-2018-patron-suspension-policy
    pin: p. 2, B.2
    jurisdiction: null
    effective_date: null
    verification: opened
    excerpt: 'Continued disruption (same or different day): Library privileges will be suspended for the day by an authorized staff-member and the patron will be asked to leave the Library building.'
    accessed: '2026-11-06'
    url: https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf
    note: suspension follows an initial warning (B.1); the row's single-step suspension of a disruptive patron skips the warning
- id: R4
  plain: 'The patron may leave at any time.'
  attribute: patron
  deontic: may
  aim: (leave p)
  conditions: 'true'
  or_else: null
  strand: rival
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'a patron is free to leave at any time; nothing in the policy holds them. UNVERIFIED (general knowledge; no source opened). [ADR 0013: power fluents are derived from rule enabledness; this rule is what the derived fluent reads] can_exit(p) = leave enabled'
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: a patron is free to leave at any time; nothing in the policy holds them'
- id: R5
  plain: 'The patron may enter when the library is open and the patron is not suspended.'
  attribute: patron
  deontic: may
  aim: (enter p)
  conditions: (and (open lb) (not (suspended p)))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: 'Berkeley Public Library, Patron Suspension Policy (orig. 2002-09-11, rev. 2018-11-14, Res. R18-053): the Library aims to ''provide and maintain a welcoming and safe environment for all patrons and library staff''; ''Violation of the Library''s Rules of Use Policy may warrant a suspension of library privileges''; ''Authorized library staff will instruct anyone displaying these behaviors to leave the library facility immediately''; https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf (a suspended patron is excluded for the suspension''s term) Verification pass: read 2026-11-06 at https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf: ''Suspension of library privileges will result in removal from, and denial of access to, all Berkeley Public Library services and facilities for a designated period of time.'''
  provenance:
  - source_id: berkeley-public-library-2018-patron-suspension-policy
    pin: p. 1
    jurisdiction: null
    effective_date: null
    verification: opened
    excerpt: Suspension of library privileges will result in removal from, and denial of access to, all Berkeley Public Library services and facilities for a designated period of time.
    accessed: '2026-11-06'
    url: https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf
    note: states that suspension denies access; the unsuspended patron's permission to enter is the converse, not stated
  var_roles:
    lb: librarian
- id: R6
  plain: 'The patron may borrow when present and not suspended.'
  attribute: patron
  deontic: may
  aim: (borrow p)
  conditions: (and (present p) (not (suspended p)))
  or_else: null
  strand: tying
  implicit: false
  kind: formal
  sanctioner: none
  sanctioner_review: derived
  source: library privileges. UNVERIFIED (general knowledge; no source opened)
  provenance:
  - source_id: null
    pin: null
    jurisdiction: null
    effective_date: null
    verification: unverified
    excerpt: null
    accessed: null
    url: null
    note: 'no work named; rationale: library privileges'
source_text: The Berkeley Public Library's Patron Suspension Policy (orig. 2002-09-11, rev. 2018-11-14, Res. R18-053) aims to 'provide and maintain a welcoming and safe environment for all patrons and library staff'; 'Violation of the Library's Rules of Use Policy may warrant a suspension of library privileges'; 'Authorized library staff will instruct anyone displaying these behaviors to leave the library facility immediately'; a patron suspended for one to six months 'has the right to a hearing with the Suspension Hearing Panel'. Read at https://www.berkeleypubliclibrary.org/sites/default/files/files/inline/patron_suspension_policy_approved_14nov2018.pdf
expected_properties:
  dependent_cannot_exit: unreachable_open
isomorphic_to: []
not_isomorphic_to: [coverture-household, police-crisis, cps]
minimal_pair_of: null
notes: 'Second negative control for gate (b), unrelated to the lease: a service duty (R2) and a rival power over the same person by the same attribute (R3, suspend) with no bar on the patron''s own exit (R4). The duty to serve is inferred from the policy''s premise of service to all, so R2 is marked UNVERIFIED as a rule. refuse_service is the breaker that keeps R2 from being inert.'
initial: []
initial_free: [disruptive]
