encoder: encoder-2
bundle_files_read: [prompt.md, goods-list.md, conventions.md, vocab/coverture-household.yaml, vocab/coverture-household-us.yaml, vocab/mwpa-earnings.yaml, vocab/coverture-floor.yaml, vocab/police-crisis.yaml, vocab/cps.yaml, vocab/kibbutz-childrens-house.yaml, vocab/ectogenesis.yaml, validate.sh]
goods:
- id: cared_for
  formal: '(forall ((s agent)) (=> (is_subject s t) (exists ((c agent)) (and (provides_care c s t) (not (can_sanction c s t))))))'
  subject: '(exists ((s agent)) (is_subject s t))'
  back_gloss: 'Every subject (the dependent) is at this step receiving care from someone who holds no power to coerce them.'
  entries: [coverture-household, police-crisis, cps, kibbutz-childrens-house, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', police-crisis: 'OK; OK', cps: 'OK; OK', kibbutz-childrens-house: 'OK; OK', ectogenesis: 'OK + warning: property candidate: undeclared fluent ''can_sanction'' (lowered as constant false); OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {ectogenesis: 'The vocabulary declares no control or coercion fluent (no can_sanction, no in_custody), so the clause that care must not come on terms of control over the person cannot be stated there.'}
  notes: 'Bearer is is_subject, the vocabulary''s dependent; in the coverture entries that is the wife. Care is provides_care from some carer; "not dependent on control" is read as: the carer who provides it does not hold a coercive power (can_sanction) over the person, so care that only arrives from a party who can detain, remove or chastise the person does not count. Reliability is not put in the state formula; it is what the stable/fragile reading across traces measures. Rejected adding (not (in_custody s t)) because in_custody is declared only in police-crisis and cps. Ectogenesis: the formula was kept unchanged and the entry recorded as not_expressible; the validator lowers can_sanction to false there, so the formula reads as "every subject receives care from someone" with the control clause vacuous.'
- id: mutual_household_care
  formal: '(forall ((h agent) (w agent)) (=> (married h w t) (and (provides_care h w t) (provides_care w h t) (=> (care_obliged h w t) (care_obliged w h t)) (=> (care_obliged w h t) (care_obliged h w t)))))'
  subject: '(exists ((h agent) (w agent)) (married h w t))'
  back_gloss: 'In every married household, each spouse is actually giving care to the other, and no rule obliges one spouse to give care without obliging the other in the same way.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'Partly: provides_care is a single undifferentiated care fluent, so cognitive labor, kinkeeping and school logistics, and the amount or share of work each does, cannot be stated; unspoken norms are not represented.', coverture-household-us: 'Partly: same as coverture-household (no differentiated or quantitative care work, no norm fluent).', mwpa-earnings: 'Partly: same as coverture-household (no differentiated or quantitative care work, no norm fluent).', coverture-floor: 'Partly: same as coverture-household (no differentiated or quantitative care work, no norm fluent).'}
  notes: 'The household is the married pair (married h w), the only household relation in these vocabularies; bearers are both spouses. "Shared in practice" is read as care flowing both ways (provides_care in each direction); "not by explicit rule" as the rule-derived care obligation (care_obliged) being symmetric between the spouses. Financial dependence as a cause of one-sided care is not a separate clause: the formula looks at the resulting distribution. A share or proportion of work cannot be stated, so "mostly on one member" collapses to "one member gives no care".'
- id: known_carer
  formal: '(forall ((s agent)) (=> (is_subject s t) (exists ((c agent)) (and (provides_care c s t) (forall ((t0 step)) (=> (succ t0 t) (or (provides_care c s t0) (not (is_subject s t0)))))))))'
  subject: '(exists ((s agent)) (is_subject s t))'
  back_gloss: 'Every subject is cared for at this step by someone who was already their carer at the previous step (unless they only just became a subject), i.e. the carer is continuing, not swapped in.'
  entries: [coverture-household, cps, kibbutz-childrens-house, ectogenesis, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', cps: 'OK; OK', kibbutz-childrens-house: 'OK; OK', ectogenesis: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'Partly: no fluent for mutual knowledge (carer knowing needs, history, preferences); approximated by continuity of the same carer.', cps: 'Partly: no fluent for mutual knowledge; approximated by continuity of the same carer.', kibbutz-childrens-house: 'Partly: no fluent for mutual knowledge and no kinship fluent; approximated by continuity of the same carer.', ectogenesis: 'Partly: no fluent for mutual knowledge; approximated by continuity of the same carer.', coverture-household-us: 'Partly: no fluent for mutual knowledge; approximated by continuity of the same carer.', mwpa-earnings: 'Partly: no fluent for mutual knowledge; approximated by continuity of the same carer.', coverture-floor: 'Partly: no fluent for mutual knowledge; approximated by continuity of the same carer.'}
  notes: 'No vocabulary has a "knows" fluent. The gloss contrasts a continuing relationship with a rotating provider, so I encode continuity: the same carer c provided care at the predecessor step (via succ). The step at which the person first becomes a subject is exempted, since a relationship that begins then is not a rotation. Rejected using a relational fluent (married in coverture, parent in cps/ectogenesis) as the mark of a known carer: it is not declared in all entries (kibbutz has none), so one formula could not carry it, and kinship is not the same as being known. One-step continuity is the weakest notion of "not rotating"; longer histories cannot be stated in a state formula without arithmetic.'
- id: child_with_family
  formal: '(forall ((c agent)) (=> (is_subject c t) (or (and (exists ((p agent)) (parent p c t)) (not (in_custody c t))) (immediate_danger c t) (exists ((p agent)) (substantial_danger p c t)))))'
  subject: '(exists ((c agent)) (is_subject c t))'
  back_gloss: 'Every child the institution acts on has a parent and is not held in institutional custody, unless the child is in immediate danger or there is a finding of substantial danger at home.'
  entries: [cps]
  validated: {cps: 'OK; OK', kibbutz-childrens-house: 'OK + warning: property candidate: undeclared fluent ''parent'' (lowered as constant false); warning: property candidate: undeclared fluent ''in_custody'' (lowered as constant false); warning: property candidate: undeclared fluent ''immediate_danger'' (lowered as constant false); warning: property candidate: undeclared fluent ''substantial_danger'' (lowered as constant false); OK', ectogenesis: 'OK + warning: property candidate: undeclared fluent ''in_custody'' (lowered as constant false); warning: property candidate: undeclared fluent ''immediate_danger'' (lowered as constant false); warning: property candidate: undeclared fluent ''substantial_danger'' (lowered as constant false); OK'}
  not_expressible: {kibbutz-childrens-house: 'No parent, custody, removal or danger fluent; the only residence fluent is at_home, which is not declared in cps or ectogenesis, so one formula cannot use it. Formula lowers there to "no subject exists" (always false at witness steps).', ectogenesis: 'No custody, removal, residence or danger fluent; only parent (registered parentage), which says nothing about living with the family. Formula lowers there to "the child has a registered parent".', cps: 'Partly: the clause that the family has enough material support to keep the child has no fluent (provides_care is declared for the social worker, not as family support).'}
  notes: 'Written for cps, the entry whose vocabulary carries removal (in_custody) and the safety exception (immediate_danger, substantial_danger). "Lives with family" is read as having a parent (parent p c) and not being held in custody; the exception "except where staying would leave them unsafe" is read as either danger fluent holding, in which case the formula does not count custody against the good. Rejected requiring provides_care from the social worker as "material support": it is the worker''s services, not the family''s means, and the gloss treats support as a precondition, not the good. Kibbutz and ectogenesis are recorded as not_expressible rather than rewritten, since no formula over shared fluents (is_subject, provides_care) states living with family.'
- id: provided_for
  formal: '(forall ((w agent)) (=> (is_subject w t) (and (exists ((c agent)) (provides_care c w t)) (or (has_own_income w t) (and (earns w t) (owns_earnings w t)) (and (acquired_property w t) (controls_own_property w t))))))'
  subject: '(exists ((w agent)) (is_subject w t))'
  back_gloss: 'Every subject (the wife) receives care and has material means in her own right: an independent income, or wages she earns and owns, or property she has and controls.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'Partly: no fluent for housing or health care, and none for the husband''s own provision; only care and income/property in her own right can be stated.', coverture-household-us: 'Partly: no housing or health-care fluent; the husband''s provision is not represented.', mwpa-earnings: 'Partly: no housing or health-care fluent; the husband''s provision is not represented.', coverture-floor: 'Partly: no housing or health-care fluent; the husband''s provision is not represented.'}
  notes: 'Bearer restricted to is_subject (the wife): the gloss says "any person", but the income and property fluents are glossed for and (in mwpa-earnings, coverture-floor) role-typed to the wife, so the husband''s provision cannot be stated. "Secure, not hinging on one person who can withdraw it" is read as having means in her own right rather than through the husband: has_own_income, or earnings that are hers (earns and owns_earnings), or property she holds (acquired_property and controls_own_property). Care is required from someone (provides_care). I did not require that the carer be someone other than the husband: with own means the care no longer hinges on him alone, and requiring a second carer would go beyond the gloss.'
- id: chosen_mutual_care
  formal: '(forall ((h agent) (w agent)) (=> (married h w t) (and (provides_care h w t) (provides_care w h t) (not (care_obliged h w t)) (not (care_obliged w h t)) (can_exit w t) (or (has_own_income w t) (and (earns w t) (owns_earnings w t)) (and (acquired_property w t) (controls_own_property w t))))))'
  subject: '(exists ((h agent) (w agent)) (married h w t))'
  back_gloss: 'In every marriage, each spouse gives care to the other, no rule obliges either to give that care, and the wife may leave and has means of her own to manage after leaving.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'Partly: exit and independent-means fluents are glossed only for the wife, so the husband''s ability to leave and be okay cannot be stated; imposition by economics or norm has no fluent beyond the wife''s means.', coverture-household-us: 'Partly: same as coverture-household.', mwpa-earnings: 'Partly: exit and means fluents are role-typed to the wife (arg_roles), so the husband''s side cannot be stated; no norm fluent.', coverture-floor: 'Partly: exit and means fluents are role-typed to the wife (arg_roles), so the husband''s side cannot be stated; no norm fluent.'}
  notes: 'The care relationship is the marriage (married h w); bearers are both spouses. Reciprocal = provides_care both ways. "Not imposed by law" = no rule in force obliges either spouse to give care (care_obliged false both ways); a symmetric legal duty still counts as imposed, so symmetry alone is not enough here, unlike mutual_household_care. "Chose and could leave and still be okay" = can_exit for the wife plus the same own-means disjunction used in provided_for. Rejected applying can_exit and has_own_income to the husband: those fluents are glossed or role-typed for the wife only. Choosing at the outset (entering the marriage freely) is not representable as a state; the formula reads the ongoing ability to leave as the mark of choice.'
