encoder: encoder-1
bundle_files_read: [prompt.md (given inline as the task text), goods-list.md, conventions.md, vocab/coverture-household.yaml, vocab/coverture-household-us.yaml, vocab/mwpa-earnings.yaml, vocab/coverture-floor.yaml, validate.sh]
goods:
- id: chosen_mutual_care
  formal: '(forall ((h agent) (w agent)) (=> (married h w t) (and (provides_care h w t) (provides_care w h t) (not (care_obliged h w t)) (not (care_obliged w h t)) (can_exit w t) (forall ((x agent)) (not (can_sanction x w t))))))'
  subject: '(exists ((h agent) (w agent)) (married h w t))'
  back_gloss: 'For every married couple (h, w) at t: the husband cares for the wife and the wife for the husband, no rule in force obliges either care (as act or state, sanctioned or not), the wife has a permitted way to leave, and no agent holds a power to sanction her.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {}
  notes: 'Bearer is the wife w in a couple, identified by (married h w t); witness steps are those where some couple is married, and P implies subject. "Care for each other" = both directions of provides_care. "No act or state of that care is required by any rule, penalty-backed or not" = negation of the derived care_obliged in both directions, whose gloss covers act or state and sanctioned or unsanctioned musts. "Can leave the marriage" = can_exit w. "No one holds a power to penalise her" = no agent x with can_sanction x w (quantified over all agents, not only the husband, since the gloss says no one). "Throughout" is read as: the formula is a state formula holding at each witness step; the engine''s per-step evaluation (stable/fragile) carries the temporal reading, so I added no temporal operator. Rejected: adding is_subject w or female w to the antecedent (the gloss picks out the wife by her place in the couple, and married h w already fixes that role; adding them would narrow the bearer without warrant). Rejected: counting can_attach c w (mwpa-earnings only) as a power to penalise her: its gloss is a creditor''s levy on property in her hands for the husband''s debts, an execution remedy rather than a power to coerce or penalise her, so the same formula is used in all four entries and mwpa-earnings reads exactly as the others. No fluent was undeclared in any entry; no not_expressible entries.'
