encoder: encoder-1
bundle_files_read: [prompt.md, goods-list.md, conventions.md, validate.sh, vocab/coverture-household.yaml, vocab/coverture-household-us.yaml, vocab/mwpa-earnings.yaml, vocab/coverture-floor.yaml, vocab/police-crisis.yaml, vocab/cps.yaml, vocab/kibbutz-childrens-house.yaml, vocab/ectogenesis.yaml]
goods:
- id: cared_for
  formal: '(forall ((x agent)) (=> (is_subject x t) (exists ((y agent)) (and (provides_care y x t) (not (= y x)) (not (can_sanction y x t))))))'
  subject: '(exists ((x agent)) (is_subject x t))'
  back_gloss: 'Every subject (the dependent the institution acts on) receives care from someone other than themselves who holds no coercive power over them.'
  entries: [coverture-household, police-crisis, cps, kibbutz-childrens-house, ectogenesis, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', police-crisis: 'OK; OK', cps: 'OK; OK', kibbutz-childrens-house: 'OK; OK', ectogenesis: 'OK / warning: property candidate: undeclared fluent ''can_sanction'' (lowered as constant false); OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {ectogenesis: 'can_sanction is not declared, so the clause that care must not come bundled with control over the person cannot be stated; no other declared fluent expresses control over the child.'}
  notes: 'Bearer "a person who needs care" read as is_subject (the vocab glosses it as the dependent the rules act on). "Care bundled with control" read as the carer holding can_sanction (power to detain, remove, chastise) over the person; care from a carer who holds that power does not count. Rejected adding in_custody as the control test because it is declared only in cps and police-crisis, while can_sanction is declared in seven of eight entries. "Reliably" is not put into the state formula; it is what the stable vs fragile reading across steps measures. Self-care excluded by (not (= y x)). In ectogenesis the validator lowers can_sanction to false, so the formula there reads only "every subject receives care from someone else"; the control part is recorded as not expressible. care_obliged not used: an obligation to care is not care received.'
- id: mutual_household_care
  formal: '(forall ((h agent) (w agent)) (=> (married h w t) (and (provides_care h w t) (provides_care w h t) (=> (care_obliged w h t) (care_obliged h w t)) (=> (care_obliged h w t) (care_obliged w h t)))))'
  subject: '(exists ((h agent) (w agent)) (married h w t))'
  back_gloss: 'In every married household both spouses give care to each other, and no rule obliges one spouse to give care without equally obliging the other.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'partial: provides_care is a yes/no relation that lumps maintenance (money) with housework and does not track how much work falls on each member or kinds such as cognitive labor, kinkeeping and school logistics; an unspoken norm or financial dependence as the cause of one-sided care has no fluent.', coverture-household-us: 'partial: same as coverture-household (no measure of the share of care work, no fluent for norms or for dependence as its cause).', mwpa-earnings: 'partial: same as coverture-household (no measure of the share of care work, no fluent for norms or for dependence as its cause).', coverture-floor: 'partial: same as coverture-household (no measure of the share of care work, no fluent for norms or for dependence as its cause).'}
  notes: 'Household read as a married pair (married h w), the only household relation declared; both members are covered by the one guard. "Each member both gives care and receives it" encoded as provides_care in both directions. "Must not fall by default on one person by explicit rule" encoded as symmetry of care_obliged (an obligation on one spouse only counts as default assignment). In these entries the formula therefore reads: both directions of care hold and any legal care duty is reciprocal; it cannot see whether one direction is mere money maintenance while the other is all the home work, which is why every entry is marked partial. Rejected adding has_own_income to stand for "not by financial dependence": that is the cause, not the distribution, and it is carried by provided_for.'
- id: known_carer
  formal: '(forall ((x agent)) (=> (exists ((y agent)) (and (not (= y x)) (provides_care y x t))) (exists ((y agent)) (and (not (= y x)) (provides_care y x t) (forall ((t2 step)) (=> (succ t t2) (provides_care y x t2)))))))'
  subject: '(exists ((x agent) (y agent)) (and (not (= y x)) (provides_care y x t)))'
  back_gloss: 'Everyone who receives care at a step has at least one carer who is still caring for them at the next step (the carer does not rotate away).'
  entries: [coverture-household, cps, kibbutz-childrens-house, ectogenesis, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', cps: 'OK; OK', kibbutz-childrens-house: 'OK; OK', ectogenesis: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'partial: no fluent for the carer knowing the person (needs, history, preferences); only continuity of the same carer is expressible.', cps: 'partial: no fluent for the carer knowing the person; only continuity of the same carer is expressible.', kibbutz-childrens-house: 'partial: no fluent for the carer knowing the person; only continuity of the same carer is expressible.', ectogenesis: 'partial: no fluent for the carer knowing the person; only continuity of the same carer is expressible.', coverture-household-us: 'partial: no fluent for the carer knowing the person; only continuity of the same carer is expressible.', mwpa-earnings: 'partial: no fluent for the carer knowing the person; only continuity of the same carer is expressible.', coverture-floor: 'partial: no fluent for the carer knowing the person; only continuity of the same carer is expressible.'}
  notes: 'Bearer "a person who receives care" read literally as anyone receiving care from another (so in the coverture entries a husband receiving care is also a bearer). "Continuing relationship rather than rotating provider" encoded as the same carer continuing to the next step, using succ(t, t2) as conventions allow for t+1; at the last bounded step the continuation clause is vacuous. Rejected the backward version (the carer also cared at the previous step) because it fails at the first step of every care relation regardless of rotation. Rejected using parent (cps, ectogenesis) or married (coverture) as the "known" relation: each is undeclared in other listed entries, so no single formula could use them, and they mark a legal tie rather than being known. One continuing carer suffices (exists), since a person can be known by one carer while others rotate. In every entry the formula reads only continuity of care, recorded as partial.'
- id: child_with_family
  formal: '(forall ((c agent)) (=> (and (is_subject c t) (exists ((p agent)) (parent p c t)) (not (immediate_danger c t)) (not (exists ((p agent)) (substantial_danger p c t)))) (not (in_custody c t))))'
  subject: '(exists ((c agent)) (is_subject c t))'
  back_gloss: 'Every child who has a parent and is in neither immediate nor substantial danger at home is not held in institutional custody (not removed from the family).'
  entries: [cps]
  validated: {cps: 'OK; OK', kibbutz-childrens-house: 'OK / warning: property candidate: undeclared fluent ''parent'' (lowered as constant false) / warning: property candidate: undeclared fluent ''immediate_danger'' (lowered as constant false) / warning: property candidate: undeclared fluent ''substantial_danger'' (lowered as constant false) / warning: property candidate: undeclared fluent ''in_custody'' (lowered as constant false); OK', ectogenesis: 'OK / warning: property candidate: undeclared fluent ''immediate_danger'' (lowered as constant false) / warning: property candidate: undeclared fluent ''substantial_danger'' (lowered as constant false) / warning: property candidate: undeclared fluent ''in_custody'' (lowered as constant false); OK'}
  not_expressible: {kibbutz-childrens-house: 'parent, in_custody and the danger fluents are undeclared; the vocabulary has no parent relation and no removal, only at_home (the child sleeps in the parents home). The formula there lowers its guard to false and is vacuously true with no witness steps. A kibbutz-only encoding would be (forall ((c agent)) (=> (is_subject c t) (at_home c t))), which carries living with family but not the safety exception or family support.', ectogenesis: 'in_custody and the danger fluents are undeclared; the vocabulary has parent but no fluent for living with, being separated from, or being removed from the family. The formula there reduces to true for every subject with a parent (no content).'}
  notes: 'No fluent is shared by all three entries that expresses living with or separation from family, so one formula cannot serve them; written for cps, whose vocabulary carries removal (in_custody), the family tie (parent) and the safety exception (immediate_danger, substantial_danger). The exception "except where staying would leave them unsafe" is put in the guard, so danger steps are not witness steps rather than counting as success. A child with no recorded parent is not a bearer (there is no family to stay with). "Family has enough material support" is not encoded: cps provides_care is the worker providing services to the child, not support to the family, and the gloss presents support as what makes keeping the child possible rather than as the good itself. Rejected encoding via parent + provides_care (declared in cps and ectogenesis) because it says a parent gives care, not that the child is not separated.'
- id: provided_for
  formal: '(forall ((x agent)) (=> (is_subject x t) (and (or (has_own_income x t) (and (earns x t) (owns_earnings x t))) (exists ((y agent)) (and (not (= y x)) (provides_care y x t))))))'
  subject: '(exists ((x agent)) (is_subject x t))'
  back_gloss: 'Every subject has an income in her own right (an independent income, or wages she earns and keeps as her own) and receives care from someone.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'partial: no fluents for housing or health care, and none for whether provision hinges on accepting an imposed bundle; the vocabulary tracks provision only for the subject (wife), not for any person.', coverture-household-us: 'partial: same as coverture-household (no housing or health fluents, no fluent for an imposed bundle, provision tracked only for the subject).', mwpa-earnings: 'partial: same as coverture-household (no housing or health fluents, no fluent for an imposed bundle, provision tracked only for the subject).', coverture-floor: 'partial: same as coverture-household (no housing or health fluents, no fluent for an imposed bundle, provision tracked only for the subject).'}
  notes: 'Bearer "any person" narrowed to is_subject because the income fluents (has_own_income, earns, owns_earnings) are about the wife; quantifying over all agents would make the husband or creditor fail for lack of modelled income, not for lack of provision. "Must not hinge on depending on one particular other person, such as a breadwinner spouse" encoded as income in her own right: has_own_income, or earnings she both earns and owns. Rejected counting controls_own_property / acquired_property as income: property is not income and the gloss lists income. Care component: some other person provides care to her; whether that care can be withdrawn at will is not expressible. Housing and health are not in the vocabulary, so the formula reads income + care only.'
- id: chosen_mutual_care
  formal: '(forall ((x agent) (y agent)) (=> (and (is_subject x t) (not (= x y)) (or (provides_care x y t) (provides_care y x t))) (and (provides_care x y t) (provides_care y x t) (not (care_obliged x y t)) (not (care_obliged y x t)) (can_exit x t) (or (has_own_income x t) (and (earns x t) (owns_earnings x t))))))'
  subject: '(exists ((x agent) (y agent)) (and (is_subject x t) (not (= x y)) (or (provides_care x y t) (provides_care y x t))))'
  back_gloss: 'For every subject in a care relation with another person: care runs both ways, no rule obliges either of them to give that care, and the subject may leave and has an income of her own to live on if she does.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {coverture-household: 'partial: no fluent for care imposed by norm, and "still be okay after leaving" is reachable only through income (no housing, health or care-after-exit fluents); exit and own income are modelled only for the subject, so the other party of the relation is not covered as a bearer.', coverture-household-us: 'partial: same as coverture-household (no norm fluent, okay-after-exit only via income, exit and income modelled only for the subject).', mwpa-earnings: 'partial: same as coverture-household (no norm fluent, okay-after-exit only via income, exit and income modelled only for the subject).', coverture-floor: 'partial: same as coverture-household (no norm fluent, okay-after-exit only via income, exit and income modelled only for the subject).'}
  notes: 'Bearer "each person in a care relationship" narrowed to the subject in a care relation (care given or received with another person), because can_exit and the income fluents are modelled for the wife only. Mutual = provides_care both ways. "Not imposed by law" = no care_obliged in either direction (an obligation on either party makes the relation imposed rather than chosen). "Chosen and could leave and still be okay" = can_exit plus an income of her own (same income test as provided_for), which also stands for "not imposed by economics". Rejected using married as the relation guard: the gloss is about care relations, and a marriage without care in either direction is not a care relationship. Imposition by norm has no fluent; the formula reads law and economic imposition only.'
