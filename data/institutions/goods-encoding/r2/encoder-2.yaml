encoder: encoder-2
bundle_files_read: [prompt.md, goods-list.md, conventions.md, vocab/coverture-household.yaml, vocab/coverture-household-us.yaml, vocab/mwpa-earnings.yaml, vocab/coverture-floor.yaml, validate.sh]
goods:
- id: chosen_mutual_care
  formal: '(forall ((h agent) (w agent)) (=> (married h w t) (and (provides_care h w t) (provides_care w h t) (can_exit w t) (not (exists ((x agent)) (can_sanction x w t))))))'
  subject: '(exists ((h agent) (w agent)) (married h w t))'
  back_gloss: 'For every married couple at t, the husband cares for the wife, the wife cares for the husband, the wife has a permitted unsanctioned way out, and no one holds a power to coerce her.'
  entries: [coverture-household, coverture-household-us, mwpa-earnings, coverture-floor]
  validated: {coverture-household: 'OK; OK', coverture-household-us: 'OK; OK', mwpa-earnings: 'OK; OK', coverture-floor: 'OK; OK'}
  not_expressible: {}
  notes: 'One formula for all four entries; every fluent used (married, provides_care, can_exit, can_sanction) is declared in each. Bearer is the wife within a married couple, so the antecedent and the subject are both married(h, w, t); the antecedent therefore implies the subject and witness steps are the steps with a married couple. Care is required in both directions (provides_care h w and w h), as the gloss says care both give. "She is free not to give" is carried, per the goods-list reading, by can_exit w plus no sanction power over w; I did not try to express freedom not to give as a modal/temporal condition on neglect_house, since enabled is unavailable in property formulas and no derived fluent wraps neglect_house. The sanction clause quantifies over any agent x (not only the husband h), following "no one holds a power to sanction her"; any sanction power counts, not only one tied to her care, as the goods-list notes. Rejected: adding is_subject w or female w to the antecedent (married already identifies the couple; adding them would narrow the bearer beyond the gloss). Rejected: adding (not (exists c (can_attach c w t))) in mwpa-earnings: can_attach is a creditor power over property in her hands for the husband''s debts, not a power to coerce her person in the can_sanction sense, the goods-list fixes the reading to can_sanction, and adding it would split the formula by entry. Rejected: requiring care only from the husband (that drops "mutual").'
